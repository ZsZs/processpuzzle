name: Build-ProcessPuzzle-Testbed-Frontend
on:
  push:
    branches:
      - "feature/**"
    paths:
      # This workflow is the only one that runs the Playwright suite, so what the suite is made of has to
      # trigger it too — the e2e project and the library its tests are generated from.
      - 'apps/processpuzzle-testbed-frontend/**'
      - 'apps/processpuzzle-testbed-e2e/**'
      - 'libs/js-shared/e2e-testing/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "develop" ]
    paths:
      - 'apps/processpuzzle-testbed-frontend/**'
      - 'apps/processpuzzle-testbed-e2e/**'
      - 'libs/js-shared/e2e-testing/**'
  workflow_run:
    workflows: [ "Build-Auth", "Build-Base-Entity-Frontend", "Build-Util", "Build-Widgets" ]
    types:
      - completed
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_TOKEN }}
      PIPELINE_STAGE: "ci"
    outputs:
      RUNNER: ${{ runner.name }}
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: lint-test-build
        name: Lint test and build the application
        uses: ./.github/actions/lint-test-build
        with:
          base_dir: 'apps/processpuzzle-testbed-frontend'
          nx_project: processpuzzle-testbed-frontend
          github_token: ${{secrets.GITHUB_TOKEN}}
          sonar_token: ${{secrets.SONAR_TOKEN}}
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}

      - id: build-backend
        name: Build backend jar
        run: npx nx run processpuzzle-testbed-backend:build --no-cloud

      - id: build-compose-frontends
        name: Build compose frontend bundles
        run: |
          npx nx run processpuzzle-admin-frontend:build --configuration=production --no-cloud
          npx nx run processpuzzle-biz-frontend:build --configuration=production --no-cloud

      - id: docker-compose
        name: run-docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: './tools/docker/docker-compose-ci.yaml'

      - id: e2e-test
        name: run-e2e-tests
        uses: ./.github/actions/e2e-test
        with:
          base_dir: 'apps/processpuzzle-testbed-e2e'
          target_environment: 'ci'
