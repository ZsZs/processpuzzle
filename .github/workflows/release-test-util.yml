name: Release-Test-Util
on:
  push:
    branches:
      - "release/test-util/*"
    paths:
      - 'libs/js-shared/test-util/**'
permissions:
  id-token: write
  contents: write
  pull-requests: write
  repository-projects: write
jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: package-version
        name: Get Version from package.json
        uses: martinbeentjes/npm-get-version-action@v1.3.1
        with:
          path: libs/js-shared/test-util

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v4

      - run: |
          echo "BASE: ${{ env.NX_BASE }}"
          echo "HEAD: ${{ env.NX_HEAD }}"

      - id: lint-test-build
        name: Lint test and build the application
        uses: ./.github/actions/lint-test-build
        with:
          base_dir: "libs/js-shared/test-util"
          nx_project: "test-util"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}

      - name: Config Git
        shell: bash
        run: |
          git config --global user.email "zsolt.zsuffa@gmail.com"
          git config --global user.name "Zsolt Zsuffa"

      - name: Publish packages
        shell: bash
        # NPM_CONFIG_LOGLEVEL surfaces npm's OIDC token-exchange request, which is the only way to
        # tell an unattempted exchange (npm too old) from a rejected one (publisher claim mismatch).
        # Remove both the diagnostics and this env once trusted publishing is confirmed working.
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          npm install -g npm@latest
          echo "node=$(node -v) npm=$(npm -v) which=$(which npm)"
          echo "OIDC request url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          npx nx release publish --projects=test-util --access public --no-cloud

      - name: Create a Release
        uses: elgohr/Github-Release-Action@v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "@processpuzzle/test-util/${{steps.package-version.outputs.current-version}}"
          tag: "test-util@${{steps.package-version.outputs.current-version}}"

      - name: Merge release branch to develop and master
        uses: ./.github/actions/release-merge
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
