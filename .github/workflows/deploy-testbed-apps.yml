name: Deploy-Testbed-Apps

# Moves an environment's tag onto the testbed stack's two application images and triggers the Coolify
# redeploy of the **Docker Compose resource** that runs them — docs/build-deploy-strategy.md §4. The
# application-layer counterpart of Deploy-Infrastructure: same `resolve` / `promote` / `deploy` shape,
# and like the infrastructure layer, one resource and one webhook for the whole stack.
#
# §4 originally gave each application image its own Application resource, so that redeploying one app
# never touched another. The deployed topology is one compose resource per *stack* instead — see the
# `deploy` job. Both halves therefore restart together, which is the price of letting compose order
# them.
#
# TWO WAYS IN, and no `push:` trigger of its own — Build-ProcessPuzzle-Testbed-Apps owns that:
#
#   1. workflow_call with image_tag  — what the build workflow does on `develop`: promote the digests
#      it just pushed to :stage, then deploy.
#   2. workflow_dispatch with image_tag — promote a verified sha-<commit> to PROD. This is the path
#      that makes stage→prod a re-tag rather than a rebuild (strategy §9).
#
# Deliberately NO build-from-source escape hatch, which is where this diverges from
# Deploy-Infrastructure. Building these images means an Angular production build and a Maven
# `package` before `docker build` — the whole of the build workflow's two jobs. Duplicating that here
# would give two definitions of how the applications are built, and they would drift. To stand an
# environment up from nothing, run Build-ProcessPuzzle-Testbed-Apps on `develop` and let it call this
# workflow, or dispatch this one with a sha-<commit> that already exists in GHCR.
#
# `image_tag` is therefore required, not optional.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [ STAGE, PROD ]
        default: STAGE
      image_tag:
        description: "The existing sha-<commit> tag to promote (this workflow never builds)"
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true

concurrency:
  # One deployment of one environment at a time. Never cancel in flight: a half-applied deployment is
  # worse than a queued one.
  group: deploy-testbed-apps-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT: ${{ inputs.environment || 'STAGE' }}
        run: |
          set -euo pipefail
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          # The moving tag the Coolify resources watch: `stage` / `prod`, lower case because a Docker
          # tag is case-sensitive.
          echo "env_tag=$(echo "${ENVIRONMENT}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # Promotion re-tags rather than rebuilds, so the exact bytes verified on stage are what reach
  # production — docs/build-deploy-strategy.md §9. `imagetools create` copies the manifest inside the
  # registry; nothing is pulled, built or pushed.
  promote:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the verified images
        env:
          SOURCE_TAG: ${{ inputs.image_tag }}
          TARGET_TAG: ${{ needs.resolve.outputs.env_tag }}
        run: |
          set -euo pipefail
          for IMAGE in processpuzzle-testbed-frontend processpuzzle-testbed-backend; do
            echo "::group::${IMAGE}: ${SOURCE_TAG} -> ${TARGET_TAG}"
            docker buildx imagetools create \
              --tag "ghcr.io/zszs/${IMAGE}:${TARGET_TAG}" \
              "ghcr.io/zszs/${IMAGE}:${SOURCE_TAG}"
            echo "::endgroup::"
          done

  deploy:
    needs: [ resolve, promote ]
    runs-on: ubuntu-latest
    # Resolves the per-environment secrets and variables below.
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      # BEFORE the deployment, because the two steps that verify it are `if:`-gated on these variables
      # and an unset variable makes a step SKIP — silently, and with a green run to show for it. That is
      # how the stage outage of 2026-09-15 got through: the `postgres_data` volume had been replaced
      # under a running backend, every request answered 500 `relation "base_…" does not exist`, and the
      # deployment that preceded it reported success because the STAGE environment declared neither URL
      # and therefore ran neither the readiness poll nor the e2e suite.
      #
      # On STAGE the verification is not optional — a stack nothing exercises is a stack nobody knows
      # about. PROD is still allowed to omit them: it runs the `smoke` scope and its hostnames are not
      # settled (env/.env.prod says `.de`, docs/application-stacks.md says `.com`).
      - name: Require the verification URLs
        if: ${{ needs.resolve.outputs.environment == 'STAGE' }}
        env:
          TESTBED_FRONTEND_PUBLIC_URL: ${{ vars.TESTBED_FRONTEND_PUBLIC_URL }}
          TESTBED_BACKEND_PUBLIC_URL: ${{ vars.TESTBED_BACKEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          MISSING=
          if [ -z "${TESTBED_FRONTEND_PUBLIC_URL}" ]; then MISSING="${MISSING} TESTBED_FRONTEND_PUBLIC_URL"; fi
          if [ -z "${TESTBED_BACKEND_PUBLIC_URL}" ]; then MISSING="${MISSING} TESTBED_BACKEND_PUBLIC_URL"; fi
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing in the STAGE environment:${MISSING}. The readiness poll and the post-deploy e2e run are gated on these, so the deployment would report success without verifying anything. Set them under Settings -> Environments -> STAGE."
            exit 1
          fi
          echo "Verifying against ${TESTBED_FRONTEND_PUBLIC_URL} and ${TESTBED_BACKEND_PUBLIC_URL}."

      - name: Checkout source code
        uses: actions/checkout@v5

      # ONE webhook, because the testbed stack is ONE Coolify Docker Compose resource holding both
      # halves — not the two Application resources docs/build-deploy-strategy.md §4 assumed. Two
      # consequences: ordering the backend ahead of the frontend is compose's job (`depends_on` in
      # docker-compose-apps.yaml), not this workflow's; and firing the one webhook twice would deploy
      # the whole stack twice.
      #
      # A missing secret now FAILS — the composite action exits 1 on an empty webhook. The earlier
      # warn-and-continue existed so the two resources could be created one at a time; with a single
      # resource there is no half-configured state worth tolerating, and a green run that deployed
      # nothing is the failure mode this replaces.
      - name: Redeploy the testbed stack
        uses: ./.github/actions/coolify-deploy
        with:
          webhook: ${{ secrets.COOLIFY_WEBHOOK_TESTBED }}
          token: ${{ secrets.COOLIFY_TOKEN }}

      # A red workflow should mean a red deployment. Skipped when the environment declares neither
      # URL, since a stack behind a proxy need not expose either publicly.
      #
      # TWO PHASES, because the webhook is ASYNCHRONOUS and a one-phase gate races it. Coolify
      # answers `deployment queued` and returns while the OUTGOING containers are still serving, so
      # the single `until curl` loop this replaces went green in 0.4s -- against the very deployment
      # whose replacement it was meant to certify. Run 35004995055 on 2026-09-15 is the case: two
      # probes "ready" at 18:14:13, and by 18:15:46 Traefik was answering 503 `no available server`
      # for both hostnames, which the e2e suite downloaded and tried to parse as JSON.
      #
      # Waiting for the swap to BEGIN is what makes waiting for it to FINISH mean anything. Neither
      # image carries a version endpoint, so there is no cheap way to ask whether the NEW containers
      # are the ones answering -- the gate uses the outage instead. The frontend cannot answer
      # between compose recreating it and `testbed-backend` passing its healthcheck, and that is
      # 145-262s of backend start-up (docker-compose-apps.yaml), so an observed failure is the swap
      # rather than a flake.
      #
      # The Coolify deployment API would report this directly, and was considered: `COOLIFY_TOKEN`
      # carries only the `deploy` ability (docs/stage-deployment-runbook.md) and
      # `GET /deployments/{uuid}` has an open bug that reports an active deployment as not found
      # (coollabsio/coolify#8925). Neither is worth a token rotation for a signal the outage already
      # gives.
      - name: Wait for the applications to report ready
        if: ${{ vars.TESTBED_FRONTEND_PUBLIC_URL != '' || vars.TESTBED_BACKEND_PUBLIC_URL != '' }}
        env:
          TESTBED_FRONTEND_PUBLIC_URL: ${{ vars.TESTBED_FRONTEND_PUBLIC_URL }}
          TESTBED_BACKEND_PUBLIC_URL: ${{ vars.TESTBED_BACKEND_PUBLIC_URL }}
        run: |
          set -uo pipefail

          # The frontend is the sentinel: it is the last service to come up, because its
          # `depends_on` waits on the backend's healthcheck, and it is what the e2e suite targets.
          SENTINEL="${TESTBED_FRONTEND_PUBLIC_URL:+${TESTBED_FRONTEND_PUBLIC_URL}/home}"
          if [ -z "${SENTINEL}" ]; then
            SENTINEL="${TESTBED_BACKEND_PUBLIC_URL:+${TESTBED_BACKEND_PUBLIC_URL}/actuator/health}"
          fi

          # -- Phase 1: the outgoing containers stop answering ------------------------------------
          #
          # Capped, and a warning rather than an error when the cap is reached. A redeploy of an
          # unchanged digest can be a no-op, and there is then no outage to observe; failing here
          # would turn that into a red deployment. Phase 2 still has to pass either way. An already
          # broken stack satisfies this immediately, which is what makes the gate usable to recover
          # one.
          echo "Waiting for the redeploy to take ${SENTINEL} down"
          SWAP_DEADLINE=$(( $(date +%s) + 240 ))
          SWAP_SEEN=false
          while [ "$(date +%s)" -lt "${SWAP_DEADLINE}" ]; do
            if ! curl -fs -o /dev/null --max-time 10 "${SENTINEL}"; then
              echo "  down -- the new containers are starting"
              SWAP_SEEN=true
              break
            fi
            sleep 5
          done
          if [ "${SWAP_SEEN}" = false ]; then
            echo "::warning::${SENTINEL} never stopped answering within 240s. Either Coolify skipped the deploy (unchanged digest, or the resource lacks 'pull latest images and restart') or it has not started yet -- in which case the poll below is certifying the PREVIOUS deployment."
          fi

          # -- Phase 2: the new containers answer, and keep answering -----------------------------
          #
          # The backend's own budget is 420s on a first start against an empty database, where
          # Spring Modulith's ArchUnit pass is joined by the metadata seeding, and the frontend only
          # starts once that healthcheck passes -- so this waits longer than the infrastructure gate
          # does.
          DEADLINE=$(( $(date +%s) + 600 ))
          for PROBE in "${TESTBED_BACKEND_PUBLIC_URL:+${TESTBED_BACKEND_PUBLIC_URL}/actuator/health}" \
                       "${TESTBED_FRONTEND_PUBLIC_URL:+${TESTBED_FRONTEND_PUBLIC_URL}/home}"; do
            [ -z "${PROBE}" ] && continue
            echo "Probing ${PROBE}"
            # THREE consecutive successes, 5s apart. One is not enough while compose is still
            # working through the file: Traefik will route to a container that is replaced moments
            # later, and the e2e suite then starts against a stack on its way back down.
            STREAK=0
            while [ "${STREAK}" -lt 3 ]; do
              if curl -fs -o /dev/null --max-time 10 "${PROBE}"; then
                STREAK=$(( STREAK + 1 ))
              else
                STREAK=0
              fi
              [ "${STREAK}" -ge 3 ] && break
              if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                # The observed status, because the distinction matters and is otherwise invisible:
                # 503 with a `no available server` body is Traefik holding no healthy container for
                # the hostname (read the compose healthchecks and the container logs), while a 502
                # served as HTML is the frontend's own nginx failing to reach an upstream.
                STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PROBE}" || echo "no response")
                echo "::error::${PROBE} did not answer 200 three times in a row within 10 minutes; last status ${STATUS}."
                exit 1
              fi
              sleep 5
            done
            echo "  ready"
          done

      # == TEMPORARILY DISABLED =======================================================================
      #
      # RESTORE THIS. Commented out while the Coolify deployment itself is being fixed: until the
      # stack reliably comes back up, this step can only report the deployment's failure a second
      # time, and it costs ~90s of `npm ci` and browser download to do it. The readiness poll above
      # is deliberately LEFT IN PLACE — it is the diagnostic for what is being fixed, and it fails
      # fast with the observed HTTP status.
      #
      # The `e2e-test` action is unchanged and still runs in Build- and
      # Release-ProcessPuzzle-Testbed-Frontend, which drive a local stack rather than Coolify.
      #
      # Re-enable by deleting the `# ` prefix from the block below, once a deploy reaches
      # "  ready" on both probes.
      #
      # The integration test the deleted Firebase deploy workflow used to run after a STAGE deploy.
      # Gated the same way as the readiness poll, so it stays dormant until the environment declares
      # a public URL — the e2e project reads the host it targets from
      # apps/processpuzzle-testbed-e2e/env/.env.<environment>, so that file has to agree with it.
      # - name: Integration test against the deployed environment
      #   if: ${{ vars.TESTBED_FRONTEND_PUBLIC_URL != '' }}
      #   uses: ./.github/actions/e2e-test
      #   with:
      #     base_dir: 'apps/processpuzzle-testbed-e2e'
      #     target_environment: ${{ needs.resolve.outputs.env_tag }}
      #     test_scope: ${{ needs.resolve.outputs.env_tag == 'prod' && 'smoke' || 'full' }}
      #
      # ===============================================================================================
