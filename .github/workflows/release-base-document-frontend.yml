name: Release-Base-Document-Frontend
on:
  push:
    branches:
      - "release/base-document-frontend/*"
    paths:
      - 'libs/js-shared/base-document-frontend/**'
permissions:
  id-token: write
  contents: write
  pull-requests: write
  repository-projects: write
jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: package-version
        name: Get Version from package.json
        uses: martinbeentjes/npm-get-version-action@v1.3.1
        with:
          path: libs/js-shared/base-document-frontend

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v4

      - run: |
          echo "BASE: ${{ env.NX_BASE }}"
          echo "HEAD: ${{ env.NX_HEAD }}"

      - id: lint-test-build
        name: Lint test and build the application
        uses: ./.github/actions/lint-test-build
        with:
          base_dir: 'libs/js-shared/base-document-frontend'
          nx_project: base-document-frontend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}

      - name: Config Git
        shell: bash
        run: |
          git config --global user.email "zsolt.zsuffa@gmail.com"
          git config --global user.name "Zsolt Zsuffa"

      # TEMPORARY — remove once the first publish of @processpuzzle/base-document succeeds.
      # npm answers 404 both for "token not authorized for this name" and for "no token at
      # all", so the publish error alone cannot tell the two apart. Prints no secret values:
      # only the token's length, the .npmrc with values redacted, and what the token can see.
      - name: Diagnose npm auth
        continue-on-error: true
        shell: bash
        run: |
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          userconfig=$(npm config get userconfig)
          echo "--- $userconfig (values redacted) ---"
          sed 's/=.*/=<redacted>/' "$userconfig" 2>/dev/null || echo "(no such file)"
          echo "--- npm whoami ---"
          npm whoami || echo "whoami FAILED"
          echo "--- npm access list packages ---"
          npm access list packages 2>&1 | head -40 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        shell: bash
        run: npx nx release publish --projects=base-document-frontend --access public --no-cloud
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create a Release
        uses: elgohr/Github-Release-Action@v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "@processpuzzle/base-document/${{steps.package-version.outputs.current-version}}"
          tag: "base-document-frontend@${{steps.package-version.outputs.current-version}}"

      - name: Merge release branch to develop and master
        uses: ./.github/actions/release-merge
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
