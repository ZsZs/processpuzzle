name: Build-Processpuzzle-UI
on:
  push:
    branches:
      - "feature/**"
      - "develop"
    paths:
      - 'apps/processpuzzle-ui/**'
      - 'libs/js-shared/org-admin-frontend/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "develop" ]
    paths:
      - 'apps/processpuzzle-ui/**'
      - 'libs/js-shared/org-admin-frontend/**'
  workflow_run:
    workflows: [ "Build-Org-Admin-Frontend" ]
    types:
      - completed
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PIPELINE_STAGE: "ci"
    outputs:
      RUNNER: ${{ runner.name }}
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: lint-test-build
        name: Lint test and build the application
        uses: ./.github/actions/lint-test-build
        with:
          base_dir: 'apps/processpuzzle-ui'
          nx_project: processpuzzle-ui
          github_token: ${{secrets.GITHUB_TOKEN}}
          sonar_token: ${{secrets.SONAR_TOKEN}}
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}
