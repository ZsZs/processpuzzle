name: Release-ProcessPuzzle-Testbed-Frontend
on:
  push:
    branches:
      - "release/processpuzzle-testbed-frontend/*"
permissions:
  id-token: write
  contents: write
  pull-requests: write
  repository-projects: write
jobs:
  # Publishes the npm package and cuts the GitHub release. It no longer DEPLOYS anything: the prod
  # container deployment is Deploy-Testbed-Apps dispatched with `environment: PROD` and a verified
  # `sha-<commit>`, which promotes an existing image rather than building a second one here — see
  # docs/build-deploy-strategy.md §9.
  release-testbed-frontend:
    environment: PROD
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: package-version
        name: Get Version from package.json
        uses: martinbeentjes/npm-get-version-action@v1.3.1
        with:
          path: apps/processpuzzle-testbed-frontend

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v4

      - run: |
          echo "BASE: ${{ env.NX_BASE }}"
          echo "HEAD: ${{ env.NX_HEAD }}"

      - id: lint-test-build
        name: Lint test and build the application
        uses: ./.github/actions/lint-test-build
        with:
          base_dir: 'apps/processpuzzle-testbed-frontend'
          nx_project: processpuzzle-testbed-frontend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          firebase_token: ${{ secrets.FIREBASE_API_KEY }}
          cicd_stage: 'prod'

      # Smoke-tests whatever is CURRENTLY deployed at prod — this workflow no longer puts it there,
      # so a failure here means prod needs a Deploy-Testbed-Apps run, not that this release is bad.
      - id: integration-test
        name: run-integration-tests
        uses: ./.github/actions/e2e-test
        with:
          target_environment: 'prod'
          base_dir: 'apps/processpuzzle-testbed-e2e'
          test_scope: 'smoke'

      - name: Config Git
        shell: bash
        run: |
          git config --global user.email "zsolt.zsuffa@gmail.com"
          git config --global user.name "Zsolt Zsuffa"

      - name: Copy package.json
        shell: bash
        run: |
          cp -R apps/processpuzzle-testbed-frontend/package.json dist/apps/processpuzzle-testbed-frontend
          cp -R apps/processpuzzle-testbed-frontend/README.md dist/apps/processpuzzle-testbed-frontend
          rm dist/apps/processpuzzle-testbed-frontend/browser/environments/environment.ts

      - name: Publish packages
        shell: bash
        run: npx nx release publish --projects=processpuzzle-testbed-frontend --access public --no-cloud
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create a Release
        uses: elgohr/Github-Release-Action@v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "@processpuzzle/testbed/${{steps.package-version.outputs.current-version}}"
          tag: "testbed@${{steps.package-version.outputs.current-version}}"

      - name: Merge release branch to develop and master
        uses: ./.github/actions/release-merge
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
