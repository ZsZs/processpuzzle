name: e2e-tests
description: End to End playwright tests
inputs:
  target_environment:
    description: Target environment.
    required: true
    default: ci
  base_dir:
    description: Base directory of Playwright tests
    required: true
  test_scope:
    description: 'full = run all e2e tests; smoke = run only @smoke-tagged tests'
    required: false
    default: full
  workers:
    description: 'Playwright workers: spec files that run side by side. One for a deployed environment, more for a stack this job started.'
    required: false
    default: '1'
  allow_release:
    description: >-
      'true' lets specs release every pending definition of the organization, which they need to run a workflow
      they created (the timer specs) and which cannot be undone. Only for a stack this job started and nobody else
      uses; never for a deployed environment.
    required: false
    default: 'false'
  browsers:
    description: 'Comma-separated list of browsers to install and test (e.g. "chromium,firefox,webkit,edge"). Defaults to "chromium".'
    required: false
    default: 'chromium'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      shell: bash

    - name: Install Playwright Browsers
      run: |
        # The `setup` project and the global setup always run in Chromium, whatever browsers are under test
        # (playwright.config.ts), so a job for firefox, webkit or edge needs it too: without it they fail at
        # launch with "Executable doesn't exist ... chromium_headless_shell".
        echo "Installing Playwright browser: chromium (setup)"
        npx playwright install chromium --with-deps
        IFS=',' read -ra BROWSER_LIST <<< "${{ inputs.browsers }}"
        for browser in "${BROWSER_LIST[@]}"; do
          browser=$(echo "$browser" | tr -d '[:space:]')
          [ "$browser" = chromium ] && continue
          # The config names the project `edge`; Playwright installs it as `msedge`.
          [ "$browser" = edge ] && browser=msedge
          echo "Installing Playwright browser: $browser"
          npx playwright install "$browser" --with-deps
        done
      shell: bash

    - name: Run Playwright tests
      run: |
        if [ "${{ inputs.test_scope }}" = "smoke" ]; then
          npm run e2e-smoke-test-processpuzzle-testbed
        else
          npm run e2e-test-processpuzzle-testbed
        fi
      shell: bash
      env:
        ENVIRONMENT: ${{inputs.target_environment}}
        E2E_WORKERS: ${{inputs.workers}}
        E2E_ALLOW_RELEASE: ${{inputs.allow_release}}
        E2E_BROWSERS: ${{inputs.browsers}}

    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ inputs.browsers }}-${{ github.sha }}
        path: ${{inputs.base_dir}}/reports/e2e
        retention-days: 30
