name: e2e-tests
description: End to End playwright tests
inputs:
  target_environment:
    description: Target environment.
    required: true
    default: ci
  base_dir:
    description: Base directory of Playwright tests
    required: true
  test_scope:
    description: 'full = run all e2e tests; smoke = run only @smoke-tagged tests'
    required: false
    default: full
  allow_release:
    description: >-
      'true' lets specs release every pending definition of the organization, which they need to run a workflow
      they created (the timer specs) and which cannot be undone. Only for a stack this job started and nobody else
      uses; never for a deployed environment.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      shell: bash

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
      shell: bash

    - name: Run Playwright tests
      run: |
        if [ "${{ inputs.test_scope }}" = "smoke" ]; then
          npm run e2e-smoke-test-processpuzzle-testbed
        else
          npm run e2e-test-processpuzzle-testbed
        fi
      shell: bash
      env:
        ENVIRONMENT: ${{inputs.target_environment}}
        E2E_ALLOW_RELEASE: ${{inputs.allow_release}}

    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ github.sha }}
        path: ${{inputs.base_dir}}/reports/e2e
        retention-days: 30
