name: lint-test-build
description: Lint test and build the application
inputs:
  base_dir:
    description: Base director of the source code
    required: true
  nx_project:
    description: Name of the Nx project
    required: true
  github_token:
    description: Token to get access to Github
    required: true
  sonar_token:
    description: Token to get access to SonarCloud
    required: true
  cicd_stage:
    description: Actual stage in the CI/CD pipeline
    required: true
    default: 'ci'
  java-version:
    description: Java version to use
    required: false
    default: '25'
runs:
  using: composite
  steps:
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package.json
          package-lock.json
    - name: Install JavaScript dependencies
      run: npm install --legacy-peer-deps --ignore-scripts
      shell: bash
    - name: Setup Java ${{ inputs.java-version }}
      # setup-java writes ~/.m2/settings.xml with a `github` server; the credentials stay env
      # references, resolved when Maven runs. A consumer of the libs on GitHub Packages
      # (processpuzzle-biz) sets PACKAGES_TOKEN — a PAT with read:packages, because GitHub's
      # Maven registry does not let another repository's GITHUB_TOKEN read these packages.
      # This repository builds its libs from source and leaves it unset.
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}
        cache: 'maven'
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: PACKAGES_TOKEN
    - name: Report Maven version
      # Uses the Maven preinstalled on the runner image (3.9.x) rather than
      # downloading a pinned tarball. stCarolas/setup-maven fetched Maven from
      # repo.maven.apache.org on every run with no cache and no retry, and
      # Central's rate limiting made that a recurring HTTP 429 build failure.
      # Nothing here needs a specific Maven version: no requireMavenVersion
      # enforcer, and every call site is plain `mvn` on PATH.
      run: mvn -v
      shell: bash
    - name: Lint libs and apps
      run: npm run lint-${{inputs.nx_project}}
      shell: bash
    - name: Test libs and apps
      run: npm run test-${{inputs.nx_project}}
      shell: bash
    - name: Sanitize LCOV paths
      run: node tools/scripts/sanitize-lcov.cjs ${{ inputs.base_dir }}
      shell: bash
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        projectBaseDir: ${{inputs.base_dir}}
    - name: Generate environment file
      run: npm run config-env-${{inputs.nx_project}} -- --environment=${{inputs.cicd_stage}}
      env:
        PIPELINE_STAGE: ${{inputs.cicd_stage}}
      shell: bash
    - name: Build libs and apps
      run: npm run build-${{inputs.nx_project}} --if-present
      shell: bash

    - name: Upload Test Report
      uses: actions/upload-artifact@v5
      with:
        name: test-coverage-report-${{ github.sha }}
        # The whole directory, not the istanbul-only lcov-report/ subdirectory: java
        # projects have jacoco's index.html + jacoco.xml here and no such subdirectory.
        path: ${{inputs.base_dir}}/reports/coverage
        retention-days: 30
