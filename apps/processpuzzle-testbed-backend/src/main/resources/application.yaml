spring:
  application:
    name: processpuzzle-testbed-backend
  # PostgreSQL, one database per application stack — see docs/application-stacks.md. The defaults name
  # the TESTBED stack on the compose postgres service published port, so a backend started outside
  # Docker against a running compose stack needs no configuration at all.
  #
  # Every value here is overridable through the environment by Spring Boot relaxed binding
  # (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD). That, plus stack-realm, the MinIO bucket prefix
  # and the CORS allow-list, is the whole difference between the two backend deployments in
  # docker-compose-ci.yaml: one image, one stack each.
  datasource:
    url: jdbc:postgresql://localhost:5432/processpuzzle_testbed
    driver-class-name: org.postgresql.Driver
    username: processpuzzle
    password: processpuzzle
  jpa:
    hibernate:
      # Hibernate owns the schema. Deliberate for now: there is no migration tool yet, so the schema
      # is whatever the entities say. Note the consequence, now that the database survives a restart:
      # the seed importers are create-only, so editing a seed YAML no longer reaches a stack that has
      # already been seeded. Resetting a stack means dropping its database.
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

app:
  cors:
    # 4200 is the Angular dev server; 9090 is where tools/docker/docker-compose-ci.yaml publishes the testbed,
    # which calls this backend cross-origin at localhost:8080. 9091 is the processpuzzle-admin-frontend app and 9092 is
    # processpuzzle-biz-frontend in the same compose file, and 4201/4202 are their dev servers. An origin missing here
    # is rejected with a bare 403 carrying no CORS headers, so the browser reports only a blocked request
    # and the frontend sees HTTP status 0 — name every origin that reaches this backend directly.
    #
    # This DEFAULT is the union of all six, because one backend started by hand has to serve whichever
    # frontend a developer runs. Each backend deployment in docker-compose-ci.yaml narrows it through
    # APP_CORS_ALLOWED_ORIGINS to the origins of its own stack; see docs/application-stacks.md.
    allowed-origins: http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:9090,http://localhost:9091,http://localhost:9092
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: Location,X-Object-Name,X-Object-Bucket
    allow-credentials: true

info:
  app:
    name: ${spring.application.name}
    description: ProcessPuzzle Testbed Backend Application

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: /api-docs

# Every feature serves its own translation bundles and seeds them from its own
# default-translations/<orgKey>-translations.yaml. The flags are per feature rather than one global
# switch because the storage is per feature — these libraries are meant to become separate services.
base-rule:
  loadSamples: yes
  loadDefaultTranslations: yes

base-app:
  loadDefaultApps: yes
  loadDefaultTranslations: yes

base-widget:
  loadDefaultWidgets: yes
  loadDefaultTranslations: yes

base-entity:
  loadDefaultEntities: yes
  loadDefaultTranslations: yes

base-document:
  loadSamples: yes
  loadDefaultTranslations: yes

base-state:
  loadDefaultStateMachines: yes
  loadDefaultTranslations: yes
  # Reports, once at startup, any object whose state attribute is absent or is not a state its
  # machine declares. On by default; turn it off where a governed entity type holds enough rows
  # that reading all of them at boot costs real time.
  verifyGovernedObjectStates: yes

base-workflow:
  loadDefaultWorkflows: yes
  loadDefaultTranslations: yes

org-admin:
  # Nothing to seed — Keycloak is the system of record for users, so this module persists nothing.
  # The flag exists for symmetry with the other features and to be the place a future default lands.
  loadDefaults: no

processpuzzle:
  security:
    # FALSE IS A TEMPORARY COMPROMISE, NOT A RECOMMENDATION. The Angular applications do not send a
    # bearer token yet, so closing the tenant API here would answer 401 to every existing screen and
    # every Playwright test. What is enforced regardless: a token that IS presented cannot cross
    # tenants, /platform/** requires the platform-admin authority, and the org-admin user-management
    # paths require authentication. Set this to true for any internet-facing deployment — see
    # com.processpuzzle.security.SecurityConfig.
    require-authentication: false
    # Only issuers under this base URL are trusted, checked before any database lookup — see
    # TenantAuthenticationManagerResolver on why that ordering matters. This is the origin the BROWSER
    # is redirected to, because that is what ends up in a token's iss claim.
    issuer-base-url: http://localhost:7070
    # Where THIS server reads signing keys from. Unset means "the same as issuer-base-url", which is
    # right whenever the browser and this process reach Keycloak through one origin. The compose
    # topology is the case where they do not — see docker-compose-ci.yaml.
    jwks-base-url:
    # The realm this deployment serves: one backend instance per application stack, so exactly one
    # non-tenant realm is trusted. The default names the testbed stack, matching the datasource
    # default above; each compose backend sets its own. See docs/application-stacks.md.
    stack-realm: processpuzzle-testbed
    # Which authority may reach /platform/**. A separate concept from stack-realm, and unaffected by
    # the realm renames: platform-admin is a realm ROLE name.
    platform-admin-authority: platform-admin

keycloak:
  admin:
    url: http://localhost:7070
    # The service account lives in master because create-realm is not a realm-scoped permission.
    realm: master
    client-id: platform-admin-service
    # Empty disables user management entirely: NoOpUserDirectoryPort stands in, so the application
    # still starts and every non-identity feature still works. Supply it via
    # KEYCLOAK_ADMIN_CLIENT_SECRET rather than committing it.
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    # No tenant-client-id / tenant-redirect-uri / tenant-web-origin here: creating a realm's public
    # client is realm PROVISIONING, and that left with platform-admin. KeycloakAdminProperties keeps
    # the three defaults for the private admin backend that does provision - see
    # docs/platform-admin-extraction.md.

minio:
  endpoint: http://localhost:7000
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    configuration: configuration
    text: text
    images: images
    documents: documents
    audio: audio
    video: video
    archives: archives
    logs: logs

---
spring:
  config:
    activate:
      on-profile: stage | prod

logging:
  pattern:
    console:
  structured:
    format:
      console: logstash
