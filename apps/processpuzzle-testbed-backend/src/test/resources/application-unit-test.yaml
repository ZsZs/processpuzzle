# Spring profile activated by Maven Surefire for unit tests
# (spring.profiles.active=unit-test set in the parent pom).
# Overrides the defaults in application.yaml to keep unit tests fast and quiet.
spring:
  main:
    banner-mode: off
    lazy-initialization: false
  datasource:
    url: jdbc:h2:mem:processpuzzle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jmx:
    enabled: false
  h2:
    console:
      enabled: false

logging:
  level:
    root: warn
    com.processpuzzle: info

base-rule:
  loadSamples: no
  loadDefaultTranslations: no

base-app:
  loadDefaultApps: no
  loadDefaultTranslations: no

base-widget:
  loadDefaultWidgets: no
  loadDefaultTranslations: no

base-entity:
  loadDefaultEntities: no
  loadDefaultTranslations: no

# base-document was missing from this list entirely, so SampleDocumentLoader ran during this module's
# Spring tests while the other six did not — the app's own application.yaml is on the test classpath.
base-document:
  loadSamples: no
  loadDefaultTranslations: no

base-state:
  loadDefaultStateMachines: no
  verifyGovernedObjectStates: no
  loadDefaultTranslations: no

base-workflow:
  loadDefaultWorkflows: no
  loadDefaultTranslations: no

platform-admin:
  loadDefaultOrganizations: no
  loadDefaultPlans: no

org-admin:
  loadDefaults: no

processpuzzle:
  security:
    # Left false in tests as in production, so the two agree about what the filter chain does. The
    # security tests exercise the resolver and the policies directly rather than by flipping this.
    require-authentication: false
    issuer-base-url: http://localhost:8180
    # Mirrors SecurityTestTokens: the boot tests model the ADMIN deployment, whose CORS origin
    # localhost:9091 is what CorsHeadersOnRejectedRequestTest asserts on.
    stack-realm: processpuzzle-admin

keycloak:
  admin:
    # Unset, so IdentityRealmConfiguration and UserDirectoryConfiguration both select their no-op:
    # no test should reach for a Keycloak that is not running.
    client-secret: ""
