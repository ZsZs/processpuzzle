spring:
  application:
    name: processpuzzle-backend
  datasource:
    url: jdbc:h2:mem:processpuzzle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

app:
  cors:
    # 4200 is the Angular dev server; 9090 is where tools/docker/docker-compose-ci.yaml publishes the testbed,
    # which calls this backend cross-origin at localhost:8080. An origin missing here is rejected with a bare
    # 403 carrying no CORS headers, so the browser reports only a blocked request and the frontend sees
    # HTTP status 0 — name every origin that reaches this backend directly.
    allowed-origins: http://localhost:4200,http://localhost:9090
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: Location,X-Object-Name,X-Object-Bucket
    allow-credentials: true

info:
  app:
    name: ${spring.application.name}
    description: ProcessPuzzle Backend Application

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: /api-docs

# Every feature serves its own translation bundles and seeds them from its own
# default-translations/<orgKey>-translations.yaml. The flags are per feature rather than one global
# switch because the storage is per feature — these libraries are meant to become separate services.
base-rule:
  loadSamples: yes
  loadDefaultTranslations: yes

base-app:
  loadDefaultApps: yes
  loadDefaultTranslations: yes

base-widget:
  loadDefaultWidgets: yes
  loadDefaultTranslations: yes

base-entity:
  loadDefaultEntities: yes
  loadDefaultTranslations: yes

base-document:
  loadSamples: yes
  loadDefaultTranslations: yes

base-state:
  loadDefaultStateMachines: yes
  loadDefaultTranslations: yes
  # Reports, once at startup, any object whose state attribute is absent or is not a state its
  # machine declares. On by default; turn it off where a governed entity type holds enough rows
  # that reading all of them at boot costs real time.
  verifyGovernedObjectStates: yes

base-workflow:
  loadDefaultWorkflows: yes
  loadDefaultTranslations: yes

minio:
  endpoint: http://localhost:7000
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    configuration: configuration
    text: text
    images: images
    documents: documents
    audio: audio
    video: video
    archives: archives
    logs: logs

---
spring:
  config:
    activate:
      on-profile: stage | prod

logging:
  pattern:
    console:
  structured:
    format:
      console: logstash
