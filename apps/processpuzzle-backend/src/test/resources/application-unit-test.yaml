# Spring profile activated by Maven Surefire for unit tests
# (spring.profiles.active=unit-test set in the parent pom).
# Overrides the defaults in application.yaml to keep unit tests fast and quiet.
spring:
  main:
    banner-mode: off
    lazy-initialization: false
  datasource:
    url: jdbc:h2:mem:processpuzzle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jmx:
    enabled: false
  h2:
    console:
      enabled: false

logging:
  level:
    root: warn
    com.processpuzzle: info

base-rule:
  loadSamples: no
  loadDefaultTranslations: no

base-app:
  loadDefaultApps: no
  loadDefaultTranslations: no

base-widget:
  loadDefaultWidgets: no
  loadDefaultTranslations: no

base-entity:
  loadDefaultEntities: no
  loadDefaultTranslations: no

# base-document was missing from this list entirely, so SampleDocumentLoader ran during this module's
# Spring tests while the other six did not — the app's own application.yaml is on the test classpath.
base-document:
  loadSamples: no
  loadDefaultTranslations: no

base-state:
  loadDefaultStateMachines: no
  loadDefaultTranslations: no

base-workflow:
  loadDefaultWorkflows: no
  loadDefaultTranslations: no
