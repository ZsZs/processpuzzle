title: "Calculation Designer : dériver des valeurs de vos données, et voir comment chacune est obtenue"

values: {}

steps:
  intro: >-
    Bienvenue dans le Calculation Designer. Un calcul dérive des valeurs des données de votre application : un total à
    partir des lignes d'une commande, une remise à partir du niveau d'un client, un classement à partir d'une série de
    résultats. Vous décrivez le calcul une seule fois, et l'application le calcule partout où il est nécessaire. Ce qui le
    distingue d'une formule enfouie dans le code, c'est qu'on peut toujours voir comment une valeur a été obtenue. Ce
    tutoriel vous montre comment.
  open: >-
    Depuis l'accueil du concepteur, ouvrez la carte Calculs. Le concepteur ouvre la liste des calculs que votre
    organisation a définis.
  list: >-
    Voici la liste. Le calcul que nous allons examiner s'appelle order-total. Chaque calcul a un nom, l'entité dans
    laquelle il écrit ses résultats, et un état de publication : un brouillon est encore en cours de modification, tandis
    qu'un calcul publié est celui qu'utilise l'application en production. Ouvrez order-total pour voir sa définition.
  definition: >-
    La définition indique le nom du calcul et l'entité qui reçoit ses résultats. Ici, les résultats entrent dans la
    commande : le total de la commande est donc toujours celui que ce calcul détermine. La description indique au
    prochain concepteur à quoi sert le calcul, et elle mérite d'être soignée, car c'est la première chose que l'on lit.
  source: >-
    Le calcul lui-même est écrit dans sa source, dans un petit langage déclaratif. Chaque ligne nomme une valeur et dit
    comment elle est dérivée : une somme sur les lignes d'une commande, un taux lu dans une table de décision, ou une
    expression simple sur les valeurs qui la précèdent. L'éditeur vérifie la syntaxe pendant la saisie, et le concepteur
    conserve la source comme la seule description du calcul.
  validate: >-
    Valider contrôle l'ensemble du calcul avant qu'il puisse être utilisé : que chaque valeur citée est définie, qu'aucune
    valeur ne dépend d'elle-même, et que les tables utilisées existent. Le résultat indique immédiatement si le calcul est
    correct, et le cas échéant où il ne l'est pas.
  tables: >-
    Certaines valeurs ne sont pas des formules, mais des tables de décision : une règle qui donne une valeur selon des
    conditions, comme le taux de remise pour chaque niveau de client. La table se lit ligne par ligne, et la première
    ligne dont les conditions sont remplies donne la valeur. Les tables sont tenues à part de la source, si bien qu'un
    concepteur peut changer un taux sans toucher à la formule qui l'utilise.
  choose-order: >-
    Voyons maintenant le calcul en fonctionnement. L'onglet Évaluer l'exécute sur une vraie commande. Nous choisissons la
    commande ORD-1001, une petite commande de deux lignes, et nous laissons le niveau du client vide, afin que la table
    de remises donne son taux par défaut.
  evaluate: >-
    Évaluer le brouillon exécute le calcul sur la commande. Il affiche les valeurs produites : le sous-total des lignes, le
    taux de remise et le total. Ce sont les mêmes chiffres que l'application inscrira dans la commande une fois le calcul
    publié.
  trace: >-
    La trace explique chaque valeur. Les totaux des lignes viennent des deux lignes de la commande, le sous-total les
    additionne, le taux de remise vient de la table, et le total se calcule à partir des deux. Chaque ligne indique quel
    type de décision a produit la valeur et sur quelles données elle porte, si bien qu'en cas de doute on voit exactement
    d'où vient un chiffre.
  runs: >-
    Enfin, la vue Exécutions liste les calculs que l'application a réellement effectués : quel calcul, pour quel objet et
    quand. Vous pouvez filtrer par calcul ou par objet, et actualiser la liste. Une exécution est conservée avec la source
    dont elle a été calculée, de sorte qu'un résultat peut être expliqué longtemps après que la commande a changé.
  outro: >-
    Voilà un calcul : une description dans un petit langage, des tables de décision là où une règle a des conditions, une
    vérification avant l'emploi, et une trace pour chaque valeur. Ensuite, le Workflow Designer utilise ces valeurs pour
    décider de l'étape suivante d'un processus.
