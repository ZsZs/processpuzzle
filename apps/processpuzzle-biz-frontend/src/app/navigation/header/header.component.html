<mat-toolbar color="primary" class="app-header">
  <pp-navigate-back />
  @if (!layoutService.isSmallDevice()) {
    <a [routerLink]="['/home']">
      <img
        ngSrc="../../../assets/processpuzzle-logo-with-title.jpg"
        class="app-logo"
        priority
        width="75"
        height="85"
        (click)="onLogoClick()"
        (keydown)="onLogoKeyPress($event)"
        alt="ProcessPuzzle Logo" />
    </a>
    <button mat-icon-button (click)="sidenavToggle()" aria-label="Toggle the navigation sidebar">
      <mat-icon>menu</mat-icon>
    </button>
    <span>{{ title }}</span>
  } @else {
    <ng-container *transloco="let t; prefix: 'navigation'">
      <div>
        <button test-id="menu-button" mat-button [matMenuTriggerFor]="beforeMenu">
          <mat-icon>menu</mat-icon>
        </button>
        <mat-menu test-id="menu" #beforeMenu="matMenu" xPosition="before">
          @for (item of routes; track item.link) {
            <button mat-menu-item [routerLink]="item.link" [ngClass]="layoutService.layoutClass()">
              <span matListItemIcon class="material-symbols-outlined">{{ item.icon }}</span>
              <span matListItemTitle>&nbsp;{{ t(item.menuTitle) }}</span>
            </button>
          }
        </mat-menu>
      </div>
    </ng-container>
    <h1>{{ title }}</h1>
  }
  <span class="toolbar-spacer"></span>
  <pp-language-selector />
  <pp-auth-button />
</mat-toolbar>
