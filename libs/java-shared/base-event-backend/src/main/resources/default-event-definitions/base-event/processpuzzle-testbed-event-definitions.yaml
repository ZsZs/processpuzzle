# The testbed tenant's event catalog. Each SYSTEM event names a platform fact about an entity type —
# its definition code, as in base-entity's seed — and the workflows in base-workflow's seed refer to
# them by id. order-fulfillment-workflow starts on OrderCreatedEvent.
#
# `parameters` declare what an occurrence carries (docs/event-parameters.md). A SYSTEM event always carries
# its `subject` without declaring it, and a declared parameter takes the payload attribute of its name — so
# it has to be an attribute of the subject's entity. A thrown event's parameters are filled from the throwing
# run's context by name.
event-definitions:
  - id: OrderCreatedEvent
    name: Order created
    description: A new Order was created.
    kind: SYSTEM
    subjectType: order
    action: CREATED
    parameters:
      - { name: orderNumber,  type: STRING, required: true }
      - { name: customerName, type: STRING }

  - id: OrderConfirmedEvent
    name: Order confirmed
    description: An Order entered state CONFIRMED.
    kind: SYSTEM
    subjectType: order
    action: STATE_CHANGED
    state: CONFIRMED

  - id: OrderDeliveredEvent
    name: Order delivered
    description: An Order entered state DELIVERED.
    kind: SYSTEM
    subjectType: order
    action: STATE_CHANGED
    state: DELIVERED

  # The order's exception path: its state machine cancels it from DRAFT and from CONFIRMED.
  # order-fulfillment-workflow catches it on the two tasks that wait on the order in those states.
  - id: OrderCancelledEvent
    name: Order cancelled
    description: An Order entered state CANCELLED.
    kind: SYSTEM
    subjectType: order
    action: STATE_CHANGED
    state: CANCELLED

  # MESSAGE events of the invoice round trip: order-fulfillment-workflow throws InvoiceRequested, which
  # starts invoicing-workflow; that throws InvoiceIssued back, which order-fulfillment catches. Both
  # are correlated on the order's id.
  - id: InvoiceRequested
    name: Invoice requested
    description: An approved Order asks for its invoice.
    kind: MESSAGE
    parameters:
      - { name: order,        type: ENTITY_REF, entityType: order, required: true }
      - { name: orderNumber,  type: STRING,                        required: true }
      - { name: customerName, type: STRING }

  - id: InvoiceIssued
    name: Invoice issued
    description: The invoice of an Order was issued.
    kind: MESSAGE
    parameters:
      - { name: order,         type: ENTITY_REF, entityType: order,    required: true }
      - { name: invoice,       type: ENTITY_REF, entityType: document }
      - { name: invoiceNumber, type: STRING,                           required: true }

  # Facts about calculation runs — base-calculation's platform subject `calculation-run`, declared by
  # base-calculation-backend since no entity type carries the name. A run's state is COMPLETED or FAILED once it ran,
  # and FROZEN once its result is kept; `subjectId` is the object it calculated, an order for the order total.
  - id: CalculationCompletedEvent
    name: Calculation completed
    description: A calculation ran and wrote its result.
    kind: SYSTEM
    subjectType: calculation-run
    action: STATE_CHANGED
    state: COMPLETED
    parameters:
      - { name: calculationId, type: STRING, required: true }
      - { name: subjectId,     type: STRING }

  - id: CalculationFailedEvent
    name: Calculation failed
    description: A calculation could not compute or write its result.
    kind: SYSTEM
    subjectType: calculation-run
    action: STATE_CHANGED
    state: FAILED
    parameters:
      - { name: calculationId, type: STRING, required: true }
      - { name: subjectId,     type: STRING }

  - id: CalculationFrozenEvent
    name: Calculation frozen
    description: The result of a calculation was frozen — the confirmed total of an order.
    kind: SYSTEM
    subjectType: calculation-run
    action: STATE_CHANGED
    state: FROZEN
    parameters:
      - { name: calculationId, type: STRING, required: true }
      - { name: subjectId,     type: STRING }
