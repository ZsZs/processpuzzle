# Default translation bundles of the 'processpuzzle-testbed' organization, owned by base-document.
#
# DocumentUiTranslationLoader imports this file on startup when `base-document.loadDefaultTranslations`
# is true. See base-app's file of the same name for the conventions.
#
# These are UI *message bundles* — the labels of the document-authoring screens. They are not the
# per-document content translations base-document also owns (`/documents/{documentId}/translations/
# {locale}`, a DocumentTranslation of blocks). Different thing, different table, different resource;
# hence `document_ui_translations` for this one.

translations:
  - scope: base_document
    locale: en
    messages:
      document:
        _self: Document
        title: Title
        slug: Slug
