# Project
sonar.projectKey=processpuzzle_api_contracts
sonar.projectName=processpuzzle_api_contracts
sonar.organization=processpuzzle
sonar.sourceEncoding=UTF-8
sonar.projectBaseDir=./
sonar.sources=src/main
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependencies/*.jar
# Contracts and shared event DTOs have no implementation coverage requirement.
sonar.coverage.exclusions=**/*
sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
