openapi: 3.0.3
info:
  title: ProcessPuzzle Event Catalog API (base-event)
  description: >-
    The organization's catalog of named events. An EventDefinition gives a platform fact a name a
    workflow can refer to: `OrderCreatedEvent` is "an object of entity type `order` was created",
    `OrderConfirmedEvent` is "an `order` entered state `CONFIRMED`".

    ## Kinds

    SYSTEM events are bound to a platform fact — `subjectType` (an entity definition code), an
    `action` and, for STATE_CHANGED only, the `state` entered. base-event observes every raw
    platform fact and publishes the matching definitions, which is how a workflow's TRIGGERING_EVENT
    start event fires. MESSAGE and SIGNAL events carry no binding; they exist in the catalog so they
    can be named, and are thrown by workflows in a later version.

    ## Multi-tenancy

    Scoped by {orgKey} exactly as base-entity-api.yaml and base-rule-api.yaml establish. An
    EventDefinition's `id` is unique within its organization.
  version: 0.1.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:

  /organizations/{orgKey}/event-definitions:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listEventDefinitions
      tags: [ Event Definitions ]
      summary: List all event definitions of an organization
      description: Returns the full definitions, so a list row can be opened for editing as it is.
      responses:
        "200":
          description: Event definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDefinition"

    post:
      operationId: createEventDefinition
      tags: [ Event Definitions ]
      summary: Create an event definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/event-definitions/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importEventDefinitions
      tags: [ Event Definitions ]
      summary: Bulk-import event definitions from a YAML file
      description: >-
        The file carries an `event-definitions` list. Existing definitions are replaced rather than
        rejected, which is what lets a seed file be edited after it has been loaded. All-or-nothing:
        if any entry is invalid, nothing in the file is persisted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /organizations/{orgKey}/event-definitions/{eventDefinitionId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EventDefinitionIdParam"
    get:
      operationId: getEventDefinition
      tags: [ Event Definitions ]
      summary: Get a single event definition
      responses:
        "200":
          description: Event definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateEventDefinition
      tags: [ Event Definitions ]
      summary: Replace an event definition
      description: >-
        Supply the `version` you last read to be refused with 409 rather than silently overwriting a
        concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteEventDefinition
      tags: [ Event Definitions ]
      summary: Delete an event definition
      description: >-
        A workflow start event naming the definition is not checked here; it simply stops firing.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        type: string
      description: Organisation key used to scope all base-event resources for multi-tenancy.
    EventDefinitionIdParam:
      name: eventDefinitionId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    EventKind:
      type: string
      enum: [ SYSTEM, MESSAGE, SIGNAL ]
      description: >-
        SYSTEM is bound to a platform fact and published by the platform; MESSAGE and SIGNAL carry no
        binding.

    PlatformEventAction:
      type: string
      enum: [ CREATED, UPDATED, DELETED, STATE_CHANGED ]

    EventDefinitionInput:
      type: object
      required: [ id, name, kind ]
      properties:
        id:
          type: string
          description: Event name, chosen by the author and unique per organization.
          example: OrderCreatedEvent
        name:
          type: string
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/EventKind"
        subjectType:
          type: string
          nullable: true
          description: SYSTEM only — the entity definition code the fact is about.
          example: order
        action:
          $ref: "#/components/schemas/PlatformEventAction"
        state:
          type: string
          nullable: true
          description: STATE_CHANGED only — the state entered. Omit to match every state change.
          example: CONFIRMED
        version:
          type: integer
          format: int64
          nullable: true
          description: >-
            The version the caller last read. When supplied, the write is refused with 409 unless it
            still matches the stored one. Omit it to overwrite unconditionally.

    EventDefinition:
      allOf:
        - $ref: "#/components/schemas/EventDefinitionInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string
