openapi: 3.0.3
info:
  title: ProcessPuzzle Shared API
  description: API parts shared between other services.
  version: 1.0.0
servers:
  - url: 'https://processpuzzle.local'
paths: {}

components:

  parameters:

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: |
        Tenant discriminator. Every piece of ProcessPuzzle metadata — app definitions,
        entity descriptors, rules, state and workflow definitions — is scoped by it, and
        every metadata id is unique only *within* an organization.

        The same value is the public URL segment of the tenant's application
        (`https://processpuzzle.com/{orgKey}`), which is why it is constrained to a
        URL-safe slug.

        **The server must never trust this parameter on its own.** It has to be checked
        against the `organization` claim of the authenticated principal and answered with
        403 on mismatch — otherwise editing the path is enough to read another tenant's
        metadata.

    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: |
        Filtert Ergebnisse mittels RSQL-Abfragesyntax. Mehrere Bedingungen können
        mit logischen Operatoren kombiniert werden.

        ## Operatoren

        | Operator        | Symbol      | Beispiel                       |
        |-----------------|-------------|--------------------------------|
        | Gleich          | `==`        | `name=="Lenovo"`               |
        | Ungleich        | `!=`        | `name!="Lenovo"`               |
        | Größer als      | `=gt=`      | `price=gt=1000`                |
        | Kleiner als     | `=lt=`      | `price=lt=1000`                |
        | Größer gleich   | `=ge=`      | `price=ge=1000`                |
        | Kleiner gleich  | `=le=`      | `price=le=1000`                |
        | IN-Liste        | `=in=`      | `vendor=in=(IBM,Dell,HP)`      |
        | NICHT IN-Liste  | `=out=`     | `vendor=out=(IBM,Dell)`        |
        | Platzhalter     | `==*wert*`  | `name=="*enovo*"`              |

        ## Logische Operatoren

        | Operator | Symbol | Beispiel                                    |
        |----------|--------|---------------------------------------------|
        | UND      | `;`    | `name=="Lenovo";status=="active"`           |
        | ODER     | `,`    | `name=="Lenovo",name=="Dell"`               |

        ## Platzhalter

        Mit `*` können Zeichenketten teilweise verglichen werden:
          - `name=="Lenovo*"` — beginnt mit
          - `name=="*enovo"` — endet mit
          - `name=="*enov*"` — enthält

    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: |
        Bestimmt die Sortierung der Ergebnisse.

        Format: `property,(asc|desc)`. Mehrere Sortierkriterien können durch Komma getrennt angegeben werden.
        Beispiel: `name,asc` oder `name,asc,id,desc`.

    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.

    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:

    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: >-
        The authenticated principal may not act on this organization — typically an
        `orgKey` in the path that does not match the principal's `organization` claim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    WidgetInstance:
      type: object
      description: >-
        One *placement* of a widget: a registry key plus the configuration bound to it at
        this position. Resolved via the frontend widget registry at render time and
        instantiated with `NgComponentOutlet` / `ViewContainerRef`.

        Distinct from a WidgetDefinition, which describes the widget *type* (its props
        schema and ports) and is an addressable resource of its own. A WidgetInstance is
        never standalone — it always lives inside a container: base-app-api.yaml's
        RouteTarget/RegionDefinition.widgets, or a WIDGET-kind DocumentBlock in
        base-document-api.yaml.

        This is the canonical declaration. Each consuming spec repeats this *shape* — the
        property set and their types, prose may add spec-specific notes — and maps it onto
        com.processpuzzle.shared.model.WidgetInstance through the schemaMappings in
        api-contracts/pom.xml, the same mechanism ErrorResponse and ImportResult use. The
        repetition is deliberate: no spec in this workspace uses cross-file $ref, and the
        generator's $ref handling has failed on Windows before. The YAML text is
        duplicated; the generated Java type is not. Any property added here must be added
        to every repeat, or that spec's payload will silently lose it.

        Not recursive: container widget types (tab groups, split panels) compose via
        props.childIds referencing sibling ids, not by nesting — see placement.
      required: [ id, type ]
      properties:
        id:
          type: string
          description: Unique within the enclosing flat list; used as the render loop's trackBy key.
          example: widget-claims-grid
        type:
          type: string
          description: >-
            Widget registry key, and the key of the WidgetDefinition describing this type.
            Intentionally an open string rather than an enum — new widget types register
            into the frontend map without a contract change.
          example: entity-grid
        props:
          type: object
          description: >-
            Widget-specific configuration, passed to the resolved component as inputs.
            Loose in this contract by design: each widget type owns its own props shape,
            declared in its WidgetDefinition.propsSchema rather than here.
            Container widget types express composition here via childIds — a list of
            sibling WidgetInstance.id values within the same enclosing array — rather than
            through structural nesting. Interpreting childIds is that widget type's own
            concern; consumers only validate that the ids resolve and flag orphans.
          additionalProperties: true
        placement:
          type: string
          enum: [ STANDALONE, REFERENCED ]
          default: STANDALONE
          description: >-
            STANDALONE renders at this widget's own position in the enclosing flat list.
            REFERENCED means it renders only where something else points at its id — a
            container widget's props.childIds, or (base-document only) a Tiptap
            widgetEmbed node. A REFERENCED widget nothing points at is an orphan, flagged
            by validation as a warning, not an error.
        inputBindings:
          # nullable, unlike props, so the generator emits no `new HashMap<>()` initializer:
          # "this widget binds nothing" has to stay absent rather than serialize as {}, and
          # base-document — where these two fields come from — already declares them this way.
          # props keeps its non-nullable declaration because base-app's payloads have always
          # carried {} for it; changing that here would be an unrelated wire change.
          type: object
          nullable: true
          description: >-
            Maps a widget prop name to a value supplied by the enclosing container: keys
            are widget prop names, values are the container's port names. Used by
            base-document, whose documents declare inputPorts; base-app leaves it absent
            until a route target declares ports of its own. Resolving the bound value at
            runtime is entirely a frontend concern.
          additionalProperties:
            type: string
        outputBindings:
          type: object
          nullable: true
          description: >-
            The reverse of inputBindings: keys are the widget's emitted event names,
            values are the enclosing container's output port names.
          additionalProperties:
            type: string

    # ── Ports ─────────────────────────────────────────────────
    # A typed, named slot through which a container passes data to a widget and receives data back.
    # Canonical here because two features declare them: a WidgetDefinition declares the ports its
    # widget type offers, and a Document declares the ports its content exposes. A WidgetInstance's
    # inputBindings/outputBindings are what join the two.
    #
    # base-document still generates its own DocumentInputPort/DocumentOutputPort from identical
    # shapes in base-document-api.yaml. Converging those onto InputPort/OutputPort renames a
    # generated Java type and its frontend class, so it is a deliberate follow-up rather than part
    # of introducing base-widget. PortType and AttributeVisibility below are already the shapes
    # base-document declares, verbatim, so that convergence is a mapping change and nothing more.

    PortType:
      type: string
      enum: [ STRING, NUMBER, BOOLEAN, DATE, OBJECT, ARRAY, ENTITY_REF, ENTITY_COLLECTION ]
      description: >-
        Lightweight type tag for UI hinting and basic validation only.
        ENTITY_REF: a single base-entity instance (entityType + entityId).
        ENTITY_COLLECTION: a filtered set of base-entity instances (entityType + RSQL
        filter), e.g. for a table/grid widget bound to "all open claims." Neither
        variant requires the declaring feature to know the entity's schema. entityType values
        resolve within the enclosing organization, same as a WidgetInstance's props.

    AttributeVisibility:
      type: object
      description: >-
        Attribute projection applied to entity data carried through an ENTITY_REF or
        ENTITY_COLLECTION port. Stored as a plain allow/deny list — attribute names are not
        validated against base-entity's schema. Unrelated to any document- or app-level access
        control: this projects the data flowing through a port, not who may read the resource.
      properties:
        mode:
          type: string
          enum: [ ALL, INCLUDE, EXCLUDE ]
          default: ALL
        attributes:
          type: array
          items:
            type: string
          description: Used when mode is INCLUDE or EXCLUDE; ignored when mode is ALL.

    InputPort:
      type: object
      required: [ name, type ]
      description: >-
        A value the container supplies to the widget. Resolving a bound value at runtime is
        entirely a frontend concern; the backend only records that the port exists.
      properties:
        name:
          type: string
          description: Unique within the declaring resource; what a WidgetInstance.inputBindings value names.
        type:
          $ref: "#/components/schemas/PortType"
        required:
          type: boolean
          default: false
        description:
          type: string
          nullable: true
        defaultValue:
          nullable: true
          description: Used when required is false and the hosting context supplies nothing.
        entityType:
          type: string
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only. The base-entity type this port carries.
        attributeVisibility:
          allOf:
            - $ref: "#/components/schemas/AttributeVisibility"
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only. Optional default projection.
        defaultRsqlFilter:
          type: string
          nullable: true
          description: >-
            ENTITY_COLLECTION only. Fallback filter used when the hosting context binds
            this port without supplying its own filter.

    OutputPort:
      type: object
      required: [ name, type ]
      description: A value the widget emits back to its container, named by WidgetInstance.outputBindings.
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/PortType"
        description:
          type: string
          nullable: true
        entityType:
          type: string
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only.
        attributeVisibility:
          allOf:
            - $ref: "#/components/schemas/AttributeVisibility"
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only. Projection applied to emitted data.

    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug: lowercase letters, digits and single hyphens, not starting or
        ending with a hyphen. Because it becomes a top-level path segment of the public
        site it shares a namespace with the platform's own routes, so provisioning must
        reject reserved segments (`api`, `assets`, `design`, `login`, `logout`, `admin`,
        `docs`, `static`, `well-known`, …) even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    Locale:
      type: string
      description: >-
        BCP-47 language tag — a bare language (`en`, `hu`) or language-region (`en-GB`).
        Matched case-sensitively in the canonical form the pattern describes, so one
        translation cannot be addressed by two spellings.

        This is the canonical declaration; base-document repeats the same shape for its
        per-document content translations. A bare `type: string` schema generates no Java
        class, so the repetition costs nothing and needs no schemaMappings entry — the
        same reason `OrganizationKey` is only mapped where a spec wants it narrowed.
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      minLength: 2
      maxLength: 6
      example: en

    TranslationScope:
      type: string
      description: >-
        Transloco scope a bundle loads under, and the directory segment its asset
        equivalent would have had: `base_app` for `assets/i18n/base_app/en.json`. An
        authored module's scope is `ModuleDefinition.translocoScope`, which is exactly the
        case that has no asset to fall back to.

        Underscores rather than hyphens by convention — the frontend has to register the
        alias explicitly either way, because transloco camel-cases a default alias and
        would miss every key below the scope.
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
      minLength: 1
      maxLength: 64
      example: base_app

    TranslationBundle:
      type: object
      description: >-
        One Transloco bundle: the whole message map of an (organization, scope, locale)
        triple, in the exact shape the frontend's `assets/i18n/<scope>/<lang>.json` has.

        Keys are **relative to the scope** — transloco prefixes them with the scope alias
        itself, so a wrapping `<scope>:` level would resolve as `<scope>.<scope>.key` and
        match nothing. Values are strings or nested objects; transloco flattens the nesting
        with `.` and interpolates `{{ param }}`.

        Free-form on purpose: a bundle is authored content, and the contract has no business
        naming a tenant's keys. `nullable: true` is what stops the generator emitting a
        `new HashMap<>()` field initialiser, which would fight the schema mapping.
      additionalProperties: true
      nullable: true
      example:
        module:
          name: Order administration
        route:
          orders: All orders

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      description: >-
        Standard error payload returned by all ProcessPuzzle services. `errorId` is a
        stable, machine-readable identifier that clients can key on (also usable as a
        Transloco translation key on the frontend). `errorText` is the human-readable
        fallback message in the service's default language.
      properties:
        errorId:
          type: string
          description: Stable, machine-readable error identifier / translation key.
          example: rule.import.duplicate-id
        errorText:
          type: string
          description: Human-readable error message in the service's default language.
          example: A rule with this id already exists.

    ImportResult:
      type: object
      description: Outcome of a bulk YAML import operation.
      properties:
        created:
          type: integer
          description: Number of new records created by the import.
        updated:
          type: integer
          description: Number of existing records updated by the import.
        errors:
          type: array
          description: Validation errors that caused the import to be rejected.
          items:
            type: string
