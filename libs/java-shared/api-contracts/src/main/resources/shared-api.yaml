openapi: 3.0.3
info:
  title: ProcessPuzzle Shared API
  description: API parts shared between other services.
  version: 1.0.0
servers:
  - url: 'https://processpuzzle.local'
paths: {}

components:

  parameters:

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: |
        Tenant discriminator. Every piece of ProcessPuzzle metadata — app definitions,
        entity descriptors, rules, state and workflow definitions — is scoped by it, and
        every metadata id is unique only *within* an organization.

        The same value is the public URL segment of the tenant's application
        (`https://processpuzzle.com/{orgKey}`), which is why it is constrained to a
        URL-safe slug.

        **The server must never trust this parameter on its own.** It has to be checked
        against the `organization` claim of the authenticated principal and answered with
        403 on mismatch — otherwise editing the path is enough to read another tenant's
        metadata.

    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: |
        Filtert Ergebnisse mittels RSQL-Abfragesyntax. Mehrere Bedingungen können
        mit logischen Operatoren kombiniert werden.

        ## Operatoren

        | Operator        | Symbol      | Beispiel                       |
        |-----------------|-------------|--------------------------------|
        | Gleich          | `==`        | `name=="Lenovo"`               |
        | Ungleich        | `!=`        | `name!="Lenovo"`               |
        | Größer als      | `=gt=`      | `price=gt=1000`                |
        | Kleiner als     | `=lt=`      | `price=lt=1000`                |
        | Größer gleich   | `=ge=`      | `price=ge=1000`                |
        | Kleiner gleich  | `=le=`      | `price=le=1000`                |
        | IN-Liste        | `=in=`      | `vendor=in=(IBM,Dell,HP)`      |
        | NICHT IN-Liste  | `=out=`     | `vendor=out=(IBM,Dell)`        |
        | Platzhalter     | `==*wert*`  | `name=="*enovo*"`              |

        ## Logische Operatoren

        | Operator | Symbol | Beispiel                                    |
        |----------|--------|---------------------------------------------|
        | UND      | `;`    | `name=="Lenovo";status=="active"`           |
        | ODER     | `,`    | `name=="Lenovo",name=="Dell"`               |

        ## Platzhalter

        Mit `*` können Zeichenketten teilweise verglichen werden:
          - `name=="Lenovo*"` — beginnt mit
          - `name=="*enovo"` — endet mit
          - `name=="*enov*"` — enthält

    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: |
        Bestimmt die Sortierung der Ergebnisse.

        Format: `property,(asc|desc)`. Mehrere Sortierkriterien können durch Komma getrennt angegeben werden.
        Beispiel: `name,asc` oder `name,asc,id,desc`.

    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.

    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:

    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: >-
        The authenticated principal may not act on this organization — typically an
        `orgKey` in the path that does not match the principal's `organization` claim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug: lowercase letters, digits and single hyphens, not starting or
        ending with a hyphen. Because it becomes a top-level path segment of the public
        site it shares a namespace with the platform's own routes, so provisioning must
        reject reserved segments (`api`, `assets`, `design`, `login`, `logout`, `admin`,
        `docs`, `static`, `well-known`, …) even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      description: >-
        Standard error payload returned by all ProcessPuzzle services. `errorId` is a
        stable, machine-readable identifier that clients can key on (also usable as a
        Transloco translation key on the frontend). `errorText` is the human-readable
        fallback message in the service's default language.
      properties:
        errorId:
          type: string
          description: Stable, machine-readable error identifier / translation key.
          example: rule.import.duplicate-id
        errorText:
          type: string
          description: Human-readable error message in the service's default language.
          example: A rule with this id already exists.

    ImportResult:
      type: object
      description: Outcome of a bulk YAML import operation.
      properties:
        created:
          type: integer
          description: Number of new records created by the import.
        updated:
          type: integer
          description: Number of existing records updated by the import.
        errors:
          type: array
          description: Validation errors that caused the import to be rejected.
          items:
            type: string
