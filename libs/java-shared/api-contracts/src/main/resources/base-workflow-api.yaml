openapi: 3.0.3
info:
  title: ProcessPuzzle Workflow Engine API (base-workflow)
  description: >-
    SPEM-inspired workflow definition and execution API. Orchestrates tasks, roles,
    artifacts and tools across a ProcessPuzzle process instance.

    The model follows SPEM's split of Method Content from Process. Roles, artifacts, tasks and
    tools are tenant-level *definitions* — catalog resources of their own, each authored once and
    each with full CRUD. A *workflow* composes them: its `roles`, `artifacts`, `tools` and `tasks`
    hold `...Use` objects, which name a definition by id and carry whatever is true of it only in
    that workflow — which role performs a task there, what it waits for. Uses are embedded in the
    workflow and have no resource of their own; definitions are never nested inside it.

    base-workflow is a pure orchestrator: rule evaluation is delegated to base-rule, state
    machine transitions to base-state, and entity data shape to base-entity. References to
    those libraries are by ID only — base-workflow never owns or duplicates their models.
    Coordination between libraries happens exclusively through the shared event schema
    defined in base-workflow-events.yaml.

    All resources are scoped per organization via the {orgKey} path variable, consistent
    with the multi-tenancy convention used across the ProcessPuzzle platform (see
    processpuzzle-core's OrganizationGuard / orgKey scoping).
  version: 0.2.0

servers:
  - url: /api/workflow

# ─────────────────────────────────────────────────────────────
# DEFINITION API  (design-time)
# ─────────────────────────────────────────────────────────────
paths:

  # ── Process Definitions ───────────────────────────────────

  /organizations/{orgKey}/processes:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listProcessDefinitions
      tags: [ Process Definitions ]
      summary: List all process definitions
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: >-
            Paged list of process definitions, each with its role, artifact and task references. Full
            shape rather than a summary on purpose: base-entity's generated form reads the record out
            of the loaded list rather than re-fetching it by id, so a projection here would render an
            empty form and its save — a full replacement — would destroy what the projection dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_Workflow"

    post:
      operationId: createProcessDefinition
      tags: [ Process Definitions ]
      summary: Create a new process definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/processes/{processId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
    get:
      operationId: getProcessDefinition
      tags: [ Process Definitions ]
      summary: Get a workflow with its task uses and its role, artifact and tool references
      responses:
        "200":
          description: Full process definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateProcessDefinition
      tags: [ Process Definitions ]
      summary: Replace a workflow
      description: >-
        Only allowed if there are no ACTIVE instances of this workflow. Supply the `version` you last
        read to be refused with 409 rather than silently overwriting a concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteProcessDefinition
      tags: [ Process Definitions ]
      summary: Delete a process definition
      description: Only allowed if there are no process instances (active or historic).
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/processes/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importProcessDefinitions
      tags: [ Process Definitions ]
      summary: Bulk-import a workflow catalog and its process definitions from a SPEM YAML file
      description: >-
        The file carries `role-definitions`, `artifact-definitions`, `tool-definitions`,
        `task-definitions` and `workflows` as sibling top-level sections; the four definition
        sections are applied before the workflows that reference them, so one file can introduce a
        workflow and everything it needs. Existing entries are replaced rather than rejected, which
        is what lets a seed file be edited after it has already been loaded.

        All-or-nothing: if any entry fails structural validation, nothing in the file is
        persisted. References to base-rule rule IDs and base-state state machine IDs are recorded
        as-is and validated lazily at instance start time, not at import time.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /organizations/{orgKey}/processes/{processId}/export:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
    get:
      operationId: exportProcessDefinition
      tags: [ Process Definitions ]
      summary: Export a single process definition as SPEM YAML
      description: >-
        Self-contained: the document carries the role, artifact, task and tool definitions the
        workflow references alongside the workflow itself, so the result can be fed straight back
        to /processes/import — including into another organization.
      responses:
        "200":
          description: YAML file
          content:
            application/x-yaml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Role Definitions ──────────────────────────────────────
  # A tenant-level catalog entity rather than a child of one workflow: the same role takes part in
  # many workflows, each of which references it through a RoleUse. `id` is the author-chosen
  # business key, unique per organization — the convention `/tools` already follows.

  /organizations/{orgKey}/roles:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listRoleDefinitions
      tags: [ Role Definitions ]
      summary: List all role definitions of an organization
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Role definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDefinition"

    post:
      operationId: createRoleDefinition
      tags: [ Role Definitions ]
      summary: Create a new role definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/RoleIdParam"
    get:
      operationId: getRoleDefinition
      tags: [ Role Definitions ]
      summary: Get a single role definition
      responses:
        "200":
          description: Role definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateRoleDefinition
      tags: [ Role Definitions ]
      summary: Replace a role definition
      description: >-
        Supply the `version` you last read to be refused with 409 rather than silently overwriting a
        concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteRoleDefinition
      tags: [ Role Definitions ]
      summary: Delete a role definition
      description: >-
        Refused while anything still names this role: a workflow listing it in roles or naming it
        in tasks[].performedBy, or a task definition offering it in performedByRoles. Deleting it
        regardless would leave those references dangling, and a workflow's referential integrity is
        checked when the workflow is saved, not when it is started.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Artifact Definitions ──────────────────────────────────
  # SPEM's work product, under the name the platform uses for it. A catalog entity like a role: the
  # same artifact is produced or consumed by tasks of several workflows, so it is defined once and
  # referenced by id. Everything a task reads or writes is one of these, because an artifact is
  # also where the lifecycle lives — `artifactType` says what kind of thing it is and
  # `stateMachineId` which base-state machine governs it.

  /organizations/{orgKey}/artifacts:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listArtifactDefinitions
      tags: [ Artifact Definitions ]
      summary: List all artifact definitions of an organization
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Artifact definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactDefinition"

    post:
      operationId: createArtifactDefinition
      tags: [ Artifact Definitions ]
      summary: Create a new artifact definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
    get:
      operationId: getArtifactDefinition
      tags: [ Artifact Definitions ]
      summary: Get a single artifact definition
      responses:
        "200":
          description: Artifact definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateArtifactDefinition
      tags: [ Artifact Definitions ]
      summary: Replace an artifact definition
      description: >-
        Supply the `version` you last read to be refused with 409 rather than silently overwriting a
        concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteArtifactDefinition
      tags: [ Artifact Definitions ]
      summary: Delete an artifact definition
      description: >-
        Refused while a workflow lists it in artifacts, a task definition names it in inputs or
        outputs, or a role definition claims it in responsibleFor.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Task Definitions ──────────────────────────────────────
  # The reusable half of a task. Its per-workflow half is a TaskUse inside the referencing
  # workflow — see the TaskDefinitionInput schema for why the split falls where it does.

  /organizations/{orgKey}/tasks:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listTaskDefinitions
      tags: [ Task Definitions ]
      summary: List all task definitions of an organization
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Task definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskDefinition"

    post:
      operationId: createTaskDefinition
      tags: [ Task Definitions ]
      summary: Create a new task definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/TaskIdParam"
    get:
      operationId: getTaskDefinition
      tags: [ Task Definitions ]
      summary: Get a single task definition
      responses:
        "200":
          description: Task definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateTaskDefinition
      tags: [ Task Definitions ]
      summary: Replace a task definition
      description: >-
        Supply the `version` you last read to be refused with 409 rather than silently overwriting a
        concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteTaskDefinition
      tags: [ Task Definitions ]
      summary: Delete a task definition
      description: Refused while any workflow still names this task in a TaskUse.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"


  # ── Tool Definitions ──────────────────────────────────────

  /organizations/{orgKey}/tools:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listToolDefinitions
      tags: [ Tool Definitions ]
      summary: List all tool definitions
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Tool definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolDefinition"

    post:
      operationId: createToolDefinition
      tags: [ Tool Definitions ]
      summary: Create a new tool definition (external REST service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/tools/{toolId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ToolIdParam"
    get:
      operationId: getToolDefinition
      tags: [ Tool Definitions ]
      summary: Get a tool definition
      responses:
        "200":
          description: Tool definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateToolDefinition
      tags: [ Tool Definitions ]
      summary: Update a tool definition
      description: >-
        Supply the `version` you last read to be refused with 409 rather than silently overwriting a
        concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteToolDefinition
      tags: [ Tool Definitions ]
      summary: Delete a tool definition
      description: >-
        Refused while a workflow lists it in tools, or a task definition's SERVICE_STEP names it in
        toolDefinitionId.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─────────────────────────────────────────────────────────────
  # EXECUTION API  (runtime)
  # ─────────────────────────────────────────────────────────────

  # ── Process Instances ─────────────────────────────────────

  /organizations/{orgKey}/instances:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listProcessInstances
      tags: [ Process Instances ]
      summary: List process instances
      parameters:
        - name: processId
          in: query
          description: Filter by process definition id
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProcessInstanceStatus"
        - name: entityId
          in: query
          description: >-
            Filter by the base-entity entity instance this process is running against.
            Useful when a process is tied to a specific entity (e.g. "delivery process for
            Order #1234").
          schema:
            type: string
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: >-
            Paged list of process instances, each with its task and artifact instances. Full
            shape rather than a summary, for the reason given on `listProcessDefinitions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_ProcessInstance"

    post:
      operationId: startProcessInstance
      tags: [ Process Instances ]
      summary: Start a new process instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProcessRequest"
      responses:
        "201":
          description: Instance created and first tasks activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Process definition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/instances/{instanceId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
    get:
      operationId: getProcessInstance
      tags: [ Process Instances ]
      summary: Get a process instance with its task and artifact instances
      responses:
        "200":
          description: Full process instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: cancelProcessInstance
      tags: [ Process Instances ]
      summary: Cancel a running process instance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "204":
          description: Cancelled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Instance is already completed or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Task Instances ─────────────────────────────────────────

  /organizations/{orgKey}/instances/{instanceId}/tasks:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
    get:
      operationId: listTaskInstances
      tags: [ Task Instances ]
      summary: List all task instances for a process instance
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskInstanceStatus"
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Task instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInstance"

  /organizations/{orgKey}/instances/{instanceId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    get:
      operationId: getTaskInstance
      tags: [ Task Instances ]
      summary: Get a single task instance
      responses:
        "200":
          description: Task instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/instances/{instanceId}/tasks/{taskId}/assign:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    post:
      operationId: assignTask
      tags: [ Task Instances ]
      summary: Assign an active task to a user
      description: >-
        The assignee must hold a role that matches the task's performedBy role
        definition. Role membership is managed by base-entity; base-workflow validates by
        calling base-entity's role membership query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTaskRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is not in ACTIVE status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/instances/{instanceId}/tasks/{taskId}/complete:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    post:
      operationId: completeTask
      tags: [ Task Instances ]
      summary: Mark a task as completed
      description: >-
        Triggers evaluation of the task's postcondition (via base-rule) and, if it
        passes, publishes TaskCompletedEvent. base-state will react to that event and
        fire the corresponding state machine transition on any linked artifacts.
        base-workflow will then re-evaluate which tasks become ACTIVE next.
        If the postcondition fails, the task stays ACTIVE and the response includes
        the evaluation detail.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Completion accepted (postcondition passed) or rejected (postcondition failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is not in ACTIVE status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/instances/{instanceId}/tasks/{taskId}/skip:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    post:
      operationId: skipTask
      tags: [ Task Instances ]
      summary: Skip a task (manager override)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Artifact Instances ────────────────────────────────────
  # Embedded in their process instance, unlike the ArtifactDefinition they are made from: an
  # instance has no life apart from the run that produced it.

  /organizations/{orgKey}/instances/{instanceId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
    get:
      operationId: listArtifactInstances
      tags: [ Artifact Instances ]
      summary: >-
        List artifact instances in a process instance. Each entry carries the
        current state from base-state (read-only from base-workflow's perspective)
        and the entityId linking to the actual data in base-entity.
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Artifact instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactInstance"

  /organizations/{orgKey}/instances/{instanceId}/artifacts/{artifactInstanceId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - name: artifactInstanceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getArtifactInstance
      tags: [ Artifact Instances ]
      summary: Get a single artifact instance
      responses:
        "200":
          description: Artifact instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────────────────────────────────────
  # COMPONENTS
  # ─────────────────────────────────────────────────────────────
  # ── Translations ──
  # The UI message bundles this feature owns, in the shape the frontend's asset files have. Two
  # templates rather than one with an optional segment: 4 vs 5 segments is what makes them
  # unambiguous, and it mirrors `assets/i18n/<lang>.json` and `assets/i18n/<scope>/<lang>.json`.
  #
  # `workflow` is the feature's own service root. Every feature serves its own translations from its
  # own store, so that a later split into services with separate databases moves this segment into the
  # host rather than rewriting the resource. In the monolith it is also what keeps seven identical
  # `/translations` paths from colliding into an ambiguous mapping at startup.
  /organizations/{orgKey}/workflow/translations/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base Workflow Translations
      summary: Root translation bundle of this feature for one language
      operationId: getWorkflowTranslations
      description: >-
        The bundle that has no transloco scope — the equivalent of `assets/i18n/<lang>.json`.
        Answers 200 with an empty object when nothing has been seeded, rather than 404: the
        frontend loader reaches here only after an asset miss, and an error status would make an
        unseeded locale indistinguishable from a broken backend.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'

  /organizations/{orgKey}/workflow/translations/{scope}/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationScopeParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base Workflow Translations
      summary: One scoped translation bundle of this feature
      operationId: getWorkflowScopedTranslations
      description: >-
        The equivalent of `assets/i18n/<scope>/<lang>.json`. Keys are relative to the scope, as in
        the asset files: transloco prefixes them with the scope alias itself.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this scope and locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'


components:

  parameters:
    TranslationLocaleParam:
      name: locale
      in: path
      required: true
      description: BCP-47 language tag of the bundle to read.
      schema:
        $ref: '#/components/schemas/Locale'

    TranslationScopeParam:
      name: scope
      in: path
      required: true
      description: Transloco scope of the bundle to read.
      schema:
        $ref: '#/components/schemas/TranslationScope'

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        type: string
      description: >-
        Organisation key used to scope all base-workflow resources for multi-tenancy.
        Matches the orgKey convention used across processpuzzle-core (OrganizationGuard).
    ProcessIdParam:
      name: processId
      in: path
      required: true
      schema:
        type: string
    InstanceIdParam:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    RoleIdParam:
      name: roleId
      in: path
      required: true
      schema:
        type: string
    TaskIdParam:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    ArtifactIdParam:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    ToolIdParam:
      name: toolId
      in: path
      required: true
      schema:
        type: string
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: RSQL filter expression. See shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ── Enums ──────────────────────────────────────────────
    ProcessInstanceStatus:
      type: string
      enum: [ ACTIVE, COMPLETED, CANCELLED, SUSPENDED ]

    TaskInstanceStatus:
      type: string
      enum: [ PENDING, ACTIVE, COMPLETED, SKIPPED, BLOCKED ]

    TaskStepType:
      type: string
      enum: [ USER_STEP, SERVICE_STEP ]
      default: USER_STEP
      description: >-
        Whether completing the step is a human act or a call the engine makes. SERVICE_STEP is the
        one that reads `toolDefinitionId` / `toolOperation`; on a USER_STEP those fields are ignored.

    JoinType:
      type: string
      enum: [ ALL, ANY ]
      default: ALL
      description: >-
        How a task's `dependsOn` set is satisfied. ALL (the default) waits for every named task to
        reach a terminal status; ANY waits for the first of them. Immaterial when `dependsOn` is
        empty — such a task is eligible from process start either way.

    ArtifactType:
      type: string
      enum: [ DOCUMENT, ENTITY, WIDGET ]
      description: >-
        SPEM's kinds of work product, plus ENTITY for one whose data is a base-entity instance.
        Names the kind, not the schema: every value here describes an ArtifactDefinition, and this
        field says which kind of one it is. `artifactTypeId` then names the concrete document,
        entity or widget.

    AuthType:
      type: string
      enum: [ NONE, BEARER_TOKEN, BASIC, API_KEY ]

    HttpMethod:
      type: string
      enum: [ GET, POST, PUT, PATCH, DELETE ]

    # ─────────────────────────────────────────────────────────
    # DEFINITION LAYER — SPEM's Method Content
    # ─────────────────────────────────────────────────────────
    # Reusable, context-free catalog entities, each org-scoped with its own CRUD resource and its own
    # (orgKey, id) key. They reference each other by plain id — a role is responsibleFor artifact
    # ids, a task names role ids and artifact ids — which is what lets the authoring UI render each
    # reference as a RELATED_ENTITIES control over the referenced entity's own list.
    #
    # Every definition follows the platform's write/read twin convention (base-entity, base-rule,
    # base-state): `<X>Input` is what a POST/PUT carries, `<X>` adds the server-owned version and
    # audit stamps on top.

    # ── Role Definition ─────────────────────────────────────
    RoleDefinitionInput:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          description: Role code, chosen by the author and unique per organization.
          example: clerk
        name:
          type: string
        description:
          type: string
        responsibleFor:
          type: array
          description: >-
            Ids of the ArtifactDefinitions this role owns the outcome of. Ownership, not access:
            what a task reads or writes is stated on the task.
          items:
            type: string
          example: [ fulfillment-invoice ]
        entityRoleId:
          type: string
          nullable: true
          description: >-
            Id of the corresponding role in base-entity. When set, base-workflow checks that a user
            holds this entity role before allowing them to be assigned a task this role performs.
        version:
          type: integer
          format: int64
          nullable: true
          description: >-
            The version the caller last read. When supplied, the write is refused with 409 unless it
            still matches the stored one — which is what makes a full-replacement PUT safe against a
            lost update: two editors who both loaded version 3 cannot both save over it. Omit it to
            overwrite unconditionally.

    RoleDefinition:
      allOf:
        - $ref: "#/components/schemas/RoleDefinitionInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    # ── Artifact Definition ─────────────────────────────────
    ArtifactDefinitionInput:
      type: object
      required: [ id, name, artifactType ]
      properties:
        id:
          type: string
          description: Artifact code, chosen by the author and unique per organization.
          example: fulfillment-invoice
        name:
          type: string
        description:
          type: string
        artifactType:
          $ref: "#/components/schemas/ArtifactType"
        artifactTypeId:
          type: string
          nullable: true
          description: >-
            Id of the concrete thing this artifact is: a base-entity entity name when artifactType
            is ENTITY, a base-document document name when DOCUMENT, or a widget name when WIDGET.
          example: order
        stateMachineId:
          type: string
          nullable: true
          description: >-
            Id of the state machine definition in base-state that governs this artifact's
            lifecycle. base-workflow passes it when publishing ArtifactInstanceCreatedEvent so
            base-state can initialize the right machine.
        version:
          type: integer
          format: int64
          nullable: true
          description: >-
            The version the caller last read. When supplied, the write is refused with 409 unless it
            still matches the stored one — which is what makes a full-replacement PUT safe against a
            lost update: two editors who both loaded version 3 cannot both save over it. Omit it to
            overwrite unconditionally.

    ArtifactDefinition:
      allOf:
        - $ref: "#/components/schemas/ArtifactDefinitionInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    # ── Tool Definition ─────────────────────────────────────
    # Both the capability and how to reach it. Credentials are the one thing kept out: `auth` names
    # a secret rather than carrying it.
    ToolDefinitionInput:
      type: object
      required: [ id, name, baseUrl ]
      properties:
        id:
          type: string
          example: automated-check-tool
        name:
          type: string
        description:
          type: string
        baseUrl:
          type: string
          format: uri
          example: https://checks.example.com
        auth:
          $ref: "#/components/schemas/ToolAuthConfig"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ToolOperationDefinition"
        version:
          type: integer
          format: int64
          nullable: true
          description: >-
            The version the caller last read. When supplied, the write is refused with 409 unless it
            still matches the stored one — which is what makes a full-replacement PUT safe against a
            lost update: two editors who both loaded version 3 cannot both save over it. Omit it to
            overwrite unconditionally.

    ToolDefinition:
      allOf:
        - $ref: "#/components/schemas/ToolDefinitionInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ToolAuthConfig:
      type: object
      required: [ type ]
      properties:
        type:
          $ref: "#/components/schemas/AuthType"
        secretRef:
          type: string
          nullable: true
          description: >-
            Key name of the secret in the application's secret store (environment variable name or
            Vault path). base-workflow never stores credential values directly — only the reference.

    ToolOperationDefinition:
      type: object
      required: [ id, method, path ]
      description: >-
        One callable operation of a tool. Has no resource of its own: an operation is only ever
        addressed through the tool that owns it.
      properties:
        id:
          type: string
          example: inventory-check
        method:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          description: Appended to the tool's baseUrl.
          example: /v1/inventory/check
        description:
          type: string
        payloadTemplate:
          type: string
          nullable: true
          description: >-
            JSON template for the request body. Supports ${expression} placeholders evaluated as
            PPCL expressions against the current process context.
        expectedStatusCodes:
          type: array
          items:
            type: integer
          description: HTTP status codes treated as successful. Defaults to [200, 201, 204].

    # ── Task Definition ─────────────────────────────────────
    # The reusable half of a task: what it is, which artifacts it reads and writes, which rules
    # guard it, and which roles are *able* to perform it. The per-workflow half — which single role
    # does perform it there, what it waits for, whether it may run in parallel — lives in the
    # referencing workflow's `tasks` as a TaskUse, because each of those answers is a property of
    # the workflow and not of the task: `dependsOn` names siblings of one workflow, and `override`
    # belongs to that workflow's `extends` chain.
    TaskDefinitionInput:
      type: object
      required: [ id, name, performedByRoles ]
      properties:
        id:
          type: string
          example: review-order
        name:
          type: string
        description:
          type: string
        performedByRoles:
          type: array
          minItems: 1
          description: >-
            Role definition ids able to perform this task. A list because the task is shared: each
            workflow referencing it picks exactly one of these as that workflow's TaskUse
            performedBy. Naming a role here does not put the task in any workflow.
          items:
            type: string
        inputs:
          type: array
          description: >-
            Ids of the ArtifactDefinitions this task reads. Ids rather than typed references:
            an artifact's own `artifactType` already says whether it is an entity, a document or a
            widget, so anything a task touches is declared as an artifact of the organization.
          items:
            type: string
        outputs:
          type: array
          description: Ids of the ArtifactDefinitions this task produces or modifies.
          items:
            type: string
        preconditionRuleId:
          type: string
          nullable: true
          description: >-
            Id of a rule in base-rule. Evaluated when this task is a candidate to become ACTIVE.
            If it returns false, the task stays PENDING.
        postconditionRuleId:
          type: string
          nullable: true
          description: >-
            Id of a rule in base-rule. Evaluated when a user calls /complete. If it returns false,
            completion is rejected and the task stays ACTIVE.
        steps:
          type: array
          description: >-
            Ordered guidance for completing this task. A USER_STEP is informal and not enforced by
            the engine; a SERVICE_STEP names a tool operation the engine calls.
          items:
            $ref: "#/components/schemas/TaskStepDefinition"
        version:
          type: integer
          format: int64
          nullable: true
          description: >-
            The version the caller last read. When supplied, the write is refused with 409 unless it
            still matches the stored one — which is what makes a full-replacement PUT safe against a
            lost update: two editors who both loaded version 3 cannot both save over it. Omit it to
            overwrite unconditionally.

    TaskDefinition:
      allOf:
        - $ref: "#/components/schemas/TaskDefinitionInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    # ── Task Step Definition ────────────────────────────────
    # One flat schema with a `stepType` discriminant field rather than a polymorphic subtype tree:
    # this is how every ProcessPuzzle contract models a variant, and it keeps the value a plain
    # Jackson round-trip in the JSONB column the steps are stored in.
    TaskStepDefinition:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          example: check-items
        name:
          type: string
        description:
          type: string
        stepType:
          $ref: "#/components/schemas/TaskStepType"
        toolDefinitionId:
          type: string
          nullable: true
          description: >-
            Tool definition id. On a SERVICE_STEP, completing the step triggers a REST call to that
            tool's operation; the result is made available to later steps via the process context.
        toolOperation:
          type: string
          nullable: true
          description: Operation id within the referenced tool definition.
        inputMapping:
          type: object
          nullable: true
          description: >-
            Maps the process context and artifact instances onto tool operation inputs. Keys are
            tool parameter names, values are PPCL expressions evaluated against the process context.
          additionalProperties:
            type: string
        outputMapping:
          type: object
          nullable: true
          description: >-
            Maps tool response fields back into the process context. Keys are context variable
            names, values are JSONPath expressions into the tool response.
          additionalProperties:
            type: string

    # ─────────────────────────────────────────────────────────
    # WORKFLOW LAYER — SPEM's Process
    # ─────────────────────────────────────────────────────────
    # A Workflow composes the catalog. Its four reference lists hold `...Use` objects rather than
    # bare ids: a Use is where configuration that is true of a definition *only in this workflow*
    # belongs, so adding such a field later is not a breaking change to the reference list's shape.
    #
    # There is no `WorkflowUse` and no `WorkflowDefinition` — a workflow is not itself reused inside
    # another, it is *extended* (see `extends`), which is a different relation.

    #-----------------------------------------------------------------------------------+
    #                            WORKFLOW START MECHANISMS                              |
    #------------------------------------+----------------------------------------------+
    #       START MECHANISM              |               SPEM METAMODEL EQUIVALENT      |
    #------------------------------------+----------------------------------------------+
    # 1. Artifact Driven (Data-Flow)     | Artifact / Precondition                      |
    # 2. Event / Signal Driven           | Triggering Event / External Task Execution   |
    # 3. On-Demand / Manual Role Launch  | Role Definition + Task Use                   |
    # 4. Scheduled / Temporal Start      | Time-based Precondition / Milestone Guard    |
    #------------------------------------+----------------------------------------------+
    WorkflowStartConditionType:
      type: string
      enum: [ INPUT_ARTIFACT, TRIGGERING_EVENT, ROLE_DEFINITION, TIME_BASED_PRECONDITION ]

    WorkflowStartCondition:
      type: object
      required: [ startType ]
      description: >-
        How an instance of this workflow comes into being. `startType` selects the mechanism and
        decides which of the remaining fields carry meaning; the others are ignored. A workflow
        without a start condition can only be started explicitly through /instances.
      properties:
        startType:
          $ref: "#/components/schemas/WorkflowStartConditionType"
        requiredArtifacts:
          type: array
          description: INPUT_ARTIFACT — the artifacts, and optionally the states, that must be present.
          items:
            $ref: "#/components/schemas/RequiredStartArtifact"
        eventType:
          type: string
          nullable: true
          description: TRIGGERING_EVENT — the event that starts the workflow.
          example: order.submitted
        payloadMapping:
          type: object
          nullable: true
          description: >-
            TRIGGERING_EVENT — maps the event payload into the new instance's context. Keys are
            context variable names, values are JSONPath expressions into the event.
          additionalProperties:
            type: string
        authorizedRoles:
          type: array
          nullable: true
          description: >-
            ROLE_DEFINITION — role definition ids allowed to start the workflow by hand. Empty or
            absent means any user may.
          items:
            type: string
        milestoneRef:
          type: string
          nullable: true
          description: TIME_BASED_PRECONDITION — the milestone whose arrival is the trigger.
          example: MILESTONE_REACHED
        preconditionExpression:
          type: string
          nullable: true
          description: TIME_BASED_PRECONDITION — PPCL guard that must hold when the milestone arrives.
          example: milestone.status == 'PASSED'

    RequiredStartArtifact:
      type: object
      required: [ artifactDefinitionId ]
      properties:
        artifactDefinitionId:
          type: string
          example: order-entity
        state:
          type: string
          nullable: true
          description: >-
            State the artifact has to be in, as named by its base-state machine. Absent means any
            state will do.
          example: DRAFT

    # ── Workflow ────────────────────────────────────────────
    WorkflowInput:
      type: object
      required: [ id, name, tasks ]
      properties:
        id:
          type: string
          example: order-fulfillment-workflow
        name:
          type: string
        description:
          type: string
        extends:
          type: string
          nullable: true
          description: >-
            Id of a parent workflow to inherit roles, artifacts, tools and task uses from. Follows
            the same extends/override convention as base-rule.
        startCondition:
          $ref: "#/components/schemas/WorkflowStartCondition"
        roles:
          type: array
          description: The RoleDefinitions taking part in this workflow.
          items:
            $ref: "#/components/schemas/RoleUse"
        artifacts:
          type: array
          description: >-
            The ArtifactDefinitions this workflow produces or consumes. A task of the workflow may
            only name artifacts declared here.
          items:
            $ref: "#/components/schemas/ArtifactUse"
        tools:
          type: array
          description: The ToolDefinitions this workflow's task steps may invoke.
          items:
            $ref: "#/components/schemas/ToolUse"
        tasks:
          type: array
          minItems: 1
          description: The tasks of this workflow, each pinned to the role performing it here.
          items:
            $ref: "#/components/schemas/TaskUse"
        version:
          type: integer
          format: int64
          nullable: true
          description: >-
            The version the caller last read. When supplied, the write is refused with 409 unless it
            still matches the stored one — which is what makes a full-replacement PUT safe against a
            lost update: two editors who both loaded version 3 cannot both save over it. Omit it to
            overwrite unconditionally.

    Workflow:
      allOf:
        - $ref: "#/components/schemas/WorkflowInput"
        - type: object
          properties:
            activeInstances:
              type: integer
              readOnly: true
              description: >-
                Number of ACTIVE instances of this workflow. Server-computed; ignored on write.
                Present so the list screen can show it without a second request — the list returns
                the same full schema the single GET does, because base-entity's generated form reads
                the record out of the loaded list rather than re-fetching it.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    # ── Role Use ────────────────────────────────────────────
    RoleUse:
      type: object
      required: [ roleDefinitionId ]
      properties:
        roleDefinitionId:
          type: string
          description: Id of a RoleDefinition of this organization.
          example: clerk

    # ── Artifact Use ────────────────────────────────────────
    ArtifactUse:
      type: object
      required: [ artifactDefinitionId ]
      properties:
        artifactDefinitionId:
          type: string
          description: Id of an ArtifactDefinition of this organization.
          example: order-entity

    # ── Tool Use ────────────────────────────────────────────
    ToolUse:
      type: object
      required: [ toolDefinitionId ]
      properties:
        toolDefinitionId:
          type: string
          description: Id of a ToolDefinition of this organization.
          example: automated-check-tool

    # ── Task Use ────────────────────────────────────────────
    TaskUse:
      type: object
      required: [ taskDefinitionId, performedBy ]
      description: >-
        One task's place in one workflow. A TaskDefinition is shared, so everything true of it only
        *here* lives on this row instead: which of the task's performedByRoles performs it, what has
        to finish first, and whether it may run beside its siblings.

        A task appears at most once per workflow. That is what lets dependsOn keep naming a plain
        task definition id, and it makes the role-performs-task pair unique within the workflow by
        construction rather than by a check.
      properties:
        taskDefinitionId:
          type: string
          description: Id of a TaskDefinition of this organization.
          example: review-order
        performedBy:
          type: string
          description: >-
            Role definition id. Has to be one of the workflow's roles *and* one of the referenced
            task's performedByRoles — the task says who is able to perform it, the workflow says
            who does.
          example: clerk
        dependsOn:
          type: array
          description: >-
            Task definition ids, of task uses of this same workflow, that must reach a terminal
            status before this task can become ACTIVE. Empty means the task is eligible from
            workflow start.
          items:
            type: string
        joinType:
          $ref: "#/components/schemas/JoinType"
        parallel:
          type: boolean
          default: false
          description: >-
            When true, this task can run concurrently with its siblings that share the same
            dependsOn. When false (default), tasks within the same dependency level run
            sequentially in declaration order.
        override:
          type: boolean
          default: false
          description: >-
            When this workflow extends another, marks this task use as replacing the parent's use of
            the same task rather than adding to it.

    # ── Process Instance (runtime) ─────────────────────────
    StartProcessRequest:
      type: object
      required: [ processDefinitionId ]
      properties:
        processDefinitionId:
          type: string
        entityId:
          type: string
          nullable: true
          description: >-
            Optional base-entity entity instance this process runs against. When set,
            it is passed as context to rule evaluation and state machine triggers.
        context:
          type: object
          nullable: true
          description: >-
            Initial key/value context variables available to rule guards, postcondition
            expressions, and tool payload templates throughout the process instance.
          additionalProperties: true

    # One flat schema rather than a `ProcessInstanceSummary` base plus an `allOf` extension: the list
    # endpoint returns the same full shape the single GET returns, so there is no second, lighter
    # projection left to name. See `listProcessInstances` for why.
    ProcessInstance:
      type: object
      properties:
        id:
          type: string
        processDefinitionId:
          type: string
        processDefinitionName:
          type: string
        status:
          $ref: "#/components/schemas/ProcessInstanceStatus"
        entityId:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskInstance"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactInstance"
        context:
          type: object
          readOnly: true
          description: >-
            The instance's current context: the values it was started with, with every completed
            task's `contextContribution` folded in, in completion order. Assembled per response
            rather than stored as one accumulated field — see TaskInstance.contextContribution for
            why. Server-computed; ignored on write.
          additionalProperties: true

    # ── Task Instance (runtime) ────────────────────────────
    TaskInstance:
      type: object
      properties:
        id:
          type: string
        taskDefinitionId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TaskInstanceStatus"
        assignedTo:
          type: string
          nullable: true
          description: User id (from base-entity)
        blockedReason:
          type: string
          nullable: true
          description: >-
            Set when status is BLOCKED — contains the result detail from the
            precondition rule evaluation that prevented activation.
        activatedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        skippedAt:
          type: string
          format: date-time
          nullable: true
        stepResults:
          type: array
          items:
            $ref: "#/components/schemas/StepResult"
        contextContribution:
          type: object
          readOnly: true
          description: >-
            What completing this task added to the process context: the context the caller supplied
            with the completion, merged with whatever this task's SERVICE_STEPs mapped back out of
            their tool responses.

            Recorded per task rather than accumulated on the process instance, so that completing a
            task writes only its own row — otherwise every completion would contend on the
            instance's optimistic lock and two `parallel` tasks could not be completed
            concurrently. `ProcessInstance.context` is the fold of these.
          additionalProperties: true

    StepResult:
      type: object
      properties:
        stepId:
          type: string
        completedAt:
          type: string
          format: date-time
        toolResponse:
          type: object
          nullable: true
          description: Raw response body from the tool call, if this step invoked a tool.
          additionalProperties: true
        error:
          type: string
          nullable: true

    AssignTaskRequest:
      type: object
      required: [ userId ]
      properties:
        userId:
          type: string

    CompleteTaskRequest:
      type: object
      properties:
        context:
          type: object
          description: >-
            Additional context variables to merge into the process context before
            evaluating the postcondition. Useful for passing output values from
            the user's actions (e.g. reviewScore, approval decision).
          additionalProperties: true

    CompleteTaskResponse:
      type: object
      properties:
        accepted:
          type: boolean
          description: True if postcondition passed and the task moved to COMPLETED.
        task:
          $ref: "#/components/schemas/TaskInstance"
        postconditionDetail:
          type: string
          nullable: true
          description: >-
            Human-readable detail from the postcondition evaluation. Present when
            accepted is false — tells the user what condition wasn't met yet.

    # ── Artifact Instance (runtime) ───────────────────────
    # Embedded in its ProcessInstance, unlike the ArtifactDefinition it is made from: an instance
    # has no life apart from the run that produced it, which is why it is reached through
    # /instances/{instanceId}/artifacts rather than a resource of its own.

    # ── Artifact Instance (runtime) ────────────────────────────
    ArtifactInstance:
      type: object
      properties:
        id:
          type: string
        artifactDefinitionId:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/ArtifactType"
        entityId:
          type: string
          nullable: true
          description: ID of the actual entity instance in base-entity.
        stateMachineInstanceId:
          type: string
          nullable: true
          description: >-
            ID of the state machine instance in base-state. Clients that need the
            current state or full state history should query base-state's API directly
            using this ID. base-workflow only stores the reference.
        currentState:
          type: string
          nullable: true
          description: >-
            Cached current state name from base-state, refreshed when
            EntityStateChangedEvent is received. Provided here as a convenience so
            clients don't need to query base-state just to render a process overview.
        updatedAt:
          type: string
          format: date-time

    # ── Paging ─────────────────────────────────────────────
    PageOf_Workflow:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    PageOf_ProcessInstance:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInstance"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string

    Locale:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical Locale — see the note on WidgetInstance there for why
        this workspace repeats rather than $refs across files. A bare string schema generates no Java
        class, so the repetition needs no schemaMappings entry.
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      minLength: 2
      maxLength: 6
      example: en

    TranslationScope:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical TranslationScope. Transloco scope a bundle loads under,
        and the directory segment its asset equivalent would have had.
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
      minLength: 1
      maxLength: 64
      example: base_app

    TranslationBundle:
      type: object
      description: >-
        Repeat of shared-api.yaml's canonical TranslationBundle, mapped onto the shared generated type.
        One transloco bundle: the whole message map of an (organization, scope, locale) triple, in the
        exact shape the frontend's asset file has. Keys are relative to the scope — transloco prefixes
        them with the scope alias itself.
      additionalProperties: true
      nullable: true
      example:
        module:
          name: Order administration
        route:
          orders: All orders
