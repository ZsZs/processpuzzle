openapi: 3.0.3
info:
  title: ProcessPuzzle Workflow Engine API (base-workflow)
  description: >-
    SPEM-inspired workflow definition and execution API. Orchestrates tasks, roles,
    work products and tools across a ProcessPuzzle process instance.

    base-workflow is a pure orchestrator: rule evaluation is delegated to base-rule, state
    machine transitions to base-state, and entity data shape to base-entity. References to
    those libraries are by ID only — base-workflow never owns or duplicates their models.
    Coordination between libraries happens exclusively through the shared event schema
    defined in base-workflow-events.yaml.

    All resources are scoped per organisation via the {orgKey} path variable, consistent
    with the multi-tenancy convention used across the ProcessPuzzle platform (see
    processpuzzle-core's OrganizationGuard / orgKey scoping).
  version: 0.2.0

servers:
  - url: /api/workflow

# ─────────────────────────────────────────────────────────────
# DEFINITION API  (design-time)
# ─────────────────────────────────────────────────────────────
paths:

  # ── Process Definitions ───────────────────────────────────

  /organisations/{orgKey}/processes:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listProcessDefinitions
      tags: [ Process Definitions ]
      summary: List all process definitions
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of process definitions (summary view, no tasks/steps)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_ProcessDefinitionSummary"

    post:
      operationId: createProcessDefinition
      tags: [ Process Definitions ]
      summary: Create a new process definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organisations/{orgKey}/processes/{processId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
    get:
      operationId: getProcessDefinition
      tags: [ Process Definitions ]
      summary: Get a process definition with all tasks, roles, work products and tools
      responses:
        "200":
          description: Full process definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateProcessDefinition
      tags: [ Process Definitions ]
      summary: Replace a process definition
      description: >-
        Only allowed if there are no ACTIVE process instances for this definition.
        Use version to prevent lost updates (optimistic locking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteProcessDefinition
      tags: [ Process Definitions ]
      summary: Delete a process definition
      description: Only allowed if there are no process instances (active or historic).
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organisations/{orgKey}/processes/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importProcessDefinitions
      tags: [ Process Definitions ]
      summary: Bulk-import process definitions from a SPEM YAML file
      description: >-
        All-or-nothing import: if any entry fails structural validation, nothing in the file
        is persisted. References to base-rule rule IDs and base-state state machine IDs are
        recorded as-is and validated lazily at instance start time, not at import time.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /organisations/{orgKey}/processes/{processId}/export:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
    get:
      operationId: exportProcessDefinition
      tags: [ Process Definitions ]
      summary: Export a single process definition as SPEM YAML
      responses:
        "200":
          description: YAML file
          content:
            application/x-yaml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Role Definitions (direct access) ──────────────────────
  # Roles are owned by a process definition (their id is only unique within that
  # process, same convention as tasks), but can now be read/managed directly
  # instead of only via a full PUT of the process definition.

  /organisations/{orgKey}/processes/{processId}/roles:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
    get:
      operationId: listRoleDefinitions
      tags: [ Role Definitions ]
      summary: List all role definitions of a process definition
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Role definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createRoleDefinition
      tags: [ Role Definitions ]
      summary: Add a new role definition to a process definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organisations/{orgKey}/processes/{processId}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
      - $ref: "#/components/parameters/RoleIdParam"
    get:
      operationId: getRoleDefinition
      tags: [ Role Definitions ]
      summary: Get a single role definition
      responses:
        "200":
          description: Role definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateRoleDefinition
      tags: [ Role Definitions ]
      summary: Replace a role definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteRoleDefinition
      tags: [ Role Definitions ]
      summary: Delete a role definition
      description: >-
        Only allowed if no task definition in the process still references this
        role via performedBy.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Task Definitions (direct access) ──────────────────────
  # Same convention as roles: task ids are unique within their process definition.
  # These endpoints let clients read/manage a single task without a full process PUT.

  /organisations/{orgKey}/processes/{processId}/tasks:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
    get:
      operationId: listTaskDefinitions
      tags: [ Task Definitions ]
      summary: List all task definitions of a process definition
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Task definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createTaskDefinition
      tags: [ Task Definitions ]
      summary: Add a new task definition to a process definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organisations/{orgKey}/processes/{processId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ProcessIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    get:
      operationId: getTaskDefinition
      tags: [ Task Definitions ]
      summary: Get a single task definition
      responses:
        "200":
          description: Task definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateTaskDefinition
      tags: [ Task Definitions ]
      summary: Replace a task definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteTaskDefinition
      tags: [ Task Definitions ]
      summary: Delete a task definition
      description: Only allowed if no other task definition references this one via dependsOn.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Tool Definitions ──────────────────────────────────────

  /organisations/{orgKey}/tools:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listToolDefinitions
      tags: [ Tool Definitions ]
      summary: List all tool definitions
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Tool definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolDefinition"

    post:
      operationId: createToolDefinition
      tags: [ Tool Definitions ]
      summary: Create a new tool definition (external REST service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organisations/{orgKey}/tools/{toolId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - name: toolId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getToolDefinition
      tags: [ Tool Definitions ]
      summary: Get a tool definition
      responses:
        "200":
          description: Tool definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateToolDefinition
      tags: [ Tool Definitions ]
      summary: Update a tool definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteToolDefinition
      tags: [ Tool Definitions ]
      summary: Delete a tool definition
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ─────────────────────────────────────────────────────────────
  # EXECUTION API  (runtime)
  # ─────────────────────────────────────────────────────────────

  # ── Process Instances ─────────────────────────────────────

  /organisations/{orgKey}/instances:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listProcessInstances
      tags: [ Process Instances ]
      summary: List process instances
      parameters:
        - name: processId
          in: query
          description: Filter by process definition id
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProcessInstanceStatus"
        - name: entityId
          in: query
          description: >-
            Filter by the base-entity entity instance this process is running against.
            Useful when a process is tied to a specific entity (e.g. "delivery process for
            Order #1234").
          schema:
            type: string
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of process instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_ProcessInstanceSummary"

    post:
      operationId: startProcessInstance
      tags: [ Process Instances ]
      summary: Start a new process instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProcessRequest"
      responses:
        "201":
          description: Instance created and first tasks activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Process definition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisations/{orgKey}/instances/{instanceId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
    get:
      operationId: getProcessInstance
      tags: [ Process Instances ]
      summary: Get a process instance with its task and work product instances
      responses:
        "200":
          description: Full process instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: cancelProcessInstance
      tags: [ Process Instances ]
      summary: Cancel a running process instance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "204":
          description: Cancelled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Instance is already completed or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Task Instances ─────────────────────────────────────────

  /organisations/{orgKey}/instances/{instanceId}/tasks:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
    get:
      operationId: listTaskInstances
      tags: [ Task Instances ]
      summary: List all task instances for a process instance
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskInstanceStatus"
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Task instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInstance"

  /organisations/{orgKey}/instances/{instanceId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    get:
      operationId: getTaskInstance
      tags: [ Task Instances ]
      summary: Get a single task instance
      responses:
        "200":
          description: Task instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /organisations/{orgKey}/instances/{instanceId}/tasks/{taskId}/assign:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    post:
      operationId: assignTask
      tags: [ Task Instances ]
      summary: Assign an active task to a user
      description: >-
        The assignee must hold a role that matches the task's performedBy role
        definition. Role membership is managed by base-entity; base-workflow validates by
        calling base-entity's role membership query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTaskRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is not in ACTIVE status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisations/{orgKey}/instances/{instanceId}/tasks/{taskId}/complete:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    post:
      operationId: completeTask
      tags: [ Task Instances ]
      summary: Mark a task as completed
      description: >-
        Triggers evaluation of the task's postcondition (via base-rule) and, if it
        passes, publishes TaskCompletedEvent. base-state will react to that event and
        fire the corresponding state machine transition on any linked work products.
        base-workflow will then re-evaluate which tasks become ACTIVE next.
        If the postcondition fails, the task stays ACTIVE and the response includes
        the evaluation detail.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Completion accepted (postcondition passed) or rejected (postcondition failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Task is not in ACTIVE status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisations/{orgKey}/instances/{instanceId}/tasks/{taskId}/skip:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - $ref: "#/components/parameters/TaskIdParam"
    post:
      operationId: skipTask
      tags: [ Task Instances ]
      summary: Skip a task (manager override)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Work Product Instances ────────────────────────────────

  /organisations/{orgKey}/instances/{instanceId}/work-products:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
    get:
      operationId: listWorkProductInstances
      tags: [ Work Product Instances ]
      summary: >-
        List work product instances in a process instance. Each entry carries the
        current state from base-state (read-only from base-workflow's perspective)
        and the entityId linking to the actual data in base-entity.
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: Work product instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkProductInstance"

  /organisations/{orgKey}/instances/{instanceId}/work-products/{workProductId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/InstanceIdParam"
      - name: workProductId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWorkProductInstance
      tags: [ Work Product Instances ]
      summary: Get a single work product instance
      responses:
        "200":
          description: Work product instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkProductInstance"
        "404":
          $ref: "#/components/responses/NotFound"

# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────
  # ── Translations ──
  # The UI message bundles this feature owns, in the shape the frontend's asset files have. Two
  # templates rather than one with an optional segment: 4 vs 5 segments is what makes them
  # unambiguous, and it mirrors `assets/i18n/<lang>.json` and `assets/i18n/<scope>/<lang>.json`.
  #
  # `workflow` is the feature's own service root. Every feature serves its own translations from its
  # own store, so that a later split into services with separate databases moves this segment into the
  # host rather than rewriting the resource. In the monolith it is also what keeps seven identical
  # `/translations` paths from colliding into an ambiguous mapping at startup.
  /organisations/{orgKey}/workflow/translations/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base Workflow Translations
      summary: Root translation bundle of this feature for one language
      operationId: getWorkflowTranslations
      description: >-
        The bundle that has no transloco scope — the equivalent of `assets/i18n/<lang>.json`.
        Answers 200 with an empty object when nothing has been seeded, rather than 404: the
        frontend loader reaches here only after an asset miss, and an error status would make an
        unseeded locale indistinguishable from a broken backend.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'

  /organisations/{orgKey}/workflow/translations/{scope}/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationScopeParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base Workflow Translations
      summary: One scoped translation bundle of this feature
      operationId: getWorkflowScopedTranslations
      description: >-
        The equivalent of `assets/i18n/<scope>/<lang>.json`. Keys are relative to the scope, as in
        the asset files: transloco prefixes them with the scope alias itself.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this scope and locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'


components:

  parameters:
    TranslationLocaleParam:
      name: locale
      in: path
      required: true
      description: BCP-47 language tag of the bundle to read.
      schema:
        $ref: '#/components/schemas/Locale'

    TranslationScopeParam:
      name: scope
      in: path
      required: true
      description: Transloco scope of the bundle to read.
      schema:
        $ref: '#/components/schemas/TranslationScope'

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        type: string
      description: >-
        Organisation key used to scope all base-workflow resources for multi-tenancy.
        Matches the orgKey convention used across processpuzzle-core (OrganizationGuard).
    ProcessIdParam:
      name: processId
      in: path
      required: true
      schema:
        type: string
    InstanceIdParam:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    RoleIdParam:
      name: roleId
      in: path
      required: true
      schema:
        type: string
    TaskIdParam:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: RSQL filter expression. See shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ── Enums ──────────────────────────────────────────────

    ProcessInstanceStatus:
      type: string
      enum: [ ACTIVE, COMPLETED, CANCELLED, SUSPENDED ]

    TaskInstanceStatus:
      type: string
      enum: [ PENDING, ACTIVE, COMPLETED, SKIPPED, BLOCKED ]

    WorkProductType:
      type: string
      enum: [ ARTIFACT, DELIVERABLE, OUTCOME, ENTITY ]

    AuthType:
      type: string
      enum: [ NONE, BEARER_TOKEN, BASIC, API_KEY ]

    HttpMethod:
      type: string
      enum: [ GET, POST, PUT, PATCH, DELETE ]

    ReferenceType:
      type: string
      enum: [ BASE_ENTITY, DOCUMENT, WIDGET ]
      description: >-
        The kind of resource a TaskIOReference points to. BASE_ENTITY references an
        entity instance/definition in base-entity, DOCUMENT references a base-artifact
        document, WIDGET references a widget registered in base-entity-frontend's
        WIDGET_REGISTRY.

    # ── Process Definition ─────────────────────────────────

    ProcessDefinitionSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int64
        activeInstances:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProcessDefinitionInput:
      type: object
      required: [ id, name, tasks ]
      properties:
        id:
          type: string
          example: software-delivery
        name:
          type: string
        description:
          type: string
        extends:
          type: string
          nullable: true
          description: >-
            ID of a parent ProcessDefinition to inherit roles, work products and tasks
            from. Follows the same extends/override convention as base-rule.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleDefinitionInput"
        workProducts:
          type: array
          items:
            $ref: "#/components/schemas/WorkProductDefinitionInput"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskDefinitionInput"
        tools:
          type: array
          description: >-
            References to ToolDefinitions used by tasks in this process. Defined
            separately via /tools so they can be shared across process definitions.
          items:
            type: string
            description: Tool definition id

    ProcessDefinition:
      allOf:
        - $ref: "#/components/schemas/ProcessDefinitionInput"
        - type: object
          properties:
            version:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    # ── Role Definition ────────────────────────────────────

    RoleDefinitionInput:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          example: developer
        name:
          type: string
        description:
          type: string
        entityRoleId:
          type: string
          nullable: true
          description: >-
            ID of the corresponding role definition in base-entity. When set,
            base-workflow validates that a user holds this entity role before
            allowing them to be assigned to tasks that require this role.

    RoleDefinition:
      allOf:
        - $ref: "#/components/schemas/RoleDefinitionInput"
        - type: object
          properties:
            processId:
              type: string
              description: ID of the process definition this role belongs to.

    # ── Work Product Definition ────────────────────────────

    WorkProductDefinitionInput:
      type: object
      required: [ id, name, type ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/WorkProductType"
        entityTypeId:
          type: string
          nullable: true
          description: >-
            ID of the entity type in base-entity that backs this work product's data.
            base-workflow uses this to link a WorkProductInstance to its entity instance.
        stateMachineId:
          type: string
          nullable: true
          description: >-
            ID of the state machine definition in base-state that governs this work
            product's lifecycle. base-workflow passes this ID when publishing
            WorkProductInstanceCreatedEvent so base-state can initialize the right machine.

    # ── Task Definition ─────────────────────────────────────

    TaskDefinitionInput:
      type: object
      required: [ id, name, performedBy ]
      properties:
        id:
          type: string
          example: write-spec
        name:
          type: string
        description:
          type: string
        performedBy:
          type: string
          description: Role definition id
        inputs:
          type: array
          description: >-
            Resources this task reads. Each reference points directly at a base-entity
            entity, a base-artifact document, or a widget — not at a WorkProductDefinition.
            Use workProducts / WorkProductType when the resource's lifecycle must be
            tracked by base-state; use these references for plain read/write access.
          items:
            $ref: "#/components/schemas/TaskIOReference"
        outputs:
          type: array
          description: Resources this task produces or modifies. Same reference model as inputs.
          items:
            $ref: "#/components/schemas/TaskIOReference"
        preconditionRuleId:
          type: string
          nullable: true
          description: >-
            ID of a rule in base-rule. Evaluated when this task is a candidate to
            become ACTIVE. If it returns false, the task stays PENDING.
        postconditionRuleId:
          type: string
          nullable: true
          description: >-
            ID of a rule in base-rule. Evaluated when a user calls /complete. If it
            returns false, completion is rejected and the task stays ACTIVE.
        steps:
          type: array
          description: >-
            Ordered, informal description of what to do to complete this task — free-text
            guidance, not enforced by the engine. Kept deliberately simple for now; a
            future revision may evolve steps into a checklist that instance execution can
            track item-by-item (see StepResult at instance level, which already records a
            per-step outcome for steps that invoke a tool).
          items:
            $ref: "#/components/schemas/StepDefinitionInput"
        dependsOn:
          type: array
          description: >-
            Task definition ids that must be COMPLETED before this task can
            become ACTIVE. Empty means the task is eligible from process start.
          items:
            type: string
        parallel:
          type: boolean
          default: false
          description: >-
            When true, this task can run concurrently with its siblings that share
            the same dependsOn. When false (default), tasks within the same
            dependency level run sequentially in definition order.
        override:
          type: boolean
          default: false
          description: >-
            When this ProcessDefinition extends another, marks this task as replacing
            an identically-named task from the parent rather than adding to it.

    TaskDefinition:
      allOf:
        - $ref: "#/components/schemas/TaskDefinitionInput"
        - type: object
          properties:
            processId:
              type: string
              description: ID of the process definition this task belongs to.

    # ── Task Input/Output Reference ────────────────────────

    TaskIOReference:
      type: object
      required: [ type, refId ]
      properties:
        type:
          $ref: "#/components/schemas/ReferenceType"
        refId:
          type: string
          description: >-
            ID of the referenced resource: a base-entity BaseEntityDefinition/EntityObject
            id when type is BASE_ENTITY, a base-artifact document id when type is DOCUMENT,
            or a widget id (as registered in WIDGET_REGISTRY) when type is WIDGET.
        label:
          type: string
          nullable: true
          description: Optional display label overriding the referenced resource's own name.

    # ── Step Definition ────────────────────────────────────

    StepDefinitionInput:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        toolId:
          type: string
          nullable: true
          description: >-
            Tool definition id. When set, completing this step triggers a REST call
            to the tool's specified operation. The call is made by base-workflow;
            the result is made available to subsequent steps via the process context.
        toolOperation:
          type: string
          nullable: true
          description: Operation id within the referenced tool definition.
        inputMapping:
          type: object
          nullable: true
          description: >-
            Maps fields from the process context / work product instances to tool
            operation input parameters. Keys are tool parameter names, values are
            PPCL expressions evaluated against the process context.
          additionalProperties:
            type: string
        outputMapping:
          type: object
          nullable: true
          description: >-
            Maps tool response fields back into the process context. Keys are context
            variable names, values are JSONPath expressions into the tool response.
          additionalProperties:
            type: string

    # ── Tool Definition ────────────────────────────────────

    ToolDefinitionInput:
      type: object
      required: [ id, name, baseUrl ]
      properties:
        id:
          type: string
          example: jira
        name:
          type: string
        description:
          type: string
        baseUrl:
          type: string
          format: uri
        auth:
          $ref: "#/components/schemas/ToolAuthConfig"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ToolOperationInput"

    ToolDefinition:
      allOf:
        - $ref: "#/components/schemas/ToolDefinitionInput"
        - type: object
          properties:
            version:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time

    ToolAuthConfig:
      type: object
      required: [ type ]
      properties:
        type:
          $ref: "#/components/schemas/AuthType"
        secretRef:
          type: string
          nullable: true
          description: >-
            Key name of the secret in the application's secret store (environment
            variable name or Vault path). base-workflow never stores credential values
            directly — only the reference.

    ToolOperationInput:
      type: object
      required: [ id, method, path ]
      properties:
        id:
          type: string
          example: create-issue
        method:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          example: /rest/api/3/issue
        description:
          type: string
        payloadTemplate:
          type: string
          nullable: true
          description: >-
            JSON template for the request body. Supports ${expression} placeholders
            evaluated as PPCL expressions against the current process context.
        expectedStatusCodes:
          type: array
          items:
            type: integer
          description: HTTP status codes treated as successful. Defaults to [200, 201, 204].

    # ── Process Instance (runtime) ─────────────────────────

    StartProcessRequest:
      type: object
      required: [ processDefinitionId ]
      properties:
        processDefinitionId:
          type: string
        entityId:
          type: string
          nullable: true
          description: >-
            Optional base-entity entity instance this process runs against. When set,
            it is passed as context to rule evaluation and state machine triggers.
        context:
          type: object
          nullable: true
          description: >-
            Initial key/value context variables available to rule guards, postcondition
            expressions, and tool payload templates throughout the process instance.
          additionalProperties: true

    ProcessInstanceSummary:
      type: object
      properties:
        id:
          type: string
        processDefinitionId:
          type: string
        processDefinitionName:
          type: string
        status:
          $ref: "#/components/schemas/ProcessInstanceStatus"
        entityId:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    ProcessInstance:
      allOf:
        - $ref: "#/components/schemas/ProcessInstanceSummary"
        - type: object
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/TaskInstance"
            workProducts:
              type: array
              items:
                $ref: "#/components/schemas/WorkProductInstance"
            context:
              type: object
              description: Current process context, updated by tool output mappings
              additionalProperties: true

    # ── Task Instance (runtime) ────────────────────────────

    TaskInstance:
      type: object
      properties:
        id:
          type: string
        taskDefinitionId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TaskInstanceStatus"
        assignedTo:
          type: string
          nullable: true
          description: User id (from base-entity)
        blockedReason:
          type: string
          nullable: true
          description: >-
            Set when status is BLOCKED — contains the result detail from the
            precondition rule evaluation that prevented activation.
        activatedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        skippedAt:
          type: string
          format: date-time
          nullable: true
        stepResults:
          type: array
          items:
            $ref: "#/components/schemas/StepResult"

    StepResult:
      type: object
      properties:
        stepId:
          type: string
        completedAt:
          type: string
          format: date-time
        toolResponse:
          type: object
          nullable: true
          description: Raw response body from the tool call, if this step invoked a tool.
          additionalProperties: true
        error:
          type: string
          nullable: true

    AssignTaskRequest:
      type: object
      required: [ userId ]
      properties:
        userId:
          type: string

    CompleteTaskRequest:
      type: object
      properties:
        context:
          type: object
          description: >-
            Additional context variables to merge into the process context before
            evaluating the postcondition. Useful for passing output values from
            the user's actions (e.g. reviewScore, approval decision).
          additionalProperties: true

    CompleteTaskResponse:
      type: object
      properties:
        accepted:
          type: boolean
          description: True if postcondition passed and the task moved to COMPLETED.
        task:
          $ref: "#/components/schemas/TaskInstance"
        postconditionDetail:
          type: string
          nullable: true
          description: >-
            Human-readable detail from the postcondition evaluation. Present when
            accepted is false — tells the user what condition wasn't met yet.

    # ── Work Product Instance (runtime) ───────────────────

    WorkProductInstance:
      type: object
      properties:
        id:
          type: string
        workProductDefinitionId:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/WorkProductType"
        entityId:
          type: string
          nullable: true
          description: ID of the actual entity instance in base-entity.
        stateMachineInstanceId:
          type: string
          nullable: true
          description: >-
            ID of the state machine instance in base-state. Clients that need the
            current state or full state history should query base-state's API directly
            using this ID. base-workflow only stores the reference.
        currentState:
          type: string
          nullable: true
          description: >-
            Cached current state name from base-state, refreshed when
            EntityStateChangedEvent is received. Provided here as a convenience so
            clients don't need to query base-state just to render a process overview.
        updatedAt:
          type: string
          format: date-time

    # ── Paging ─────────────────────────────────────────────

    PageOf_ProcessDefinitionSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProcessDefinitionSummary"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    PageOf_ProcessInstanceSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInstanceSummary"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string

    Locale:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical Locale — see the note on WidgetInstance there for why
        this workspace repeats rather than $refs across files. A bare string schema generates no Java
        class, so the repetition needs no schemaMappings entry.
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      minLength: 2
      maxLength: 6
      example: en

    TranslationScope:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical TranslationScope. Transloco scope a bundle loads under,
        and the directory segment its asset equivalent would have had.
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
      minLength: 1
      maxLength: 64
      example: base_app

    TranslationBundle:
      type: object
      description: >-
        Repeat of shared-api.yaml's canonical TranslationBundle, mapped onto the shared generated type.
        One transloco bundle: the whole message map of an (organization, scope, locale) triple, in the
        exact shape the frontend's asset file has. Keys are relative to the scope — transloco prefixes
        them with the scope alias itself.
      additionalProperties: true
      nullable: true
      example:
        module:
          name: Order administration
        route:
          orders: All orders
