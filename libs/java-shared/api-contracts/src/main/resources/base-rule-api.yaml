openapi: 3.0.3
info:
  title: ProcessPuzzle Rule Engine API
  description: >-
    CRUD and YAML import/export operations for PPCL (ProcessPuzzle Constraint Language)
    rule definitions. Intended as the source-of-truth contract — consistent with the
    existing convention of generating Spring server stubs and Angular TypeScript clients
    from OpenAPI YAML via openapi-generator-maven-plugin.

    ## Multi-tenancy

    Every rule definition is scoped by an organization key, exactly as in base-app-api.yaml:
    a rule id is unique only *within* its organization, so two tenants may both define a
    rule called `positive-quantities` with different expressions. The key is carried as a
    path segment so that it appears in logs, audit trails and cache keys — including the
    rule engine's compiled-expression cache, which is keyed by `(orgKey, ruleId)`.

    `extendsRuleId` resolves within the same organization only; cross-organization rule
    inheritance is not a feature, since it would leak one tenant's expressions into
    another's evaluation chain.

    Tenant isolation is a server-side responsibility: `orgKey` must be verified against the
    authenticated principal's `organization` claim and answered with 403 on mismatch. The
    path segment alone is not an authorization decision.
  version: 0.2.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:
  /organizations/{orgKey}/rules:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listRules
      summary: List rule definitions
      tags:
        - Base Rule
      parameters:
        - name: context
          in: query
          description: Filter by the entity type a rule applies to (e.g. "Order").
          schema:
            type: string
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Matching rule definitions (paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_RuleDefinition"
    post:
      operationId: createRule
      summary: Create a new rule definition
      tags:
        - Base Rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - name: id
        in: path
        required: true
        description: Rule definition id — unique within the organization.
        schema:
          type: string
    get:
      operationId: getRule
      summary: Get a rule definition by id
      tags:
        - Base Rule
      responses:
        "200":
          description: The rule definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRule
      summary: Update an existing rule definition
      tags:
        - Base Rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRule
      summary: Delete a rule definition
      tags:
        - Base Rule
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/rules/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importRules
      summary: Bulk-import rule definitions from a PPCL YAML file
      description: >-
        The imported rules are scoped to `{orgKey}` regardless of any organization key
        present in the file, which is what makes an export from one organization importable
        into another.
      tags:
        - Base Rule
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: >-
            Import outcome. All-or-nothing: if any entry fails validation (duplicate id,
            unknown or cyclic 'extends' reference), nothing in the file is persisted and
            the full list of problems is returned in errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /organizations/{orgKey}/rules/export:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: exportRules
      summary: Export rule definitions as a PPCL YAML file
      tags:
        - Base Rule
      parameters:
        - name: context
          in: query
          description: Limit the export to rules for a single entity type.
          schema:
            type: string
      responses:
        "200":
          description: YAML file
          content:
            application/x-yaml:
              schema:
                type: string
                format: binary

  /organizations/{orgKey}/rules/evaluate:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: evaluateObject
      summary: Evaluate rules against a JSON object
      tags:
        - Base Rule
      description: >-
        Evaluates the organization's enabled rules that match the given context against the
        supplied entity payload and returns the aggregated outcome. `passed` is false when at
        least one rule of severity ERROR is violated. Rules belonging to other organizations
        are never applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: >-
        Tenant discriminator; also the public URL segment of the tenant's application. See
        shared-api.yaml OrgKeyParam for the full contract. Must be verified against the
        principal's `organization` claim — 403 on mismatch.
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: >
        RSQL filter expression, applied *in addition to* the organization filter. Results are
        always restricted to the `{orgKey}` in the path, so the expression never needs an
        `orgKey` term — and cannot widen the scope with one, since the organization filter is
        ANDed first (even a top-level `OR` stays inside the organization).
        See shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Severity:
      type: string
      enum: [ ERROR, WARNING, INFO ]

    RuleDefinitionInput:
      type: object
      required: [ id, name, context, expression, severity ]
      properties:
        id:
          type: string
          example: positive-quantities
        name:
          type: string
        description:
          type: string
        context:
          type: string
          description: The entity type this rule applies to.
          example: Order
        expression:
          type: string
          description: PPCL expression — a JS boolean expression evaluated against `entity`.
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
          description: >-
            Human-readable message used when the rule is violated. Surfaced in evaluation
            results and in exceptions raised by enforcing callers. When absent, callers fall
            back to description or name.
        translocoId:
          type: string
          description: >-
            Transloco translation key for the violation message in the UI. The frontend uses
            this key to look up a localized message; the backend treats it as an opaque
            identifier.
        extendsRuleId:
          type: string
          nullable: true
          description: >-
            Id of the rule this one extends/overrides, if any. Resolved within the same
            organization; a rule cannot extend another organization's rule.
        override:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        fields:
          type: array
          description: >-
            Names of the entity attributes the rule applies to. Used by the UI to highlight
            the offending form controls when the rule is violated. Optional; when absent the
            rule is treated as form-level.
          items:
            type: string
          example: [ "total", "lineItems" ]

    RuleDefinition:
      allOf:
        - $ref: "#/components/schemas/RuleDefinitionInput"
        - type: object
          properties:
            # The owning organization. Response-only: the path segment is the single source of
            # truth, so RuleDefinitionInput deliberately has no orgKey to contradict it.
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            version:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PageOf_RuleDefinition:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/RuleDefinition"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    EvaluationRequest:
      type: object
      required: [ context, entity ]
      properties:
        context:
          type: string
          description: The entity type whose rules should be applied.
          example: Order
        entity:
          type: object
          description: The JSON object evaluated as `entity` by each rule's PPCL expression.
          additionalProperties: true

    RuleViolation:
      type: object
      required: [ ruleId, severity ]
      properties:
        ruleId:
          type: string
        ruleName:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
        translocoId:
          type: string
          description: Transloco translation key the UI can use to localize the message.

    EvaluationResult:
      type: object
      required: [ passed, violations ]
      properties:
        passed:
          type: boolean
          description: True when no rule of severity ERROR was violated.
        violations:
          type: array
          items:
            $ref: "#/components/schemas/RuleViolation"

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug; canonical definition in shared-api.yaml. Reserved platform
        segments must be rejected at provisioning even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string
