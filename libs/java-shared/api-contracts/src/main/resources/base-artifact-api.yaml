openapi: 3.0.3
info:
  title: ProcessPuzzle Artifact API (base-artifact)
  description: >-
    Structural API for wiki-style textual artifacts (project plans, design docs, reports)
    composed of a flat, ordered list of blocks. Each block is either a TEXT block (static
    or Tiptap-editable rich text) or a WIDGET block — a reference into the same widget
    registry `base-app-api.yaml`'s WidgetRef resolves against. base-artifact is expected
    to become base-app's primary content type: an app-shell route that renders an
    artifact is modeled as an ordinary WidgetRef (e.g. `type: artifact-viewer`,
    `props.artifactId`), the same way base-app already references `entityName`s into the
    organization's entity registry. base-artifact never needs to know about routes,
    regions or navigation — that stays entirely base-app's concern.

    base-artifact-backend owns ONLY: artifact/block structure, widget component
    references and their static props, declared input/output ports, and opaque Tiptap
    JSON content. It has no knowledge of the runtime data flowing through a widget's
    bindings — resolving inputBindings/outputBindings to actual values happens entirely
    in the frontend runtime interpreter. base-artifact never queries base-entity,
    evaluates rules, or fetches data itself; it only records that a wiring exists.

    Multi-tenancy: every resource here is scoped by `{orgKey}`, exactly as in base-app-api.yaml:
    tenant discriminator, public URL segment, and the scope every id is unique within.
    `OrganizationKey` and `OrgKeyParam` in shared-api.yaml are canonical; verification
    against the authenticated principal's `organization` claim (403 on mismatch) is a
    server-side responsibility, not a decision the path segment makes on its own.

  version: 0.1.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:

  # ── Artifacts ──────────────────────────────────────────────

  /organizations/{orgKey}/artifacts:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listArtifacts
      summary: List the organization's artifacts
      description: >-
        Summary view (no blocks/ports) — see getArtifact for the full document.
      tags:
        - Base Artifact
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of artifacts (summary view, no blocks)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_ArtifactSummary"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createArtifact
      summary: Create a new artifact
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
    get:
      operationId: getArtifact
      summary: Get an artifact with its full block list, input ports and output ports
      tags:
        - Base Artifact
      responses:
        "200":
          description: Full artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateArtifact
      summary: Replace an artifact's title, ports and full block list
      description: >-
        Whole-document replace. version is bumped on success and is the optimistic-
        locking token. For fine-grained edits (e.g. a single Tiptap autosave) prefer the
        block-level endpoints below, which don't require resending the entire block list.
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteArtifact
      summary: Delete an artifact
      tags:
        - Base Artifact
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/artifacts/{artifactId}/properties:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
    put:
      operationId: updateArtifactProperties
      summary: Update title, description and ports without touching blocks
      description: >-
        For editors of the generic Properties form, which has no business overwriting
        content maintained separately through the block-level endpoints. Structurally
        cannot send blocks — ArtifactPropertiesInput has no such field — so this is safe
        to call regardless of what block-level edits have happened concurrently. Bumps
        the same version as updateArtifact; both endpoints write the one Artifact row.
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactPropertiesInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Blocks (fine-grained editing) ────────────────────────────

  /organizations/{orgKey}/artifacts/{artifactId}/blocks:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
    post:
      operationId: appendArtifactBlock
      summary: Append a new block to the end of the artifact
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactBlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/artifacts/{artifactId}/blocks/reorder:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
    put:
      operationId: reorderArtifactBlocks
      summary: Reorder blocks
      description: >-
        Position is implicit in array order — there is no stored position field. The
        submitted list must be a permutation of the artifact's current block ids.
        Reordering a REFERENCED widget block has no visible effect on its own — its
        position is determined entirely by whatever points at its id (a widgetEmbed
        node or a container widget's props.childIds), not by its array position.
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderBlocksRequest"
      responses:
        "200":
          description: New block order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/artifacts/{artifactId}/blocks/{blockId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
      - $ref: "#/components/parameters/BlockIdParam"
    put:
      operationId: replaceArtifactBlock
      summary: Replace a single block's content (e.g. Tiptap autosave, widget prop edit)
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactBlockInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteArtifactBlock
      summary: >-
        Remove a block. If it is a REFERENCED widget block still pointed at by a
        widgetEmbed node or another widget's props.childIds, the backend rejects the
        delete with 409 rather than leaving a dangling reference.
      tags:
        - Base Artifact
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Validation, import, export ────────────────────────────────

  /organizations/{orgKey}/artifacts/validate:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: validateArtifact
      summary: Validate a candidate artifact without persisting it
      description: >-
        Checks referential integrity: unique block ids; every widgetEmbed node's
        blockId, and every WIDGET block's props.childIds entries, resolving to a
        declared WIDGET block with placement REFERENCED (ERROR if not); every
        inputBindings/outputBindings value naming a declared port (ERROR if not); and a
        REFERENCED widget block pointed at by nothing at all (WARNING, not ERROR — a
        widget can be declared before it's placed in the text or wired into a
        container). Widget props are otherwise not validated here, same as base-app —
        each widget owns its own props shape, including how it interprets childIds.
        Used by the frontend for live feedback before writing.
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInput"
      responses:
        "200":
          description: Validation outcome — 200 even when valid is false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgKey}/artifacts/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importArtifacts
      summary: Bulk-import artifacts from a YAML file
      description: >-
        Imported artifacts are scoped to {orgKey} regardless of any organization
        reference in the file, so an export from one organization is directly
        importable into another. All-or-nothing: if any entry fails validation,
        nothing is persisted.
      tags:
        - Base Artifact
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgKey}/artifacts/{artifactId}/export:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/ArtifactIdParam"
    get:
      operationId: exportArtifact
      summary: Export an artifact as a YAML file
      tags:
        - Base Artifact
      responses:
        "200":
          description: YAML file
          content:
            application/x-yaml:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: >-
        Tenant discriminator; also the public URL segment of the tenant's application.
        See shared-api.yaml OrgKeyParam for the full contract. Must be verified against
        the principal's `organization` claim — 403 on mismatch.
    ArtifactIdParam:
      name: artifactId
      in: path
      required: true
      description: Artifact id — unique within the organization.
      schema:
        type: string
    BlockIdParam:
      name: blockId
      in: path
      required: true
      schema:
        type: string
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: >-
        RSQL filter expression, applied in addition to the organization filter. See
        shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The authenticated principal may not act on this organization — typically an
        orgKey that does not match the principal's organization claim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource (e.g. stale version, dangling reference).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ── Artifact ──────────────────────────────────────────────

    ArtifactPropertiesInput:
      type: object
      required: [ title ]
      description: >-
        Same title/description/inputPorts/outputPorts fields as ArtifactInput, minus id
        (already in the path) and blocks (structurally absent, not merely optional — see
        updateArtifactProperties). Kept as its own schema rather than an ArtifactInput
        subset via allOf, so generated clients see a type that has no blocks field to
        accidentally populate.
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        inputPorts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactInputPort"
        outputPorts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactOutputPort"

    ArtifactInput:
      type: object
      required: [ id, title ]
      properties:
        id:
          type: string
          description: Unique within the organization.
          example: q3-project-plan
        title:
          type: string
        description:
          type: string
          nullable: true
        inputPorts:
          type: array
          description: Data this artifact expects to receive from its hosting context.
          items:
            $ref: "#/components/schemas/ArtifactInputPort"
        outputPorts:
          type: array
          description: Data this artifact can emit to its hosting context.
          items:
            $ref: "#/components/schemas/ArtifactOutputPort"
        blocks:
          type: array
          description: >-
            Ordered, flat list of blocks. Array order is the display order for
            STANDALONE blocks. REFERENCED widget blocks have no position of their own —
            they render wherever a widgetEmbed node (Tiptap) or a props.childIds entry
            (container widget composition) points at their id. Whenever present on
            updateArtifact it fully replaces the stored list — a client that only wants to
            touch title/description/ports should call updateArtifactProperties instead, whose
            schema has no blocks field at all, rather than relying on any
            omitted-vs-empty convention here (Jackson can't tell those apart on a plain
            List without JsonNullable-wrapping every nullable field in this contract,
            which is a bigger change than this problem is worth).
          items:
            $ref: "#/components/schemas/ArtifactBlockInput"

    Artifact:
      description: A persisted artifact.
      allOf:
        - $ref: "#/components/schemas/ArtifactInput"
        - type: object
          properties:
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            version:
              type: integer
              format: int64
              description: Optimistic locking version, incremented on every successful write.
            blocks:
              type: array
              items:
                $ref: "#/components/schemas/ArtifactBlock"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ArtifactSummary:
      type: object
      properties:
        id:
          type: string
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        title:
          type: string
        version:
          type: integer
          format: int64
        blockCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    # ── Blocks ────────────────────────────────────────────────

    BlockKind:
      type: string
      enum: [ TEXT, WIDGET ]

    WidgetPlacement:
      type: string
      enum: [ STANDALONE, REFERENCED ]
      default: STANDALONE
      description: >-
        WIDGET blocks only. Same enum and meaning as shared-api.yaml's canonical
        WidgetRef.placement, applied here to a block instead of a standalone WidgetRef —
        an ArtifactBlock's type/props/placement together are structurally that shape. STANDALONE renders as its own full-width entry at its position
        in the flat block list. REFERENCED means this widget does not render at its own
        list position — it renders only where something else points at its block id:
        either a container widget's props.childIds (composition, e.g. a tab group), or
        a custom Tiptap "widgetEmbed" node (attrs.blockId) inside a TEXT block's content
        (mid-paragraph embedding). A REFERENCED block with nothing pointing at it is a
        orphaned widget — flagged by validateArtifact as a WARNING, not an ERROR. TEXT
        blocks are always effectively STANDALONE; the field is omitted for them.

    ArtifactBlockInput:
      type: object
      required: [ kind ]
      description: >-
        Flat shape shared by both block kinds — fields relevant to the other kind are
        left null. Which fields are required for a given kind is validated server-side
        (see validateArtifact), not enforced structurally.
      properties:
        id:
          type: string
          nullable: true
          description: >-
            Absent on createArtifact — the server assigns one. Must be supplied on
            updateArtifact and on import, because widgetEmbed nodes inside a TEXT block's
            content and every container widget's props.childIds reference blocks by id, so
            a whole-artifact write that dropped the ids would orphan every one of those
            references. ArtifactReferentialIntegrityChecker currently only verifies that
            referenced ids resolve, not that each block carries one — supplying no id on
            update is an NPE there today rather than a clean 400.
        kind:
          $ref: "#/components/schemas/BlockKind"

        # ── TEXT fields ──
        editable:
          type: boolean
          nullable: true
          default: true
          description: >-
            TEXT only. True = Tiptap-editable in the frontend; false = static, rendered
            read-only (e.g. imported boilerplate, generated summary).
        content:
          $ref: "#/components/schemas/TiptapDocument"

        # ── WIDGET fields ──
        placement:
          $ref: "#/components/schemas/WidgetPlacement"
        type:
          type: string
          nullable: true
          description: >-
            WIDGET only. Registry key — the same key space as base-app's WidgetRef.type,
            resolved against the shared frontend widget registry.
          example: entity-grid
        props:
          type: object
          nullable: true
          description: >-
            WIDGET only. Static configuration passed to the component as-is. Container
            widget types (tab groups, split panels) express composition here, not
            structurally: e.g. props.childIds: [block-tab-1, block-tab-2] references
            other WIDGET blocks in this same artifact by id. Those referenced blocks
            should have placement REFERENCED so they aren't also rendered at their own
            position. Interpreting childIds is that widget type's own concern, the same
            way any other prop is — base-artifact only validates that the ids resolve.
          additionalProperties: true
        inputBindings:
          type: object
          nullable: true
          description: >-
            WIDGET only. Maps a widget prop name to one of this artifact's inputPort
            names. Keys are widget prop names, values are inputPort names. Resolving
            the bound value at runtime is entirely a frontend concern.
          additionalProperties:
            type: string
        outputBindings:
          type: object
          nullable: true
          description: >-
            WIDGET only. Maps a widget's emitted event name to one of this artifact's
            outputPort names. Keys are widget event names, values are outputPort names.
          additionalProperties:
            type: string

    ArtifactBlock:
      allOf:
        - $ref: "#/components/schemas/ArtifactBlockInput"
        - type: object
          required: [ id ]
          properties:
            id:
              type: string

    TiptapDocument:
      type: object
      description: >-
        Opaque ProseMirror/Tiptap JSON document. base-artifact-backend stores and
        returns this verbatim — it is never parsed or interpreted server-side, with one
        narrow exception: on write, the backend scans for widgetEmbed nodes to verify
        every referenced blockId exists in this artifact's blocks as a REFERENCED
        WIDGET block, purely for referential integrity (the same check also applied to
        every WIDGET block's props.childIds).
      # No `additionalProperties: true` — that is already the OpenAPI 3.0 default for an object
      # with no declared properties, and spelling it out makes openapi-generator treat this as a
      # free-form map and emit a `new HashMap<>()` initializer, which does not compile against the
      # JsonNode this schema is mapped to (see the artifact schemaMappings in api-contracts/pom.xml).

    ReorderBlocksRequest:
      type: object
      required: [ blockIds ]
      properties:
        blockIds:
          type: array
          items:
            type: string

    # ── Ports ─────────────────────────────────────────────────

    PortType:
      type: string
      enum: [ STRING, NUMBER, BOOLEAN, DATE, OBJECT, ARRAY, ENTITY_REF, ENTITY_COLLECTION ]
      description: >-
        Lightweight type tag for UI hinting and basic validation only.
        ENTITY_REF: a single base-entity instance (entityType + entityId).
        ENTITY_COLLECTION: a filtered set of base-entity instances (entityType + RSQL
        filter), e.g. for a table/grid widget bound to "all open claims." Neither
        variant requires base-artifact to know the entity's schema. entityType values
        resolve within the enclosing organization, same as base-app's WidgetRef props.

    AttributeVisibility:
      type: object
      description: >-
        Attribute projection applied to entity data carried through an ENTITY_REF or
        ENTITY_COLLECTION port. base-artifact stores this as a plain allow/deny list —
        it does not validate attribute names against base-entity's schema.
      properties:
        mode:
          type: string
          enum: [ ALL, INCLUDE, EXCLUDE ]
          default: ALL
        attributes:
          type: array
          items:
            type: string
          description: Used when mode is INCLUDE or EXCLUDE; ignored when mode is ALL.

    ArtifactInputPort:
      type: object
      required: [ name, type ]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/PortType"
        required:
          type: boolean
          default: false
        description:
          type: string
          nullable: true
        defaultValue:
          nullable: true
          description: Used when required is false and the hosting context supplies nothing.
        entityType:
          type: string
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only. The base-entity type this port carries.
        attributeVisibility:
          allOf:
            - $ref: "#/components/schemas/AttributeVisibility"
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only. Optional default projection.
        defaultRsqlFilter:
          type: string
          nullable: true
          description: >-
            ENTITY_COLLECTION only. Fallback filter used when the hosting context binds
            this port without supplying its own filter.

    ArtifactOutputPort:
      type: object
      required: [ name, type ]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/PortType"
        description:
          type: string
          nullable: true
        entityType:
          type: string
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only.
        attributeVisibility:
          allOf:
            - $ref: "#/components/schemas/AttributeVisibility"
          nullable: true
          description: ENTITY_REF / ENTITY_COLLECTION only. Projection applied to emitted data.

    # ── Validation ────────────────────────────────────────────

    ValidationProblem:
      type: object
      required: [ errorId, errorText ]
      properties:
        path:
          type: string
          description: JSON-pointer-like location of the offending node.
          example: /blocks/3/inputBindings/entityId
        errorId:
          type: string
          example: artifact.validation.dangling-widget-embed
        errorText:
          type: string
          example: "widgetEmbed references block 'widget-chart-1', which is not a REFERENCED WIDGET block in this artifact."
        severity:
          $ref: "#/components/schemas/Severity"

    Severity:
      type: string
      description: >-
        Canonical definition in base-rule-api.yaml — a local duplicate for the same
        reason as the other shared shapes below.
      enum: [ ERROR, WARNING, INFO ]
      default: ERROR

    ValidationResult:
      type: object
      required: [ valid, problems ]
      properties:
        valid:
          type: boolean
          description: True when problems contains no entry of severity ERROR.
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ValidationProblem"

    # ── Paging / shared ───────────────────────────────────────

    PageOf_ArtifactSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactSummary"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug; canonical definition in shared-api.yaml. Reserved platform
        segments must be rejected at provisioning even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string
