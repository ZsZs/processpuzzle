openapi: 3.0.3
info:
  title: ProcessPuzzle Design Assistant API (assistant)
  description: >-
    The design assistant: a designer describes a definition in plain text, and the assistant drafts it through
    the draft tools (see docs/ai/implementation-plan.md). The assistant writes DRAFTS only. Publishing is never
    reachable from here; a person reviews and publishes in the release panel.

    ## Turns

    A turn is one designer message, in a conversation. The answer streams back as server-sent events:

    - `session`: the conversation the turn belongs to. A turn without a `sessionId` opens a new one.
    - `delta`: one piece of the answer, as the model produces it. The pieces concatenate to `reply`.
    - `reply`: the whole answer for the turn, as text, once it is complete.
    - `done`: the turn finished; no more events follow.
    - `error`: the turn failed; no more events follow. The text is deliberately generic and carries no detail.

    A conversation keeps its most recent messages, which the model reads on each turn. A conversation expires after
    24 hours without a message, and is erased with its organization. A conversation belongs to the designer who
    opened it: another designer's conversation is not found (404).

    ## Access

    The caller must hold the `definition-designer` realm role, and the organization in the path must be the
    organization the caller's token was issued for. Otherwise the turn is refused with 403, before any model call.

  version: 0.1.0

servers:
  - url: /api/v1

tags:
  - name: Assistant
    description: Designer turns with the design assistant

paths:
  /organizations/{orgKey}/assistant/turns:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: createAssistantTurn
      summary: Run one designer turn and stream the assistant's answer
      tags: [ Assistant ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTurnRequest"
      responses:
        "200":
          description: >-
            The turn's events, as server-sent events (text/event-stream): `session`, any number of `delta`, `reply`, then
            `done`; or `error`.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: The message is empty or longer than 4000 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The conversation is not one this designer opened in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The organization has used up its design assistant limit for the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller may not design in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      description: The organization the turn is for; must be the organization the caller's token was issued for
      schema:
        type: string

  schemas:
    AssistantTurnRequest:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: The designer's message for this turn
        sessionId:
          type: string
          format: uuid
          description: The conversation to continue; omitted to open a new one

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
