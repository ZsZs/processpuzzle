openapi: 3.0.3
info:
  title: ProcessPuzzle Design Assistant API (assistant)
  description: >-
    The design assistant: a designer describes a definition in plain text, and the assistant drafts it through
    the draft tools (see docs/ai/implementation-plan.md). The assistant writes DRAFTS only. Publishing is never
    reachable from here; a person reviews and publishes in the release panel.

    ## Turns

    A turn is one designer message, in a conversation. The answer streams back as server-sent events:

    - `session`: the conversation the turn belongs to. A turn without a `sessionId` opens a new one.
    - `delta`: one piece of the answer, as the model produces it. The pieces concatenate to `reply`.
    - `reply`: the whole answer for the turn, as text, once it is complete.
    - `done`: the turn finished; no more events follow.
    - `error`: the turn failed; no more events follow. The text is deliberately generic and carries no detail.

    A conversation keeps its most recent messages, which the model reads on each turn. A conversation expires after
    24 hours without a message, and is erased with its organization. A conversation belongs to the designer who
    opened it: another designer's conversation is not found (404).

    ## Access

    The caller must hold the `definition-designer` realm role, and the organization in the path must be the
    organization the caller's token was issued for. Otherwise the turn is refused with 403, before any model call.

    ## Authoring assist

    A one-shot companion to the chat (see docs/ai/authoring-assist-plan.md): the user describes one field of a
    definition, such as a rule's expression, and the platform answers a candidate in the field's own language. Each
    feature contributes its tasks (`rule.expression`, ...); the assist only knows a task by its name. The assist
    writes NOTHING: the candidate goes back to the user, who accepts it into the form and saves it through the
    ordinary validators. The candidate is checked by the task's feature and sent back to the model for a repair up to
    the configured number of rounds; what is still wrong with it is returned as `issues`. A caller may use a task
    only when they may edit its target. The organization has to have an AI subscription.

  version: 0.1.0

servers:
  - url: /api/v1

tags:
  - name: Assistant
    description: Designer turns with the design assistant

paths:
  /organizations/{orgKey}/assistant/turns:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: createAssistantTurn
      summary: Run one designer turn and stream the assistant's answer
      tags: [ Assistant ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTurnRequest"
      responses:
        "200":
          description: >-
            The turn's events, as server-sent events (text/event-stream): `session`, any number of `delta`, `reply`, then
            `done`; or `error`.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: The message is empty or longer than 4000 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The conversation is not one this designer opened in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The organization has used up its design assistant limit for the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller may not design in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/ai/assist:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listAssistTasks
      summary: The authoring assist tasks the caller can use
      description: >-
        Empty when the organization has no AI subscription, so a client can hide its assist actions. Only tasks whose
        target the caller may edit are listed.
      tags: [ Assistant ]
      responses:
        "200":
          description: The available task names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistTasks"
        "403":
          description: The organization is not the one the caller's token was issued for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/ai/assist/{task}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - name: task
        in: path
        required: true
        description: The task's name, such as `rule.expression`
        schema:
          type: string
    post:
      operationId: runAssistTask
      summary: Turn a description into a candidate for one field
      description: >-
        Returns 200 also when the model could not produce a clean candidate within the repair rounds: the last
        candidate is then returned with its ERROR issues, for the user to fix by hand. `candidate` is empty only when
        no reply of the model was readable.
      tags: [ Assistant ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistRequest"
      responses:
        "200":
          description: The best candidate, with its explanation, assumptions and remaining issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistResponse"
        "400":
          description: >-
            The text is empty or longer than 4000 characters, the current value longer than 20000, or the parameters are
            more than 20, null, or longer than 500 characters; or the task rejects a parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The organization is not the caller's, or the caller may not edit the task's target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such task (errorId `ai.assist.unknown-task`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: The organization has no AI subscription (errorId `ai.assist.not-configured`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The organization has used up its assistant limit for the day (errorId `ai.assist.quota-exceeded`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model service did not answer (errorId `ai.assist.model-unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      description: The organization the turn is for; must be the organization the caller's token was issued for
      schema:
        type: string

  schemas:
    AssistantTurnRequest:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: The designer's message for this turn
        sessionId:
          type: string
          format: uuid
          description: The conversation to continue; omitted to open a new one

    AssistTasks:
      type: object
      required: [ tasks ]
      properties:
        tasks:
          type: array
          items:
            type: string

    AssistRequest:
      type: object
      required: [ text ]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The user's own description of what the artifact should do
        parameters:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
          description: The target's other form values the task asks for, by name; each task documents its keys
        current:
          type: string
          maxLength: 20000
          description: The field's present value, so the task can repair or extend it

    AssistIssue:
      type: object
      properties:
        severity:
          type: string
          enum: [ ERROR, WARNING ]
        path:
          type: string
          description: Where in the candidate, or empty when the whole candidate is at fault
        text:
          type: string

    AssistResponse:
      type: object
      properties:
        candidate:
          type: string
        explanation:
          type: string
          description: What the candidate does, in the user's terms
        assumptions:
          type: array
          items:
            type: string
          description: What the model had to assume where the description was silent
        issues:
          type: array
          items:
            $ref: "#/components/schemas/AssistIssue"
        rounds:
          type: integer
          description: How many model calls it took
        model:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
