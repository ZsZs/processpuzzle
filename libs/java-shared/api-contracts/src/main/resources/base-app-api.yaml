openapi: 3.0.3
info:
  title: ProcessPuzzle Base App API
  description: >-
    Organization provisioning plus CRUD, YAML import/export and runtime-resolution
    operations for AppDefinition — the metadata that the generic application shell
    (`@processpuzzle/base-app-frontend`) interprets at run-time to compose theme, layout,
    navigation and routes.

    base-app is an interpreter, not a code generator: an AppDefinition describes *which*
    registered widget renders *where* with *which* props. It never carries widget
    implementations. Widget `type` values are keys into the frontend widget registry, and
    widget `props` are validated by the widget itself, not by this contract.

    ## Multi-tenancy

    Every resource here is scoped by an organization key — the slug a client picks when
    requesting an application, which is simultaneously the public URL segment of that
    application (`https://processpuzzle.com/{orgKey}`). The key is carried as a path
    segment rather than a header so that it appears in logs, audit trails and cache keys,
    and so that a tenant-scoped URL can be shared verbatim.

    The same scoping applies to *all* ProcessPuzzle metadata: entity descriptors, rules,
    state and workflow definitions are per-organization too, and every metadata id is
    unique only within its organization. `OrganizationKey` and `OrgKeyParam` in
    shared-api.yaml are the canonical definitions the other contracts reuse.

    Tenant isolation is a server-side responsibility: `orgKey` must be verified against the
    authenticated principal's `organization` claim and answered with 403 on mismatch. The
    path segment alone is not an authorization decision.

    ## Provisioning and design flow

    `POST /organizations` creates the organization together with one starter AppDefinition
    in `DRAFT` status — the "almost empty application" the designer opens first. The
    designer edits theme and layout, then `POST .../publish` promotes the draft. The shell
    serves the published revision; the designer previews the draft through the same
    `/layout` endpoint with `draft=true`, so preview and production are rendered by the same
    interpreter rather than by two pipelines.

    ## Scope of this version

    Three region types (`header`, `sidenav`, `footer`) plus the routed content outlet,
    preset-based layout,
    prebuilt Material theme selection with `--pp-*` token overrides, and the two
    entity-driven widget types (`entity-grid`, `entity-form`). Responsive breakpoint rules
    are deferred; both `RegionType` and the widget `type` key space are open for extension
    without a schema migration.
  version: 0.2.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:
  /organizations/{orgKey}/app-definitions:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listAppDefinitions
      summary: List the organization's app definitions
      description: >-
        Returns complete definitions — theme, layout, every region and every route — exactly
        as `getAppDefinition` does, one per page entry. This is the authoring/design-time
        view: the Low-Code designer edits a definition straight out of the list rather than
        re-fetching it, so a lighter shape here would leave it editing a truncated object
        and writing that truncation back on the next full-replacement PUT.
      tags:
        - Base App
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Matching app definitions (paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_AppDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAppDefinition
      summary: Create a new app definition in this organization
      description: >-
        Provisioning already creates one starter definition; this is for organizations that
        host more than one application. `id` needs to be unique within the organization only.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/app-definitions/{appId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    get:
      operationId: getAppDefinition
      summary: Get the complete app definition by id
      description: >-
        Returns the whole definition graph — theme, layout, every region and every route —
        unfiltered by role. This is the authoring/design-time view used by the Low-Code
        designer. The run-time shell should use `/layout` plus lazy route loads instead.
      tags:
        - Base App
      responses:
        "200":
          description: The app definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAppDefinition
      summary: Replace an existing app definition
      description: >-
        Full replacement of the definition graph. The server validates referential
        integrity (see `validateAppDefinition`) before persisting and rejects the request
        with 400 when it fails; `version` is bumped on success and the definition returns
        to `DRAFT` until published again.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAppDefinition
      summary: Delete an app definition
      tags:
        - Base App
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/app-definitions/{appId}/publish:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    post:
      operationId: publishAppDefinition
      summary: Publish the current draft revision
      description: >-
        Promotes the current `version` to `publishedVersion` and sets status to `PUBLISHED`,
        making it what `/layout` and the route endpoints serve to end users. Rejected with
        400 when validation does not pass, so an invalid definition can never go live.
      tags:
        - Base App
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/app-definitions/{appId}/layout:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    get:
      operationId: getAppLayout
      summary: Get the run-time shell payload (theme, layout and regions, role-filtered)
      description: >-
        The bootstrap payload for AppShellComponent: theme, layout and the region list with
        `NavItem`s already filtered against the authenticated principal's roles, and
        without the `routes` array. Routes are fetched lazily per path, mirroring base-rule's
        `loadRulesFor()`; a mounted module's routes are fetched as a unit when something first
        navigates under its basePath. Filtering happens server-side so that a nav entry a user may
        not see is never sent to the browser; clients must still expect the corresponding route
        fetch to be authorized independently.
      tags:
        - Base App
      parameters:
        - $ref: "#/components/parameters/DraftParam"
      responses:
        "200":
          description: The role-filtered shell layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppLayout"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/app-definitions/{appId}/routes/{routePath}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
      - name: routePath
        in: path
        required: true
        description: >-
          `RouteDefinition.path`. Multi-segment paths are URL-encoded (`claims%2Fopen`) so the whole
          path stays one path variable — the alternative, a greedy wildcard segment, would make this
          operation ambiguous against the sibling paths above.
        schema:
          type: string
    get:
      operationId: getRouteDefinition
      summary: Get a single route definition
      description: >-
        Lazy per-route load. Returns 404 both when the route does not exist and when it exists but
        the caller's roles do not permit it.
      tags:
        - Base App
      parameters:
        - $ref: "#/components/parameters/DraftParam"
      responses:
        "200":
          description: The route definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/modules:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listModuleDefinitions
      summary: List the organization's modules
      description: >-
        Returns complete definitions including their route lists — the frontend's generic list feeds
        its edit form from the listed object, so a summary projection would blank the omitted fields
        on the next save.
      tags:
        - Base App
      responses:
        "200":
          description: The organization's modules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createModuleDefinition
      summary: Create a module
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/modules/{moduleKey}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - name: moduleKey
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    get:
      operationId: getModuleDefinition
      summary: Get one module, with its routes
      description: >-
        The lazy-load entry point: the shell fetches a module's routes only when something navigates
        under its mounted `basePath`.
      tags:
        - Base App
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateModuleDefinition
      summary: Update a module
      description: >-
        Full replacement. `key` is immutable — it is what an `AppDefinition.modules` entry
        references.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteModuleDefinition
      summary: Delete a module
      description: >-
        Does not cascade: an `AppDefinition` still mounting this key keeps the mount, which becomes a
        validation warning rather than breaking the app. Same loose coupling as a dangling
        `NavItem.routePath`.
      tags:
        - Base App
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/app-definitions/validate:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: validateAppDefinition
      summary: Validate an app definition without persisting it
      description: >-
        Checks referential integrity of a candidate definition: unique `id`s within their
        scope, unique `RouteDefinition.path`es, no `ModuleMount.basePath` colliding with another
        mount or with an app-level route, no cycles in `NavItem.children` (widgets no longer nest, so
        this check no longer applies to them), every `WidgetInstance.props.childIds` entry
        resolving to a sibling `WidgetInstance.id` with `placement: REFERENCED` (error) or a
        `REFERENCED` widget pointed at by nothing (warning), every `--pp-*` token override
        naming a token the theme actually defines, and every `entityName` referenced by a
        widget being present in *this organization's* entity registry. Widget `props` are
        otherwise not validated here — each widget owns its own props shape, including how
        it interprets `childIds`. Used by the designer for live feedback before publishing.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDefinitionInput"
      responses:
        "200":
          description: Validation outcome — 200 even when `valid` is false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgKey}/app-definitions/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importAppDefinitions
      summary: Bulk-import app definitions from a YAML file
      description: >-
        Imported definitions are scoped to `{orgKey}` regardless of any organization key
        present in the file, which makes an export from one organization directly importable
        into another.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: >-
            Import outcome. All-or-nothing: if any definition in the file fails validation,
            nothing is persisted and the full list of problems is returned in errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgKey}/app-definitions/{appId}/export:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    get:
      operationId: exportAppDefinition
      summary: Export an app definition as a YAML file
      tags:
        - Base App
      responses:
        "200":
          description: YAML file
          content:
            application/x-yaml:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Translations ──
  # The UI message bundles this feature owns, in the shape the frontend's asset files have. Two
  # templates rather than one with an optional segment: 4 vs 5 segments is what makes them
  # unambiguous, and it mirrors `assets/i18n/<lang>.json` and `assets/i18n/<scope>/<lang>.json`.
  #
  # `app` is the feature's own service root. Every feature serves its own translations from its
  # own store, so that a later split into services with separate databases moves this segment into the
  # host rather than rewriting the resource. In the monolith it is also what keeps seven identical
  # `/translations` paths from colliding into an ambiguous mapping at startup.
  /organizations/{orgKey}/app/translations/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base App Translations
      summary: Root translation bundle of this feature for one language
      operationId: getAppTranslations
      description: >-
        The bundle that has no transloco scope — the equivalent of `assets/i18n/<lang>.json`.
        Answers 200 with an empty object when nothing has been seeded, rather than 404: the
        frontend loader reaches here only after an asset miss, and an error status would make an
        unseeded locale indistinguishable from a broken backend.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{orgKey}/app/translations/{scope}/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationScopeParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base App Translations
      summary: One scoped translation bundle of this feature
      operationId: getAppScopedTranslations
      description: >-
        The equivalent of `assets/i18n/<scope>/<lang>.json`. Keys are relative to the scope, as in
        the asset files: transloco prefixes them with the scope alias itself.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this scope and locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    TranslationLocaleParam:
      name: locale
      in: path
      required: true
      description: BCP-47 language tag of the bundle to read.
      schema:
        $ref: '#/components/schemas/Locale'

    TranslationScopeParam:
      name: scope
      in: path
      required: true
      description: Transloco scope of the bundle to read.
      schema:
        $ref: '#/components/schemas/TranslationScope'

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: >-
        Tenant discriminator; also the public URL segment of the tenant's application. See
        shared-api.yaml OrgKeyParam for the full contract. Must be verified against the
        principal's `organization` claim — 403 on mismatch.
    AppIdParam:
      name: appId
      in: path
      required: true
      description: AppDefinition id — unique within the organization.
      schema:
        type: string
    DraftParam:
      name: draft
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: >-
        When true, serve the unpublished draft revision instead of the published one. The
        designer's preview uses it so that preview and production go through the same
        interpreter; requires the caller to hold a design permission on the organization.
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: >
        RSQL filter expression, applied *in addition to* the organization filter. Results are
        always restricted to the `{orgKey}` in the path, so the expression never needs an
        `orgKey` term — and cannot widen the scope with one, since the organization filter is
        ANDed first (even a top-level `OR` stays inside the organization).
        See shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The authenticated principal may not act on this organization — typically an
        `orgKey` that does not match the principal's `organization` claim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    MaterialTheme:
      type: string
      description: >-
        One of the prebuilt Angular Material theme stylesheets the platform ships (Material 3
        palettes). A closed enum on purpose — unlike widget `type`, a value here has to
        correspond to a stylesheet that actually exists in the deployed bundle.
      enum: [ azure-blue, rose-red, magenta-violet, cyan-orange ]
      default: azure-blue

    ColorScheme:
      type: string
      description: '`auto` follows the `prefers-color-scheme` media query.'
      enum: [ light, dark, auto ]
      default: light

    ThemeDefinition:
      type: object
      description: >-
        The tenant's look. `materialTheme` and `colorScheme` pick the Material baseline;
        `tokenOverrides` retints the ProcessPuzzle surfaces on top of it. Both apply by
        swapping a stylesheet and setting CSS custom properties at run-time, so a theme
        change never requires rebuilding the framework libraries.
      properties:
        materialTheme:
          $ref: "#/components/schemas/MaterialTheme"
        colorScheme:
          $ref: "#/components/schemas/ColorScheme"
        tokenOverrides:
          type: object
          description: >-
            Overrides for the `--pp-*` custom properties declared in
            `libs/js-shared/widgets/src/theme/pp-colors.css`, applied as a `:root` style
            block after that file. Keys are token names *with* the leading `--`; values are
            any valid CSS color. Overriding a base token (`--pp-color-*`) retints every
            surface derived from it, a surface or button token retargets one place.
            Validation rejects keys the theme does not define.
          additionalProperties:
            type: string
          example:
            --pp-color-light-green: "#a8e6cf"
            --pp-surface-sidenav: "#0d1b2a"
        logoUrl:
          type: string
          description: Tenant logo shown in the header region.
        faviconUrl:
          type: string

    LayoutPreset:
      type: string
      description: >-
        Coarse arrangement of the shell's regions. Deliberately a small closed set for the
        first designer iteration; finer control arrives as additional enum values rather
        than as a layout engine.
      enum: [ sidenav-left, sidenav-right, top-nav ]
      default: sidenav-left

    SidenavMode:
      type: string
      description: Angular Material `mat-sidenav` mode.
      enum: [ side, over, push ]
      default: side

    LayoutDefinition:
      type: object
      description: How the shell arranges its regions. Which regions exist is decided by `regions`, not here.
      properties:
        preset:
          $ref: "#/components/schemas/LayoutPreset"
        sidenavMode:
          $ref: "#/components/schemas/SidenavMode"
        sidenavCollapsible:
          type: boolean
          default: true
        sidenavOpenByDefault:
          type: boolean
          default: true
        contentMaxWidth:
          type: string
          description: CSS length capping the content region's width; unset means full width.
          example: 1280px

    RegionType:
      type: string
      description: >-
        The slot of the shell a region fills. A region is rendered only when it is declared
        in `regions`, so omitting `footer` is how an app has no footer. `sidenav` carries
        `navItems`, and `header` and `footer` carry static `widgets`.

        `content` is deliberately **not** a region: once routes own content, the content area *is*
        the router outlet. The old `content` member carried no field of its own — `widgets` was
        header/footer-only and `navItems` sidenav-only — so it was already vestigial. Sizing of the
        outlet lives in `LayoutDefinition.contentMaxWidth`.
      enum: [ header, sidenav, footer ]
      example: sidenav

    # Canonical definition in shared-api.yaml — local duplicate for the same reason as
    # OrganizationKey / ErrorResponse (openapi-generator's swagger-parser cannot resolve
    # cross-file $refs on Windows).
    WidgetInstance:
      type: object
      description: >-
        One placement of a widget in a route or region. **Repeat of the canonical
        `WidgetInstance` in `shared-api.yaml`** — mapped onto
        `com.processpuzzle.shared.model.WidgetInstance` by this spec's `schemaMappings`,
        so the property set here must stay identical to the canonical one; only the prose
        is base-app-specific. See that declaration for why the text is duplicated rather
        than `$ref`-ed.

        Not recursive — see `placement` for how container widgets (tab groups, split
        panels) compose without nesting.
      required: [ id, type ]
      properties:
        id:
          type: string
          description: Unique within its route or region; used as the render loop's trackBy key.
          example: widget-claims-grid
        type:
          type: string
          description: >-
            Widget registry key, and the key of the `WidgetDefinition` describing this
            type. Intentionally an open string rather than an enum — new widget types
            register into the frontend map without a contract change. Keys interpreted in
            this version: `entity-grid`, `entity-form`.
          example: entity-grid
        props:
          type: object
          description: >-
            Widget-specific configuration, passed to the resolved component as inputs.
            Loose in this contract by design: each widget type owns its own props shape,
            declared in its `WidgetDefinition.propsSchema` rather than here, so the shell
            and this contract stay agnostic of it.

            entity-grid: `entityName` (BaseEntityDescriptor.entityName, required), `columns`
            (attribute names, defaults to the descriptor's grid columns), `rsqlFilter` (RSQL
            applied to the backing search).

            entity-form: `entityName` (required), `ruleSetId` (resolved via
            `loadRulesFor()`), `submitLabel`, `submitTranslocoId`.

            Container widget types (e.g. `tab-group`, `split-panel`) express composition
            here too, via `childIds` — a list of sibling `WidgetInstance.id`s within the
            same `widgets` array to render inside the container. Interpreting `childIds` is
            that widget type's own concern, the same as any other prop; base-document and
            base-app only validate that the ids resolve and flag orphans.

            Ids referenced here resolve within the enclosing organization — an
            `entityName` always means *this tenant's* descriptor of that name.
          additionalProperties: true
          example:
            entityName: Claim
            columns: [ claimNumber, claimant, status, filedDate ]
            rsqlFilter: "status!=CLOSED"
        placement:
          type: string
          enum: [ STANDALONE, REFERENCED ]
          default: STANDALONE
          description: >-
            STANDALONE renders at this widget's own position in the enclosing `widgets`
            array. REFERENCED means it does not render at its own position — only where
            something else points at its id, i.e. a container widget's `props.childIds`.
            A REFERENCED widget with nothing pointing at it is an orphan, flagged by
            `validateAppDefinition` as a warning, not an error.
        inputBindings:
          type: object
          nullable: true
          description: >-
            Part of the canonical `WidgetInstance` shape and therefore present here, but
            unused by base-app in this version: a route or region declares no ports for a
            binding to resolve against. base-document, whose documents do declare
            `inputPorts`, is the consumer. `nullable` so it stays absent from base-app
            payloads rather than serializing as `{}`; a future route target that declares
            ports of its own would make it meaningful.
          additionalProperties:
            type: string
        outputBindings:
          type: object
          nullable: true
          description: >-
            The reverse of `inputBindings`, and unused by base-app for the same reason.
          additionalProperties:
            type: string

    RouteTarget:
      type: object
      description: >-
        What a route renders. A discriminated union on `kind`: exactly the fields of the named kind
        are meaningful, the rest are null.

        Modelled flat rather than as `oneOf` because openapi-generator turns a `oneOf` into an
        interface plus one class per variant, and the frontend's generic form cannot edit that — the
        same reason `DocumentBlock` keeps TEXT and WIDGET fields side by side. Which fields a kind
        requires is validated server-side by `validateAppDefinition`, not structurally.
      required: [ kind ]
      properties:
        kind:
          type: string
          enum: [ WIDGETS, DOCUMENT, ENTITY ]
          description: >-
            WIDGETS renders `widgets` in the content region. DOCUMENT renders the base-document
            named by `documentSlug`. ENTITY renders base-entity's generated list or details screen
            for `entityName`.

            Deliberately no MODULE kind: a module is mounted by the app through
            `AppDefinition.modules`, not reached through a route target. Making it a target would
            let a route point into a module which points at another module, which is the arbitrarily
            deep structure this design exists to avoid.
        widgets:
          type: array
          description: WIDGETS only. Rendered in the content region, in declaration order.
          items:
            $ref: "#/components/schemas/WidgetInstance"
        documentSlug:
          type: string
          nullable: true
          description: >-
            DOCUMENT only. `Document.slug` within this organization — the human-readable route key,
            not the UUID, so a route survives being re-pointed at a rewritten document.
          example: getting-started
        entityName:
          type: string
          nullable: true
          description: ENTITY only. `BaseEntityDescriptor.entityName` within this organization.
          example: Claim
        entityMode:
          type: string
          nullable: true
          enum: [ LIST, DETAILS ]
          description: ENTITY only. Which generated screen to render.
        rsqlFilter:
          type: string
          nullable: true
          description: ENTITY + LIST only. RSQL applied to the backing search.
          example: "status!=CLOSED"

    RouteDefinition:
      type: object
      description: >-
        One navigable route. **Flat: a route has no children.** `path` may be multi-segment, so
        `claims`, `claims/open` and `claims/:id` are three sibling entries rather than a tree.

        Angular's own nesting — a parent route hosting a `<router-outlet>`, which deep-linkable tabs
        need — is *derived* from these path prefixes when the frontend builds its `Routes`, because
        nesting is a rendering concern rather than something worth authoring. Structure is broken up
        at the module boundary instead: see `AppDefinition.modules`.
      required: [ path, title, target ]
      properties:
        path:
          type: string
          description: >-
            Route path relative to the app root, without a leading slash. May contain `/` for depth
            and `:name` for a parameter. Unique within the app (and within a module).
          pattern: '^[a-z0-9:][a-z0-9\-:/]*$'
          example: claims/:id
        title:
          type: string
          description: Default title, in the organization's default language.
          example: Claims
        translocoId:
          type: string
          nullable: true
          description: >-
            Transloco translation key for the title. The frontend prefers it over `title` when
            present; the backend treats it as an opaque identifier.
          example: claims.route.list.title
        icon:
          type: string
          nullable: true
          description: Material or FontAwesome icon name, used where the route is surfaced directly.
        roles:
          type: array
          nullable: true
          description: >-
            Roles allowed to reach this route. Omit or leave empty for "any authenticated member of
            the organization". Same convention as `NavItem.roles`.
          items:
            type: string
        target:
          $ref: "#/components/schemas/RouteTarget"

    ModuleDefinitionInput:
      type: object
      description: >-
        A lazily-loadable slice of an application: its own flat route list, its own transloco scope,
        its own resource namespace. The unit that keeps a large app from becoming one deep tree.

        **What "lazy" honestly means here.** A module lazy-loads *metadata* — this definition, its
        routes, its translation files, and the documents and descriptors they name. It does **not**
        lazy-load widget code: widget components are bundled at compile time and resolved through the
        frontend registry, so a metadata module cannot split a bundle on its own. The real wins are
        that `AppDefinition` stops being one aggregate that must be loaded, locked and published
        atomically, and that a module becomes the unit of authoring permission and versioning.
        Do not justify modules on a bundle-size claim they cannot cash.
      required: [ key, name ]
      properties:
        key:
          type: string
          description: Unique within the organization; referenced by `ModuleMount.moduleKey`. Immutable.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: claims
        name:
          type: string
          example: Claims management
        translocoId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        translocoScope:
          type: string
          nullable: true
          description: >-
            Transloco scope the module's translations load under; defaults to `key`. The frontend
            must register it with an **explicit alias** — both `-` and `_` in a scope name are
            camel-cased into a default alias that will not match the authored keys.
          example: claims
        routes:
          type: array
          description: >-
            The module's routes, flat, with paths relative to the `basePath` it is mounted at. A
            module does not mount modules: this is where composition stops.
          items:
            $ref: "#/components/schemas/RouteDefinition"

    ModuleDefinition:
      allOf:
        - $ref: "#/components/schemas/ModuleDefinitionInput"
        - type: object
          required: [ orgKey, version ]
          properties:
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            version:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ModuleMount:
      type: object
      description: >-
        Mounts a `ModuleDefinition`'s routes into this application under `basePath`. The one place
        route structure composes — and it composes exactly one level deep, because a module cannot
        mount modules.
      required: [ moduleKey, basePath ]
      properties:
        moduleKey:
          type: string
          description: >-
            `ModuleDefinition.key` within this organization. A key naming no existing module is a
            validation **warning**, not an error: modules are loosely coupled by design, so an app
            may reference one that has not been authored yet.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: claims
        basePath:
          type: string
          description: >-
            Path prefix every route of the module is registered under. Two modules mounted at the
            same basePath, or a basePath colliding with an app-level route, is an error.
          pattern: '^[a-z0-9][a-z0-9\-/]*$'
          example: claims

    NavItem:
      type: object
      description: >-
        One entry in the sidenav. An item with `children` and no `routePath` is a non-navigable
        group node.

        **Nav hierarchy and route structure are separate axes, deliberately.** This is where nesting
        belongs, because a collapsible sidenav group is presentation; `RouteDefinition` stays flat.
        Conflating the two is what would force routes into an arbitrarily deep tree.
      required: [ id, label ]
      properties:
        id:
          type: string
          example: nav-claims
        label:
          type: string
          description: Default label, in the organization's default language.
          example: Claims
        translocoId:
          type: string
          description: Transloco translation key for the label; preferred over `label` when present.
          example: claims.nav.list
        icon:
          type: string
          description: Material or FontAwesome icon name.
          example: description
        routePath:
          type: string
          nullable: true
          description: >-
            `RouteDefinition.path` this entry navigates to — including a module's routes, addressed
            as `basePath/path`. Omitted for group nodes, which only expand their `children`.

            Resolved by **string**, and a path matching no declared route is a validation
            **warning** rather than an error. That is what keeps modules loosely coupled: an app may
            link to a module's route before that module has been authored.
          example: claims/open
        roles:
          type: array
          description: >-
            Roles allowed to see this entry. Omit or leave empty for "any authenticated
            member of the organization". Filtering is applied server-side by `getAppLayout`.
          items:
            type: string
          example: [ CLAIMS_ADJUSTER ]
        children:
          type: array
          description: Nested nav entries, forming a nav group.
          items:
            $ref: "#/components/schemas/NavItem"

    RegionDefinition:
      type: object
      description: >-
        A shell region. Per-type configuration is modelled as optional sibling properties
        rather than a discriminated union, because the flat shape maps cleanly onto the
        generated Java records: `navItems` applies to `sidenav`, `widgets` to `header` and
        `footer`; the routed content outlet uses neither.
      required: [ type ]
      properties:
        type:
          $ref: "#/components/schemas/RegionType"
        navItems:
          type: array
          description: sidenav only — the navigation tree.
          items:
            $ref: "#/components/schemas/NavItem"
        widgets:
          type: array
          description: >-
            header / footer only — static region content such as a language selector or
            version button, in declaration order.
          items:
            $ref: "#/components/schemas/WidgetInstance"

    AppDefinitionStatus:
      type: string
      description: >-
        `DRAFT` until first published and again after every edit; `PUBLISHED` when
        `publishedVersion` equals `version`. Only a published revision is served to end
        users.
      enum: [ DRAFT, PUBLISHED ]

    AppDefinitionInput:
      type: object
      description: >-
        The root metadata object — one per application. Write side: `orgKey`, `version`,
        `status` and `publishedVersion` are server-assigned and therefore absent here. The
        organization comes from the path, so a payload can be moved between tenants
        unchanged.
      required: [ id, name ]
      properties:
        id:
          type: string
          description: Unique within the organization; two tenants may both have `claims-app`.
          example: claims-app
        name:
          type: string
          description: Default application name, in the organization's default language.
          example: Claims Management
        translocoId:
          type: string
          description: Transloco translation key for the application name.
          example: claims.app.name
        description:
          type: string
        theme:
          $ref: "#/components/schemas/ThemeDefinition"
        layout:
          $ref: "#/components/schemas/LayoutDefinition"
        regions:
          type: array
          description: >-
            Declared regions. Absent or empty on a freshly provisioned app — the starter
            definition is intentionally almost empty, and the designer fills it in.
          items:
            $ref: "#/components/schemas/RegionDefinition"
        routes:
          type: array
          description: >-
            The app's own routes, as a flat list. Routes contributed by mounted modules are not
            repeated here — they live in their `ModuleDefinition` and are composed in at runtime.
          items:
            $ref: "#/components/schemas/RouteDefinition"
        modules:
          type: array
          description: >-
            Modules this application mounts, and where. The unit of decomposition: a large app is a
            short route list plus a handful of module mounts, rather than one deep tree.
          items:
            $ref: "#/components/schemas/ModuleMount"

    AppDefinition:
      description: A persisted app definition.
      allOf:
        - $ref: "#/components/schemas/AppDefinitionInput"
        - type: object
          properties:
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            status:
              $ref: "#/components/schemas/AppDefinitionStatus"
            version:
              type: integer
              format: int64
              description: >-
                Monotonic revision counter, bumped by the server on every successful write.
                Doubles as the client-side cache validator and as the optimistic-locking
                token.
            publishedVersion:
              type: integer
              format: int64
              description: >-
                The `version` currently served to end users; absent until first published.
                Lower than `version` means unpublished edits exist.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AppLayout:
      type: object
      description: >-
        The run-time shell payload: theme, layout and the regions of an app definition with
        role filtering already applied, and without routes. `version` is the version of the
        AppDefinition it was derived from, so the shell can detect a published change.
      required: [ id, orgKey, name, regions ]
      properties:
        id:
          type: string
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        name:
          type: string
        translocoId:
          type: string
        defaultLocale:
          type: string
          description: >-
            Copied from the owning organization so the shell can set the Transloco active
            language from one bootstrap request.
        version:
          type: integer
          format: int64
        theme:
          $ref: "#/components/schemas/ThemeDefinition"
        layout:
          $ref: "#/components/schemas/LayoutDefinition"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionDefinition"

    ValidationProblem:
      type: object
      required: [ errorId, errorText ]
      properties:
        path:
          type: string
          description: JSON-pointer-like location of the offending node.
          example: /regions/0/navItems/1/routePath
        errorId:
          type: string
          description: Stable, machine-readable identifier / Transloco key.
          example: app.validation.unknown-route-reference
        errorText:
          type: string
          description: Human-readable message in the service's default language.
          example: No route with path 'claims/:id' is declared in this app definition.
        severity:
          $ref: "#/components/schemas/Severity"

    Severity:
      type: string
      description: >-
        How badly a problem should be taken. `ERROR` blocks persisting; `WARNING` and `INFO`
        are advice and never reject a write. Structural problems are always `ERROR`; the other
        two arise from the organization's own base-rule records, whose severity is carried
        through verbatim. Canonical definition in base-rule-api.yaml — a local duplicate for
        the same reason as the shared shapes below.
      enum: [ ERROR, WARNING, INFO ]
      default: ERROR

    ValidationResult:
      type: object
      required: [ valid, problems ]
      properties:
        valid:
          type: boolean
          description: >-
            True when `problems` contains no entry that would block persisting, i.e. none of
            severity `ERROR`. A valid definition may still carry `WARNING` and `INFO` problems.
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ValidationProblem"

    PageOf_AppDefinition:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AppDefinition"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug; canonical definition in shared-api.yaml. Reserved platform
        segments must be rejected at provisioning even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string

    Locale:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical Locale — see the note on WidgetInstance there for why
        this workspace repeats rather than $refs across files. A bare string schema generates no Java
        class, so the repetition needs no schemaMappings entry.
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      minLength: 2
      maxLength: 6
      example: en

    TranslationScope:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical TranslationScope. Transloco scope a bundle loads under,
        and the directory segment its asset equivalent would have had.
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
      minLength: 1
      maxLength: 64
      example: base_app

    TranslationBundle:
      type: object
      description: >-
        Repeat of shared-api.yaml's canonical TranslationBundle, mapped onto the shared generated type.
        One transloco bundle: the whole message map of an (organization, scope, locale) triple, in the
        exact shape the frontend's asset file has. Keys are relative to the scope — transloco prefixes
        them with the scope alias itself.
      additionalProperties: true
      nullable: true
      example:
        module:
          name: Order administration
        route:
          orders: All orders
