openapi: 3.0.3
info:
  title: ProcessPuzzle Base App API
  description: >-
    Organization provisioning plus CRUD, YAML import/export and runtime-resolution
    operations for AppDefinition — the metadata that the generic application shell
    (`@processpuzzle/base-app-frontend`) interprets at run-time to compose theme, layout,
    navigation and pages.

    base-app is an interpreter, not a code generator: an AppDefinition describes *which*
    registered widget renders *where* with *which* props. It never carries widget
    implementations. Widget `type` values are keys into the frontend widget registry, and
    widget `props` are validated by the widget itself, not by this contract.

    ## Multi-tenancy

    Every resource here is scoped by an organization key — the slug a client picks when
    requesting an application, which is simultaneously the public URL segment of that
    application (`https://processpuzzle.com/{orgKey}`). The key is carried as a path
    segment rather than a header so that it appears in logs, audit trails and cache keys,
    and so that a tenant-scoped URL can be shared verbatim.

    The same scoping applies to *all* ProcessPuzzle metadata: entity descriptors, rules,
    state and workflow definitions are per-organization too, and every metadata id is
    unique only within its organization. `OrganizationKey` and `OrgKeyParam` in
    shared-api.yaml are the canonical definitions the other contracts reuse.

    Tenant isolation is a server-side responsibility: `orgKey` must be verified against the
    authenticated principal's `organization` claim and answered with 403 on mismatch. The
    path segment alone is not an authorization decision.

    ## Provisioning and design flow

    `POST /organizations` creates the organization together with one starter AppDefinition
    in `DRAFT` status — the "almost empty application" the designer opens first. The
    designer edits theme and layout, then `POST .../publish` promotes the draft. The shell
    serves the published revision; the designer previews the draft through the same
    `/layout` endpoint with `draft=true`, so preview and production are rendered by the same
    interpreter rather than by two pipelines.

    ## Scope of this version

    Four region types (`header`, `sidenav`, `content`, `footer`), preset-based layout,
    prebuilt Material theme selection with `--pp-*` token overrides, and the two
    entity-driven widget types (`entity-grid`, `entity-form`). Responsive breakpoint rules
    are deferred; both `RegionType` and the widget `type` key space are open for extension
    without a schema migration.
  version: 0.2.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:
  /organizations:
    post:
      operationId: provisionOrganization
      summary: Request an application for a new organization
      description: >-
        The public sign-up entry point. Creates the organization and one starter
        AppDefinition in `DRAFT` status, and returns both so the caller can navigate
        straight into the designer. The `key` must be available (see
        `checkOrganizationKey`) and must not be a reserved path segment; 409 otherwise.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Organization provisioned, together with its starter app definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/key-availability:
    get:
      operationId: checkOrganizationKey
      summary: Check whether an organization key can be claimed
      description: >-
        Live feedback for the sign-up form. Reports the key as unavailable both when it is
        already taken and when it is a reserved platform path segment, so the caller does
        not have to know the reserved list.
      tags:
        - Base App
      parameters:
        - name: key
          in: query
          required: true
          description: >-
            Deliberately an unconstrained string rather than an `OrganizationKey`. This endpoint
            reports as the user types, so partial or malformed input ("m", "My Org") has to come
            back as `available: false` with an `errorId` the form can render — bean-validating the
            parameter would reject it with a bare 400 before the handler ran. The slug rules are
            enforced inside the operation and on every path parameter elsewhere.
          schema:
            type: string
      responses:
        "200":
          description: Availability of the requested key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"

  /organizations/{orgKey}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: getOrganization
      summary: Get an organization
      tags:
        - Base App
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateOrganization
      summary: Update an organization's descriptive fields
      description: >-
        `key` is immutable — it is the public URL of the tenant's application and the scope
        of all its metadata. Renaming would orphan every id; provision a new organization
        instead.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOrganization
      summary: Delete an organization and everything scoped by it
      description: >-
        Cascades across features: app definitions, entity descriptors, rules, state and
        workflow definitions belonging to this organization are removed with it. Irreversible.
      tags:
        - Base App
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/app-definitions:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listAppDefinitions
      summary: List the organization's app definitions
      description: >-
        Returns complete definitions — theme, layout, every region and every page — exactly
        as `getAppDefinition` does, one per page entry. This is the authoring/design-time
        view: the Low-Code designer edits a definition straight out of the list rather than
        re-fetching it, so a lighter shape here would leave it editing a truncated object
        and writing that truncation back on the next full-replacement PUT.
      tags:
        - Base App
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Matching app definitions (paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_AppDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAppDefinition
      summary: Create a new app definition in this organization
      description: >-
        Provisioning already creates one starter definition; this is for organizations that
        host more than one application. `id` needs to be unique within the organization only.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/app-definitions/{appId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    get:
      operationId: getAppDefinition
      summary: Get the complete app definition by id
      description: >-
        Returns the whole definition graph — theme, layout, every region and every page —
        unfiltered by role. This is the authoring/design-time view used by the Low-Code
        designer. The run-time shell should use `/layout` plus lazy page loads instead.
      tags:
        - Base App
      responses:
        "200":
          description: The app definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAppDefinition
      summary: Replace an existing app definition
      description: >-
        Full replacement of the definition graph. The server validates referential
        integrity (see `validateAppDefinition`) before persisting and rejects the request
        with 400 when it fails; `version` is bumped on success and the definition returns
        to `DRAFT` until published again.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAppDefinition
      summary: Delete an app definition
      tags:
        - Base App
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/app-definitions/{appId}/publish:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    post:
      operationId: publishAppDefinition
      summary: Publish the current draft revision
      description: >-
        Promotes the current `version` to `publishedVersion` and sets status to `PUBLISHED`,
        making it what `/layout` and the page endpoints serve to end users. Rejected with
        400 when validation does not pass, so an invalid definition can never go live.
      tags:
        - Base App
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/app-definitions/{appId}/layout:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    get:
      operationId: getAppLayout
      summary: Get the run-time shell payload (theme, layout and regions, role-filtered)
      description: >-
        The bootstrap payload for AppShellComponent: theme, layout and the region list with
        `NavItem`s already filtered against the authenticated principal's roles, and
        without the `pages` array. Pages are fetched lazily per route, mirroring base-rule's
        `loadRulesFor()`. Filtering happens server-side so that a nav entry a user may not
        see is never sent to the browser; clients must still expect the corresponding page
        fetch to be authorized independently.
      tags:
        - Base App
      parameters:
        - $ref: "#/components/parameters/DraftParam"
      responses:
        "200":
          description: The role-filtered shell layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppLayout"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/app-definitions/{appId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
      - name: pageId
        in: path
        required: true
        description: PageDefinition id — also the route path segment the shell registers.
        schema:
          type: string
    get:
      operationId: getPageDefinition
      summary: Get a single page definition
      description: >-
        Lazy per-route page load. Returns 404 both when the page does not exist and when it
        exists but no `NavItem` reachable by the caller's roles references it.
      tags:
        - Base App
      parameters:
        - $ref: "#/components/parameters/DraftParam"
      responses:
        "200":
          description: The page definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/app-definitions/validate:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: validateAppDefinition
      summary: Validate an app definition without persisting it
      description: >-
        Checks referential integrity of a candidate definition: unique `id`s within their
        scope, every `NavItem.pageId` resolving to a declared page, no page orphaned from
        the navigation tree, no cycles in `NavItem.children` (widgets no longer nest, so
        this check no longer applies to them), every `WidgetRef.props.childIds` entry
        resolving to a sibling `WidgetRef.id` with `placement: REFERENCED` (error) or a
        `REFERENCED` widget pointed at by nothing (warning), every `--pp-*` token override
        naming a token the theme actually defines, and every `entityName` referenced by a
        widget being present in *this organization's* entity registry. Widget `props` are
        otherwise not validated here — each widget owns its own props shape, including how
        it interprets `childIds`. Used by the designer for live feedback before publishing.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppDefinitionInput"
      responses:
        "200":
          description: Validation outcome — 200 even when `valid` is false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgKey}/app-definitions/import:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: importAppDefinitions
      summary: Bulk-import app definitions from a YAML file
      description: >-
        Imported definitions are scoped to `{orgKey}` regardless of any organization key
        present in the file, which makes an export from one organization directly importable
        into another.
      tags:
        - Base App
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: >-
            Import outcome. All-or-nothing: if any definition in the file fails validation,
            nothing is persisted and the full list of problems is returned in errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizations/{orgKey}/app-definitions/{appId}/export:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/AppIdParam"
    get:
      operationId: exportAppDefinition
      summary: Export an app definition as a YAML file
      tags:
        - Base App
      responses:
        "200":
          description: YAML file
          content:
            application/x-yaml:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: >-
        Tenant discriminator; also the public URL segment of the tenant's application. See
        shared-api.yaml OrgKeyParam for the full contract. Must be verified against the
        principal's `organization` claim — 403 on mismatch.
    AppIdParam:
      name: appId
      in: path
      required: true
      description: AppDefinition id — unique within the organization.
      schema:
        type: string
    DraftParam:
      name: draft
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: >-
        When true, serve the unpublished draft revision instead of the published one. The
        designer's preview uses it so that preview and production go through the same
        interpreter; requires the caller to hold a design permission on the organization.
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: >
        RSQL filter expression, applied *in addition to* the organization filter. Results are
        always restricted to the `{orgKey}` in the path, so the expression never needs an
        `orgKey` term — and cannot widen the scope with one, since the organization filter is
        ANDed first (even a top-level `OR` stays inside the organization).
        See shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The authenticated principal may not act on this organization — typically an
        `orgKey` that does not match the principal's `organization` claim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    OrganizationStatus:
      type: string
      description: >-
        `PROVISIONING` while the starter app definition and identity-provider realm are
        being created, `ACTIVE` once the tenant is usable, `SUSPENDED` when access is
        revoked but data retained.
      enum: [ PROVISIONING, ACTIVE, SUSPENDED ]

    OrganizationInput:
      type: object
      description: Sign-up payload — what a client supplies when requesting their own application.
      required: [ key, name ]
      properties:
        key:
          $ref: "#/components/schemas/OrganizationKey"
        name:
          type: string
          description: Display name of the organization.
          example: My Organization Ltd.
        description:
          type: string
        contactEmail:
          type: string
          format: email
        defaultLocale:
          type: string
          description: BCP-47 tag used as the Transloco active language for the tenant's app.
          example: en-GB

    OrganizationUpdate:
      type: object
      description: Mutable fields of an organization. `key` is deliberately absent — it is immutable.
      required: [ name ]
      properties:
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string
          format: email
        defaultLocale:
          type: string

    Organization:
      type: object
      required: [ key, name, status ]
      properties:
        key:
          $ref: "#/components/schemas/OrganizationKey"
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string
          format: email
        defaultLocale:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KeyAvailability:
      type: object
      required: [ key, available ]
      properties:
        key:
          $ref: "#/components/schemas/OrganizationKey"
        available:
          type: boolean
        errorId:
          type: string
          description: >-
            Present when `available` is false — why the key cannot be claimed, as a
            Transloco key the sign-up form can render.
          example: organization.key.reserved
        suggestions:
          type: array
          description: Available alternatives derived from the requested key.
          items:
            $ref: "#/components/schemas/OrganizationKey"

    ProvisioningResult:
      type: object
      description: >-
        Outcome of `provisionOrganization` — the new organization together with the starter
        app definition the designer should open.
      required: [ organization, appDefinition ]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        appDefinition:
          $ref: "#/components/schemas/AppDefinition"

    MaterialTheme:
      type: string
      description: >-
        One of the prebuilt Angular Material theme stylesheets the platform ships (Material 3
        palettes). A closed enum on purpose — unlike widget `type`, a value here has to
        correspond to a stylesheet that actually exists in the deployed bundle.
      enum: [ azure-blue, rose-red, magenta-violet, cyan-orange ]
      default: azure-blue

    ColorScheme:
      type: string
      description: '`auto` follows the `prefers-color-scheme` media query.'
      enum: [ light, dark, auto ]
      default: light

    ThemeDefinition:
      type: object
      description: >-
        The tenant's look. `materialTheme` and `colorScheme` pick the Material baseline;
        `tokenOverrides` retints the ProcessPuzzle surfaces on top of it. Both apply by
        swapping a stylesheet and setting CSS custom properties at run-time, so a theme
        change never requires rebuilding the framework libraries.
      properties:
        materialTheme:
          $ref: "#/components/schemas/MaterialTheme"
        colorScheme:
          $ref: "#/components/schemas/ColorScheme"
        tokenOverrides:
          type: object
          description: >-
            Overrides for the `--pp-*` custom properties declared in
            `libs/js-shared/widgets/src/theme/pp-colors.css`, applied as a `:root` style
            block after that file. Keys are token names *with* the leading `--`; values are
            any valid CSS color. Overriding a base token (`--pp-color-*`) retints every
            surface derived from it, a surface or button token retargets one place.
            Validation rejects keys the theme does not define.
          additionalProperties:
            type: string
          example:
            --pp-color-light-green: "#a8e6cf"
            --pp-surface-sidenav: "#0d1b2a"
        logoUrl:
          type: string
          description: Tenant logo shown in the header region.
        faviconUrl:
          type: string

    LayoutPreset:
      type: string
      description: >-
        Coarse arrangement of the shell's regions. Deliberately a small closed set for the
        first designer iteration; finer control arrives as additional enum values rather
        than as a layout engine.
      enum: [ sidenav-left, sidenav-right, top-nav ]
      default: sidenav-left

    SidenavMode:
      type: string
      description: Angular Material `mat-sidenav` mode.
      enum: [ side, over, push ]
      default: side

    LayoutDefinition:
      type: object
      description: How the shell arranges its regions. Which regions exist is decided by `regions`, not here.
      properties:
        preset:
          $ref: "#/components/schemas/LayoutPreset"
        sidenavMode:
          $ref: "#/components/schemas/SidenavMode"
        sidenavCollapsible:
          type: boolean
          default: true
        sidenavOpenByDefault:
          type: boolean
          default: true
        contentMaxWidth:
          type: string
          description: CSS length capping the content region's width; unset means full width.
          example: 1280px

    RegionType:
      type: string
      description: >-
        The slot of the shell a region fills. A region is rendered only when it is declared
        in `regions`, so omitting `footer` is how an app has no footer. `sidenav` carries
        `navItems`, `header` and `footer` carry static `widgets`, and `content` carries
        neither — it is populated per route from a PageDefinition.
      enum: [ header, sidenav, content, footer ]
      example: sidenav

    # Canonical definition in shared-api.yaml — local duplicate for the same reason as
    # OrganizationKey / ErrorResponse (openapi-generator's swagger-parser cannot resolve
    # cross-file $refs on Windows).
    WidgetRef:
      type: object
      description: >-
        A reference to a registered widget, resolved via the frontend widget registry at
        render time and instantiated with `NgComponentOutlet` / `ViewContainerRef`. No
        longer recursive — see `placement` for how container widgets (tab groups, split
        panels) compose without nesting.
      required: [ id, type ]
      properties:
        id:
          type: string
          description: Unique within its page or region; used as the render loop's trackBy key.
          example: widget-claims-grid
        type:
          type: string
          description: >-
            Widget registry key. Intentionally an open string rather than an enum — new
            widget types register into the frontend map without a contract change. Keys
            interpreted in this version: `entity-grid`, `entity-form`.
          example: entity-grid
        props:
          type: object
          description: >-
            Widget-specific configuration, passed to the resolved component as inputs.
            Loose by design: each widget type owns and validates its own props shape, so the
            shell and this contract stay agnostic of it.

            entity-grid: `entityName` (BaseEntityDescriptor.entityName, required), `columns`
            (attribute names, defaults to the descriptor's grid columns), `rsqlFilter` (RSQL
            applied to the backing search).

            entity-form: `entityName` (required), `ruleSetId` (resolved via
            `loadRulesFor()`), `submitLabel`, `submitTranslocoId`.

            Container widget types (e.g. `tab-group`, `split-panel`) express composition
            here too, via `childIds` — a list of sibling `WidgetRef.id`s within the same
            `widgets` array to render inside the container. Interpreting `childIds` is
            that widget type's own concern, the same as any other prop; base-artifact and
            base-app only validate that the ids resolve and flag orphans.

            Ids referenced here resolve within the enclosing organization — an
            `entityName` always means *this tenant's* descriptor of that name.
          additionalProperties: true
          example:
            entityName: Claim
            columns: [ claimNumber, claimant, status, filedDate ]
            rsqlFilter: "status!=CLOSED"
        placement:
          type: string
          enum: [ STANDALONE, REFERENCED ]
          default: STANDALONE
          description: >-
            STANDALONE renders at this widget's own position in the enclosing `widgets`
            array. REFERENCED means it does not render at its own position — only where
            something else points at its id, i.e. a container widget's `props.childIds`.
            A REFERENCED widget with nothing pointing at it is an orphan, flagged by
            `validateAppDefinition` as a warning, not an error.

    PageDefinition:
      type: object
      description: One navigable page. The content region resolves to exactly one of these per route.
      required: [ id, title, widgets ]
      properties:
        id:
          type: string
          description: Unique within the app; used verbatim as the route path segment.
          example: page-claims-list
        title:
          type: string
          description: Default page title, in the organization's default language.
          example: Claims
        translocoId:
          type: string
          description: >-
            Transloco translation key for the title. The frontend prefers it over `title`
            when present; the backend treats it as an opaque identifier.
          example: claims.page.list.title
        widgets:
          type: array
          description: Top-level widgets rendered in the content region, in declaration order.
          items:
            $ref: "#/components/schemas/WidgetRef"

    NavItem:
      type: object
      description: >-
        One entry in the sidenav, and the source for dynamic route registration
        (`Router.resetConfig()` at bootstrap). An item with `children` and no `pageId` is a
        non-navigable group node.
      required: [ id, label ]
      properties:
        id:
          type: string
          example: nav-claims
        label:
          type: string
          description: Default label, in the organization's default language.
          example: Claims
        translocoId:
          type: string
          description: Transloco translation key for the label; preferred over `label` when present.
          example: claims.nav.list
        icon:
          type: string
          description: Material or FontAwesome icon name.
          example: description
        pageId:
          type: string
          description: >-
            PageDefinition.id this entry navigates to. Omitted for group nodes, which only
            expand their `children`.
          example: page-claims-list
        roles:
          type: array
          description: >-
            Roles allowed to see this entry. Omit or leave empty for "any authenticated
            member of the organization". Filtering is applied server-side by `getAppLayout`.
          items:
            type: string
          example: [ CLAIMS_ADJUSTER ]
        children:
          type: array
          description: Nested nav entries, forming a nav group.
          items:
            $ref: "#/components/schemas/NavItem"

    RegionDefinition:
      type: object
      description: >-
        A shell region. Per-type configuration is modelled as optional sibling properties
        rather than a discriminated union, because the flat shape maps cleanly onto the
        generated Java records: `navItems` applies to `sidenav`, `widgets` to `header` and
        `footer`, and `content` uses neither.
      required: [ type ]
      properties:
        type:
          $ref: "#/components/schemas/RegionType"
        navItems:
          type: array
          description: sidenav only — the navigation tree.
          items:
            $ref: "#/components/schemas/NavItem"
        widgets:
          type: array
          description: >-
            header / footer only — static region content such as a language selector or
            version button, in declaration order.
          items:
            $ref: "#/components/schemas/WidgetRef"

    AppDefinitionStatus:
      type: string
      description: >-
        `DRAFT` until first published and again after every edit; `PUBLISHED` when
        `publishedVersion` equals `version`. Only a published revision is served to end
        users.
      enum: [ DRAFT, PUBLISHED ]

    AppDefinitionInput:
      type: object
      description: >-
        The root metadata object — one per application. Write side: `orgKey`, `version`,
        `status` and `publishedVersion` are server-assigned and therefore absent here. The
        organization comes from the path, so a payload can be moved between tenants
        unchanged.
      required: [ id, name ]
      properties:
        id:
          type: string
          description: Unique within the organization; two tenants may both have `claims-app`.
          example: claims-app
        name:
          type: string
          description: Default application name, in the organization's default language.
          example: Claims Management
        translocoId:
          type: string
          description: Transloco translation key for the application name.
          example: claims.app.name
        description:
          type: string
        theme:
          $ref: "#/components/schemas/ThemeDefinition"
        layout:
          $ref: "#/components/schemas/LayoutDefinition"
        regions:
          type: array
          description: >-
            Declared regions. Absent or empty on a freshly provisioned app — the starter
            definition is intentionally almost empty, and the designer fills it in.
          items:
            $ref: "#/components/schemas/RegionDefinition"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageDefinition"

    AppDefinition:
      description: A persisted app definition.
      allOf:
        - $ref: "#/components/schemas/AppDefinitionInput"
        - type: object
          properties:
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            status:
              $ref: "#/components/schemas/AppDefinitionStatus"
            version:
              type: integer
              format: int64
              description: >-
                Monotonic revision counter, bumped by the server on every successful write.
                Doubles as the client-side cache validator and as the optimistic-locking
                token.
            publishedVersion:
              type: integer
              format: int64
              description: >-
                The `version` currently served to end users; absent until first published.
                Lower than `version` means unpublished edits exist.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AppLayout:
      type: object
      description: >-
        The run-time shell payload: theme, layout and the regions of an app definition with
        role filtering already applied, and without pages. `version` is the version of the
        AppDefinition it was derived from, so the shell can detect a published change.
      required: [ id, orgKey, name, regions ]
      properties:
        id:
          type: string
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        name:
          type: string
        translocoId:
          type: string
        defaultLocale:
          type: string
          description: >-
            Copied from the owning organization so the shell can set the Transloco active
            language from one bootstrap request.
        version:
          type: integer
          format: int64
        theme:
          $ref: "#/components/schemas/ThemeDefinition"
        layout:
          $ref: "#/components/schemas/LayoutDefinition"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionDefinition"

    ValidationProblem:
      type: object
      required: [ errorId, errorText ]
      properties:
        path:
          type: string
          description: JSON-pointer-like location of the offending node.
          example: /regions/0/navItems/1/pageId
        errorId:
          type: string
          description: Stable, machine-readable identifier / Transloco key.
          example: app.validation.unknown-page-reference
        errorText:
          type: string
          description: Human-readable message in the service's default language.
          example: No page with id 'page-claim-form' is declared in this app definition.
        severity:
          $ref: "#/components/schemas/Severity"

    Severity:
      type: string
      description: >-
        How badly a problem should be taken. `ERROR` blocks persisting; `WARNING` and `INFO`
        are advice and never reject a write. Structural problems are always `ERROR`; the other
        two arise from the organization's own base-rule records, whose severity is carried
        through verbatim. Canonical definition in base-rule-api.yaml — a local duplicate for
        the same reason as the shared shapes below.
      enum: [ ERROR, WARNING, INFO ]
      default: ERROR

    ValidationResult:
      type: object
      required: [ valid, problems ]
      properties:
        valid:
          type: boolean
          description: >-
            True when `problems` contains no entry that would block persisting, i.e. none of
            severity `ERROR`. A valid definition may still carry `WARNING` and `INFO` problems.
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ValidationProblem"

    PageOf_AppDefinition:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AppDefinition"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug; canonical definition in shared-api.yaml. Reserved platform
        segments must be rejected at provisioning even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: string
