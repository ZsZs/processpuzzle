openapi: 3.0.3
info:
  title: ProcessPuzzle AI API (ai)
  description: >-
    Object recognition: tell which of a given list of objects is the one in front of the camera,
    from photos of those objects taken beforehand. That is the whole job. What the answer is used
    for — a race start, a stock count, a visitor log — is the calling application's business and
    has no representation here: this API knows no events, contexts or result records.
    See docs/ai/boat-recognition-design.md for the pipeline.

    ## Vocabulary

    A *subject* is any base-entity object, addressed as {entityName}/{objectId} exactly like
    base-state-api.yaml's operation layer. A *recognition profile* says how subjects of one
    entity type are recognized — which ARTIFACT attribute holds their reference photos, which
    object class the detector looks for, whether and how an identifier text (a sail number) is
    read, and the fusion and acceptance thresholds. A *recognition* is one shot — a few frames
    from a camera — identified against a *candidate list* of subjects the caller supplies. The
    candidate list is the only constraint: the caller decides who could be in front of the camera.

    ## Layers

    KNOWLEDGE LAYER (/recognition-profiles/{entityName}): one profile per entity type, 1:1,
    addressed by entityName the way base-state addresses a state machine.

    ENROLLMENT (/entities/{entityName}/{objectId}/enrollment): the gallery of one subject,
    derived from the photos in its profile's galleryAttributeKey — the crops and embeddings
    computed from them, and the identifier text read from them. The photos belong to the subject
    and are edited where the subject is edited; this API never stores or deletes them. A gallery
    follows its photos: it is synchronized whenever the subject changes, before a recognition
    uses it, and on request.

    RECOGNITION (/recognitions): frames in, ranked candidates out. Transient: a recognition is kept
    for a day, for the caller to read its outcome; the caller records whatever it needs.

    ## Media

    Frames never pass through this API. The client asks for an upload slot (createMediaUpload),
    PUTs the file straight to object storage with the returned presigned URL, then hands the
    returned mediaKey to startRecognition.

    ## Asynchronous processing

    Enrollment and recognition run on the vision server (vision-server-api.yaml), on CPU, and
    take seconds. Every call that starts processing answers 202 with the resource in a pending
    status; the client polls the resource. The vision server notifies base-ai-backend through
    receiveVisionJobNotification, which is not a client endpoint.

    ## Identifier text

    The registered identifier of a subject is an attribute of its entity, named by the
    profile's identifierAttributeKey — the boat's sail number is data of the boat, not of its
    gallery. The text the vision server reads from enrollment photos is kept beside it as
    observedIdentifierText, to flag a photo whose reading disagrees with the registration.

    ## Multi-tenancy

    Scoped by {orgKey} exactly as the other feature APIs; see shared-api.yaml OrgKeyParam.
    Galleries and recognitions are tenant data held in the stack's own database; the vision
    server is shared infrastructure and keeps none of it beyond a job's result retention.
  version: 0.1.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:

  # ── Knowledge layer: recognition profiles ──────────────────────

  /organizations/{orgKey}/recognition-profiles:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listRecognitionProfiles
      summary: List the organization's recognition profiles
      tags: [ AI Recognition ]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of recognition profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_RecognitionProfile"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createRecognitionProfile
      summary: Create the recognition profile of an entity type
      description: >-
        409 if entityName already has a profile. galleryAttributeKey must name an ARTIFACT
        attribute, and identifierAttributeKey, when given, a TEXT attribute declared on
        entityName's current EntityDefinition.
      tags: [ AI Recognition ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognitionProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: entityName does not resolve to an entity definition in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/recognition-profiles/{entityName}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
    get:
      operationId: getRecognitionProfile
      summary: Get the recognition profile of an entity type
      tags: [ AI Recognition ]
      responses:
        "200":
          description: The recognition profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateRecognitionProfile
      summary: Replace a recognition profile
      description: >-
        Takes effect for recognitions started afterwards. Changing detectorClass does not
        invalidate existing galleries, but photos are re-cropped only when re-enrolled; a changed
        galleryAttributeKey takes effect at each subject's next synchronization.
      tags: [ AI Recognition ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognitionProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteRecognitionProfile
      summary: Delete a recognition profile
      description: >-
        409 while any subject of entityName still has an enrollment; delete the enrollments
        first.
      tags: [ AI Recognition ]
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Media ──────────────────────────────────────────────────────

  /organizations/{orgKey}/media-uploads:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: createMediaUpload
      summary: Reserve an upload slot for a camera frame
      description: >-
        Answers a presigned PUT URL into the stack's object storage. The client PUTs the file
        there with the returned headers, then passes mediaKey to startRecognition. A slot whose
        mediaKey is not used before expiresAt is discarded with its object.
      tags: [ AI Recognition ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadRequest"
      responses:
        "201":
          description: Upload slot reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: sizeBytes exceeds the limit for the purpose
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Enrollment: the gallery of one subject ─────────────────────

  /organizations/{orgKey}/entities/{entityName}/{objectId}/enrollment:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
      - $ref: "#/components/parameters/ObjectIdParam"
    get:
      operationId: getEnrollment
      summary: Get a subject's enrollment
      description: >-
        As last synchronized; reading does not synchronize. A subject never enrolled answers 200
        with status NOT_ENROLLED and no photos, so a UI need not tell "no gallery" from "unknown
        subject" by status code.
      tags: [ AI Recognition ]
      responses:
        "200":
          description: The enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: entityName has no recognition profile, or the object does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: synchronizeEnrollment
      summary: Bring a subject's gallery in line with its photos
      description: >-
        Reads the photos in the profile's galleryAttributeKey of the subject. Photos new since the
        last synchronization are enrolled (PENDING until the vision server has cropped and
        embedded them); gallery entries whose photo is gone are dropped with their crops.
        Idempotent: with nothing changed, it answers the enrollment as it is. base-ai-backend
        synchronizes on its own whenever the subject changes and before a recognition; this call
        is for a client that wants it now.
      tags: [ AI Recognition ]
      responses:
        "202":
          description: Accepted; the returned enrollment shows any new photos as PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: entityName has no recognition profile, or the object does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteEnrollment
      summary: Discard a subject's gallery
      description: >-
        Removes the crops and embeddings derived from the subject's photos — never the photos
        themselves, which belong to the subject. The next synchronization enrolls the photos
        afresh, so this is how a gallery is rebuilt after a change of detector.
      tags: [ AI Recognition ]
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Recognition: frames against a candidate list ───────────────

  /organizations/{orgKey}/recognitions:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: startRecognition
      summary: Identify the subject in front of the camera among the given candidates
      description: >-
        Every mediaKey must come from a createMediaUpload of purpose RECOGNITION_FRAME whose upload
        has completed. The frames are a few shots of one subject; the largest object of the
        profile's detectorClass in each is taken to be it. The candidates' galleries are
        synchronized first. A candidate without an enrolled photo is matched by identifier text
        only; the recognition lists those in candidatesWithoutGallery.
      tags: [ AI Recognition ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognitionInput"
      responses:
        "202":
          description: Accepted; the recognition is QUEUED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recognition"
        "400":
          description: >-
            A mediaKey is unknown, expired, of another purpose, already used or not uploaded yet;
            or a candidate is not an object of entityName
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: entityName has no recognition profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/recognitions/{recognitionId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/RecognitionIdParam"
    get:
      operationId: getRecognition
      summary: Get a recognition's status and, once DONE, its outcome
      tags: [ AI Recognition ]
      responses:
        "200":
          description: The recognition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recognition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Vision server callback (not a client endpoint) ─────────────

  /organizations/{orgKey}/vision-notifications:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: receiveVisionJobNotification
      summary: Receive a job-finished notification from the vision server
      description: >-
        The callback vision-server-api.yaml declares. Authenticated by the per-job token
        base-ai-backend handed the vision server when it submitted the job — not by a user token —
        so this path is exempt from the user authentication chain and checks the
        `X-Callback-Token` header against the job it names instead. A header of its own rather
        than `Authorization: Bearer`, because the resource server would try to parse a bearer
        token as a JWT and refuse the call before it reached this endpoint. The
        notification carries no result: base-ai-backend fetches it from the vision server, which
        keeps a lost or forged notification from ever writing data. A job whose notification
        never arrives is found by the polling fallback.
      tags: [ AI Vision Callback ]
      security:
        - callbackToken: [ ]
      parameters:
        - name: X-Callback-Token
          in: header
          required: true
          description: >-
            Declared as a parameter as well as a security scheme, so that the generated interface
            hands the endpoint the token to check.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisionJobNotification"
      responses:
        "204":
          description: Accepted
        "401":
          description: The token does not belong to the named job
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Translations ──

  /organizations/{orgKey}/ai/translations/{locale}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/TranslationLocaleParam"
    get:
      operationId: getAiTranslations
      summary: The root UI message bundle of this feature for one locale
      tags: [ AI Translations ]
      responses:
        "200":
          description: The bundle; empty when the feature has no root keys for the locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationBundle"

  /organizations/{orgKey}/ai/translations/{scope}/{locale}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/TranslationScopeParam"
      - $ref: "#/components/parameters/TranslationLocaleParam"
    get:
      operationId: getAiScopedTranslations
      summary: A scoped UI message bundle of this feature for one locale
      tags: [ AI Translations ]
      responses:
        "200":
          description: The bundle; empty when the scope has no keys for the locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationBundle"

components:
  securitySchemes:
    callbackToken:
      type: apiKey
      in: header
      name: X-Callback-Token
      description: Per-job token base-ai-backend generated when it submitted the job to the vision server.

  parameters:
    TranslationLocaleParam:
      name: locale
      in: path
      required: true
      description: BCP-47 language tag of the bundle to read.
      schema:
        $ref: '#/components/schemas/Locale'

    TranslationScopeParam:
      name: scope
      in: path
      required: true
      description: Transloco scope of the bundle to read.
      schema:
        $ref: '#/components/schemas/TranslationScope'

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: >-
        Tenant discriminator; see shared-api.yaml OrgKeyParam for the full contract. Must be
        verified against the principal's `organization` claim — 403 on mismatch.
    EntityNameParam:
      name: entityName
      in: path
      required: true
      description: Unique within the organization; same value as base-entity-api.yaml's EntityDefinition.entityName.
      schema:
        type: string
    ObjectIdParam:
      name: objectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecognitionIdParam:
      name: recognitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal may not act on this organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ── Knowledge layer ────────────────────────────────────────

    RecognitionProfileInput:
      type: object
      required: [ entityName, name, detectorClass, galleryAttributeKey ]
      properties:
        entityName:
          type: string
          description: >-
            The entity type whose objects are the subjects. 1:1; the path segment is the source
            of truth on PUT, as in base-state's StateMachineDefinitionInput.
          example: Boat
        name:
          type: string
          example: Sailboat by sail number
        description:
          type: string
          nullable: true
        detectorClass:
          type: string
          description: >-
            The object class the detector looks for, from the vision server's class list
            (getVisionModels). COCO names for the stock RT-DETR model.
          example: boat
        galleryAttributeKey:
          type: string
          description: >-
            The ARTIFACT attribute of entityName holding the subject's reference photos — photos of
            the subject alone, from several sides. Its image artifacts are the gallery's source;
            other artifacts in it are ignored.
          example: photos
        identifierAttributeKey:
          type: string
          nullable: true
          description: >-
            The TEXT attribute of entityName holding the subject's registered identifier. Absent
            means no OCR: subjects are matched by appearance alone.
          example: sailNumber
        identifierPattern:
          type: string
          nullable: true
          description: >-
            Regular expression an OCR reading must match to count, applied after the vision
            server's normalization (upper-case, whitespace collapsed). Filters out text that is
            not an identifier — a sponsor logo, a class insignia.
          example: '^[A-Z]{3} ?[0-9]{1,5}$'
        matching:
          $ref: "#/components/schemas/MatchingSettings"

    MatchingSettings:
      type: object
      description: >-
        Fusion and acceptance settings. Defaults are the design document's starting point and
        are meant to be calibrated on labeled clips.
      properties:
        identifierWeight:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.6
          description: Weight of the identifier score; the embedding score gets 1 minus this. Ignored without OCR.
        acceptScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.75
          description: Minimum fused score for an automatic match.
        acceptMargin:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.1
          description: Minimum lead over the second-best candidate for an automatic match.
        sampleFps:
          type: number
          format: double
          minimum: 0.5
          maximum: 30
          default: 3
          description: >-
            Frames per second of video the detector looks at; the main CPU cost lever. Reserved for
            video recognition, which is not offered yet; frames are always all looked at.

    RecognitionProfile:
      allOf:
        - $ref: "#/components/schemas/RecognitionProfileInput"
        - type: object
          properties:
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            version:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PageOf_RecognitionProfile:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/RecognitionProfile"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # ── Media ──────────────────────────────────────────────────

    MediaPurpose:
      type: string
      description: >-
        RECOGNITION_FRAME: a camera frame for startRecognition. The only purpose today; a slot
        is accepted only by the call its purpose names.
      enum: [ RECOGNITION_FRAME ]

    MediaUploadRequest:
      type: object
      required: [ purpose, fileName, contentType, sizeBytes ]
      properties:
        purpose:
          $ref: "#/components/schemas/MediaPurpose"
        fileName:
          type: string
        contentType:
          type: string
          description: image/jpeg, image/png or image/webp.
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 1

    MediaUpload:
      type: object
      required: [ mediaKey, uploadUrl, expiresAt ]
      properties:
        mediaKey:
          type: string
          description: Opaque reference to pass to startRecognition.
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL into object storage.
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT must carry for the signature to hold, Content-Type at least.
        expiresAt:
          type: string
          format: date-time

    # ── Enrollment ─────────────────────────────────────────────

    EnrollmentStatus:
      type: string
      description: >-
        NOT_ENROLLED: no photos. PROCESSING: at least one photo PENDING. READY: at least one
        photo ENROLLED and none PENDING. FAILED: photos exist, none could be enrolled.
      enum: [ NOT_ENROLLED, PROCESSING, READY, FAILED ]

    EnrollmentPhotoStatus:
      type: string
      description: >-
        PENDING: awaiting the vision server. ENROLLED: subject found, cropped and embedded.
        NO_SUBJECT: no object of the profile's detectorClass found. AMBIGUOUS: several found and
        none dominant — photograph one subject per photo. FAILED: processing error.
      enum: [ PENDING, ENROLLED, NO_SUBJECT, AMBIGUOUS, FAILED ]

    EnrollmentPhoto:
      type: object
      required: [ photoId, photoRef, status, addedAt ]
      properties:
        photoId:
          type: string
          format: uuid
        photoRef:
          type: string
          description: >-
            Which photo of the subject this entry was derived from — the artifact's reference, as
            the subject's galleryAttributeKey holds it. Opaque here.
        status:
          $ref: "#/components/schemas/EnrollmentPhotoStatus"
        photoUrl:
          type: string
          format: uri
          description: Short-lived signed URL of the original photo.
        cropUrl:
          type: string
          format: uri
          nullable: true
          description: Short-lived signed URL of the subject crop; present once ENROLLED.
        observedIdentifierText:
          type: string
          nullable: true
          description: What OCR read on this photo, if anything matched identifierPattern.
        identifierMismatch:
          type: boolean
          description: >-
            True when observedIdentifierText is present and differs from the registered
            identifier — a wrong photo, or a stale registration.
        failureReason:
          type: string
          nullable: true
        addedAt:
          type: string
          format: date-time

    Enrollment:
      type: object
      required: [ entityName, objectId, status, photos ]
      properties:
        entityName:
          type: string
        objectId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EnrollmentStatus"
        identifierText:
          type: string
          nullable: true
          description: The registered identifier, read from the subject's identifierAttributeKey.
        embeddingModel:
          type: string
          nullable: true
          description: The vision server's embedding model the gallery was computed with.
        photos:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentPhoto"
        updatedAt:
          type: string
          format: date-time

    # ── Recognition ────────────────────────────────────────────

    RecognitionInput:
      type: object
      required: [ entityName, mediaKeys, candidateObjectIds ]
      properties:
        entityName:
          type: string
          description: The entity type of the candidates; must have a recognition profile.
          example: Boat
        mediaKeys:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: Upload slots of purpose RECOGNITION_FRAME, each holding one frame of the same subject.
          items:
            type: string
        candidateObjectIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: The objects of entityName that may be in front of the camera — the only constraint.
          items:
            type: string
            format: uuid

    RecognitionStatus:
      type: string
      description: QUEUED until the vision server has answered; DONE carries an outcome, FAILED a failureReason.
      enum: [ QUEUED, DONE, FAILED ]

    RecognitionOutcome:
      type: string
      description: >-
        MATCHED: objectId is the subject, its score reaching the profile's acceptScore and leading
        the second-best candidate by acceptMargin. NEEDS_REVIEW: a subject was seen, but no
        candidate is certain enough — the caller lets a person choose among candidates.
        NO_SUBJECT: no object of the profile's detectorClass in any frame.
      enum: [ MATCHED, NEEDS_REVIEW, NO_SUBJECT ]

    RecognitionCandidate:
      type: object
      required: [ objectId, score ]
      properties:
        objectId:
          type: string
          format: uuid
        score:
          type: number
          format: double
          description: Fused score, 0..1.
        identifierScore:
          type: number
          format: double
          nullable: true
        embeddingScore:
          type: number
          format: double
          nullable: true

    Recognition:
      type: object
      required: [ recognitionId, entityName, status, candidates, candidatesWithoutGallery, createdAt ]
      properties:
        recognitionId:
          type: string
          format: uuid
        entityName:
          type: string
        status:
          $ref: "#/components/schemas/RecognitionStatus"
        outcome:
          allOf:
            - $ref: "#/components/schemas/RecognitionOutcome"
          nullable: true
          description: Present once DONE.
        objectId:
          type: string
          format: uuid
          nullable: true
          description: The recognized subject; set when MATCHED.
        score:
          type: number
          format: double
          nullable: true
          description: Fused score of objectId.
        observedIdentifierText:
          type: string
          nullable: true
          description: The identifier text voted across the frames.
        observedIdentifierConfidence:
          type: number
          format: double
          nullable: true
        cropUrl:
          type: string
          format: uri
          nullable: true
          description: Short-lived signed URL of the best crop of the subject seen.
        candidates:
          type: array
          description: The top 3 candidates, best first; empty unless a subject was seen.
          items:
            $ref: "#/components/schemas/RecognitionCandidate"
        candidatesWithoutGallery:
          type: array
          description: Candidates matched by identifier text only, having no enrolled photo.
          items:
            type: string
            format: uuid
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    # ── Vision server callback ─────────────────────────────────
    # Repeated from vision-server-api.yaml, where it is canonical; the shape must not drift.

    VisionJobNotification:
      type: object
      required: [ jobId, kind, status ]
      properties:
        jobId:
          type: string
          format: uuid
          description: The id base-ai-backend gave the vision job when it submitted it.
        kind:
          type: string
          enum: [ ENROLLMENT, EMBEDDING, RECOGNITION ]
        status:
          type: string
          enum: [ DONE, FAILED, CANCELLED ]

    # Shared shapes — kept as local duplicates because the openapi-generator swagger-parser
    # cannot resolve cross-file $refs on Windows. schemaMappings in the pom.xml redirects the
    # generated classes to com.processpuzzle.shared.model.
    OrganizationKey:
      type: string
      description: URL-safe tenant slug; canonical definition in shared-api.yaml.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
          example: ai.media.not-uploaded
        errorText:
          type: string
          example: The upload for media key 'm-123' has not completed.

    Locale:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical Locale — see the note on WidgetInstance there for why
        this workspace repeats rather than $refs across files. A bare string schema generates no Java
        class, so the repetition needs no schemaMappings entry.
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      minLength: 2
      maxLength: 6
      example: en

    TranslationScope:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical TranslationScope. Transloco scope a bundle loads under,
        and the directory segment its asset equivalent would have had.
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
      minLength: 1
      maxLength: 64
      example: ai

    TranslationBundle:
      type: object
      description: >-
        Repeat of shared-api.yaml's canonical TranslationBundle, mapped onto the shared generated type.
        One transloco bundle: the whole message map of an (organization, scope, locale) triple, in the
        exact shape the frontend's asset file has. Keys are relative to the scope — transloco prefixes
        them with the scope alias itself.
      additionalProperties: true
      nullable: true
      example:
        module:
          name: Order administration
        route:
          orders: All orders
