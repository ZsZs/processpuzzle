openapi: 3.0.3
info:
  title: ProcessPuzzle Platform Admin API
  description: >-
    The administration surface ProcessPuzzle **staff** use to run the platform: the
    lifecycle of an organization, the identity realm behind it, its first administrator,
    and what it is billed.

    ## Why everything sits under `/platform`

    Every other contract in this repo is *tenant* API: a caller reaches it at
    `/organizations/{orgKey}/...` and is answered only for the tenant its token names.
    This contract is the opposite — one caller, all tenants. Mixing the two namespaces
    would make `/organizations` mean two different things depending on who asked, so the
    whole staff surface is prefixed `/platform` and gated on a single `platform-admin`
    authority. A tenant's token gets 403 here, whatever its `orgKey`.

    ## Ownership

    `platform-admin-backend` owns the `Organization` aggregate. base-app used to, and is now
    a consumer through the `platformadmin :: usecase` named interface. The five original
    tenant-facing organization operations (`provisionOrganization`, `checkOrganizationKey`,
    `getOrganization`, `updateOrganization`, `deleteOrganization`) therefore stay declared in
    base-app-api.yaml and stay served by `AppEndpoint` — ownership moved at the aggregate
    level, not at the URL level, and one `useTags`-generated interface cannot be split across
    two controllers anyway. What is declared *here* is only the new staff surface.

    ## Provisioning is not atomic, on purpose

    Creating a Keycloak realm is a network call and cannot join the database transaction.
    `POST /organizations` commits the row as `PROVISIONING` and returns; realm creation
    happens after commit and flips the row to `ACTIVE`. A client polling
    `GET /platform/organizations/{orgKey}` therefore *will* observe `PROVISIONING`, and a
    row left in that state means realm creation failed and can be retried — it is a durable,
    diagnosable state rather than a lost update.

    ## Billing has no payment provider

    `Plan`, `Subscription`, `UsageRecord` and `Invoice` are ProcessPuzzle's own records of
    what a tenant is entitled to and what it has used. Nothing in this contract charges
    anyone, and every billing operation is a read. Wiring a provider is a separate decision;
    this exists so the numbers are visible before that decision is made.
  version: 1.0.0
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ProcessPuzzle
    url: https://processpuzzle.com

servers:
  - url: /api
    description: Default API root

tags:
  - name: Platform Organizations
    description: Organization lifecycle across all tenants.
  - name: Platform Billing
    description: Read-only plan, subscription, usage and invoice queries.

paths:
  /platform/organizations:
    get:
      operationId: listOrganizations
      tags: [ Platform Organizations ]
      summary: List every organization on the platform
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: >-
            Paged list of organizations, each as the full `Organization` rather than a summary.
            base-entity's generated form reads the record out of the loaded list instead of
            re-fetching it by id, so a projection here would render an empty edit form and its
            save — a full replacement — would destroy whatever the projection had dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/organizations/{orgKey}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: getOrganizationAsPlatformAdmin
      tags: [ Platform Organizations ]
      summary: Read one organization
      description: >-
        Distinct operation from base-app's `getOrganization` even though the projection is
        identical: this one is reachable by staff for *any* tenant, where the tenant-facing
        one is reachable only by that tenant's own members.
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateOrganizationAsPlatformAdmin
      tags: [ Platform Organizations ]
      summary: Update an organization's descriptive fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOrganizationAsPlatformAdmin
      tags: [ Platform Organizations ]
      summary: Delete an organization and everything scoped by it
      description: >-
        Irreversible. Publishes `OrganizationDeletedEvent` inside the deleting transaction, so
        every feature that stores tenant-scoped data removes its own rows before the commit.
        The tenant's identity realm is deleted too — after commit, for the same reason
        provisioning creates it after commit.
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /platform/organizations/{orgKey}/suspend:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: suspendOrganization
      tags: [ Platform Organizations ]
      summary: Revoke a tenant's access, retaining its data
      description: >-
        Sets the status to `SUSPENDED` and disables the tenant's identity realm, so no member
        can obtain a token. Nothing is deleted; `activateOrganization` reverses both halves.
        Idempotent — suspending an already-suspended organization is a 200, not a conflict.
      responses:
        "200":
          description: The suspended organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /platform/organizations/{orgKey}/activate:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: activateOrganization
      tags: [ Platform Organizations ]
      summary: Restore a suspended tenant's access
      description: >-
        Sets the status to `ACTIVE` and re-enables the tenant's identity realm. Refuses a
        `PROVISIONING` organization with 409: its realm does not exist yet, so there is
        nothing to enable — provisioning has to complete or be retried first.
      responses:
        "200":
          description: The activated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /platform/organizations/{orgKey}/admin-user:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: assignOrganizationAdmin
      tags: [ Platform Organizations ]
      summary: Create the tenant's first administrator
      description: >-
        Creates the user in the tenant's own realm and grants it the realm role `org-admin`,
        which is what lets it reach the org-admin API and administer everybody else. Staff
        never learn the password: the user is created without credentials and with
        `UPDATE_PASSWORD` as a required action, so the invitee sets one on first login.

        Not restricted to the *first* administrator technically — the operation is the same
        for a replacement when a tenant has locked itself out, which is the case that made it
        a platform operation rather than an org-admin one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: The created administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"

  /platform/organizations/{orgKey}/billing:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: getOrganizationBilling
      tags: [ Platform Billing ]
      summary: Read one tenant's billing position
      description: >-
        The tenant's current subscription, the plan it names, its usage in the running period
        and its invoices — one round trip, because the screen shows them together.
      responses:
        "200":
          description: The tenant's billing position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationBilling"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /platform/plans:
    get:
      operationId: listPlans
      tags: [ Platform Billing ]
      summary: List the plans a subscription may name
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
      responses:
        "200":
          description: The plan catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [ Platform Billing ]
      summary: List subscriptions across all tenants
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /platform/invoices:
    get:
      operationId: listInvoices
      tags: [ Platform Billing ]
      summary: List invoices across all tenants
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of invoices, each with its lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: >-
        Tenant discriminator; also the public URL segment of the tenant's application. See
        shared-api.yaml OrgKeyParam for the full contract. Unlike every other contract, here it
        is *not* checked against the principal's own organization — a platform administrator
        acts on all tenants. The `platform-admin` authority is what gates these paths instead.
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: RSQL filter expression. See shared-api.yaml WhereParam for the operator reference.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Sort criteria. Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Zero-based page index for paged list endpoints.
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Number of elements per page for paged list endpoints.

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The authenticated principal does not hold the `platform-admin` authority. Every path in
        this contract answers this rather than 404 for a tenant token, so a tenant cannot probe
        which organizations exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdentityProviderUnavailable:
      description: >-
        The identity provider could not be reached or refused the operation. Distinct from 500
        because it is retryable and not the platform's own fault; the organization row is left
        untouched.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ---- organizations ------------------------------------------------------------------
    OrganizationStatus:
      type: string
      description: >-
        `PROVISIONING` while the identity-provider realm is being created — durable and
        observable, see the provisioning note in this contract's description. `ACTIVE` once the
        tenant is usable, `SUSPENDED` when access is revoked but data retained.
      enum: [ PROVISIONING, ACTIVE, SUSPENDED ]

    OrganizationUpdate:
      type: object
      description: Mutable fields of an organization. `key` is deliberately absent — it is immutable.
      required: [ name ]
      properties:
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string
          format: email
        defaultLocale:
          type: string

    Organization:
      type: object
      required: [ key, name, status ]
      properties:
        key:
          $ref: "#/components/schemas/OrganizationKey"
        name:
          type: string
        description:
          type: string
        contactEmail:
          type: string
          format: email
        defaultLocale:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageOf_Organization:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # ---- the tenant's first administrator -----------------------------------------------
    AdminUserInput:
      type: object
      description: >-
        Who to make an administrator of this tenant. No password field on purpose — see
        `assignOrganizationAdmin`.
      required: [ username, email ]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string

    AdminUser:
      type: object
      required: [ id, username, realm ]
      properties:
        id:
          type: string
          description: The identity provider's own id for the user, not a ProcessPuzzle id.
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        realm:
          type: string
          description: Realm the user was created in — always the tenant's `orgKey`.
        roles:
          type: array
          items:
            type: string
          description: Realm roles granted. Contains `org-admin` for a user created by this operation.

    # ---- billing ------------------------------------------------------------------------
    BillingInterval:
      type: string
      description: How often a subscription on this plan is invoiced.
      enum: [ MONTHLY, YEARLY ]

    SubscriptionStatus:
      type: string
      description: >-
        `TRIALING` before the first invoice, `ACTIVE` while paid, `PAST_DUE` when an invoice is
        overdue but service continues, `CANCELED` once terminated.
      enum: [ TRIALING, ACTIVE, PAST_DUE, CANCELED ]

    InvoiceStatus:
      type: string
      enum: [ DRAFT, ISSUED, PAID, VOID ]

    UsageMetric:
      type: string
      description: >-
        What a `UsageRecord` counts. A closed enum rather than a free string: a plan's limits are
        keyed by these values, so an unrecognized metric could not be checked against anything.
      enum: [ USERS, ENTITY_OBJECTS, DOCUMENTS, WORKFLOW_INSTANCES, STORAGE_BYTES, API_CALLS ]

    Plan:
      type: object
      description: A purchasable entitlement level. Seeded from the library's own default plans.
      required: [ code, name, interval, currency ]
      properties:
        code:
          type: string
          description: Stable identifier, e.g. `free`, `team`, `enterprise`.
          example: team
        name:
          type: string
        description:
          type: string
        interval:
          $ref: "#/components/schemas/BillingInterval"
        currency:
          type: string
          description: ISO-4217 code.
          example: EUR
        amountMinor:
          type: integer
          format: int64
          description: >-
            Price per interval in the currency's minor unit (cents). An integer, never a
            float — money in a binary fraction accumulates error the moment it is summed.
        limits:
          type: array
          description: >-
            Per-metric ceilings. Absent metric means unmetered on this plan; a limit of 0 means
            the feature is unavailable.
          items:
            $ref: "#/components/schemas/PlanLimit"

    PlanLimit:
      type: object
      required: [ metric, maxQuantity ]
      properties:
        metric:
          $ref: "#/components/schemas/UsageMetric"
        maxQuantity:
          type: integer
          format: int64

    Subscription:
      type: object
      required: [ id, orgKey, planCode, status, currentPeriodStart, currentPeriodEnd ]
      properties:
        id:
          type: string
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        planCode:
          type: string
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        canceledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageOf_Subscription:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    UsageRecord:
      type: object
      description: One metric's measured quantity for one tenant over one period.
      required: [ id, orgKey, metric, quantity, periodStart, periodEnd ]
      properties:
        id:
          type: string
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        metric:
          $ref: "#/components/schemas/UsageMetric"
        quantity:
          type: integer
          format: int64
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time

    InvoiceLine:
      type: object
      required: [ description, quantity, unitAmountMinor, amountMinor ]
      properties:
        description:
          type: string
        metric:
          $ref: "#/components/schemas/UsageMetric"
        quantity:
          type: integer
          format: int64
        unitAmountMinor:
          type: integer
          format: int64
        amountMinor:
          type: integer
          format: int64

    Invoice:
      type: object
      required: [ id, orgKey, status, currency, totalMinor, periodStart, periodEnd ]
      properties:
        id:
          type: string
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        number:
          type: string
          description: Human-facing invoice number; absent while the invoice is a DRAFT.
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        currency:
          type: string
        totalMinor:
          type: integer
          format: int64
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"

    PageOf_Invoice:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    OrganizationBilling:
      type: object
      description: Everything the billing screen shows for one tenant, in one response.
      required: [ orgKey ]
      properties:
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        subscription:
          $ref: "#/components/schemas/Subscription"
        plan:
          $ref: "#/components/schemas/Plan"
        usage:
          type: array
          items:
            $ref: "#/components/schemas/UsageRecord"
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"

    # Shared shapes — kept as local duplicates because the openapi-generator
    # swagger-parser cannot resolve cross-file $refs on Windows. schemaMappings
    # in the pom.xml redirects the generated classes to com.processpuzzle.shared.model.
    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug; canonical definition in shared-api.yaml. Reserved platform
        segments must be rejected at provisioning even when they match the pattern.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string
