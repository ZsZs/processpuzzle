openapi: 3.0.3
info:
  title: Base Entity API
  description: >
    Runtime metadata-driven entity platform for ProcessPuzzle.

    Two layers:
      1. Knowledge layer — BaseEntityDefinition + BaseEntityAttribute. Defines what an
         entity type looks like. Authored and edited at runtime; replaces the previous
         static TypeScript entity definitions.
      2. Operation layer — EntityObject. Stores actual instances. The full attribute
         payload (including embedded components) is persisted as-is, as JSON
         (PostgreSQL JSONB), rather than normalized into per-attribute-value rows.
         Validation is enforced by base-rule (@Validate / ConstraintRule) against the
         JSON payload before persistence, so normalization buys no extra safety —
         only extra joins. The one cost this defers to the RsqlToEavSpecificationBuilder
         is comparison-operator type coercion, since JSONB has no native typed columns
         (see "RSQL Filtering" section below).

    ## Multi-tenancy

    Every resource is scoped by `{orgKey}`, exactly as in base-app-api.yaml:
    an entity definition code or entity object is unique only *within* its organization.
    The key is carried as a path segment so that it appears in logs, audit trails and cache keys.

    Tenant isolation is a server-side responsibility: `orgKey` must be verified against the
    authenticated principal's `organization` claim and answered with 403 on mismatch. The
    path segment alone is not an authorization decision.
  version: 0.1.0

servers:
  - url: /api/base-entity

tags:
  - name: Base Entity Definitions
    description: Knowledge layer — entity type metadata
  - name: Base Entities
    description: Operation layer — entity instances
  - name: Base Entity Units
    description: Units an organization adds to the standard catalog of quantity units

# ---------------------------------------------------------------------------
# RSQL Filtering
# ---------------------------------------------------------------------------
# GET /organizations/{orgKey}/entities/{entityDefinitionCode} accepts an `rsql` query param, e.g.:
#   rsql=status==ACTIVE;age=gt=30
#   rsql=address.city==Munich                      (embedded component path)
#   rsql=owner.code==acme-corp                      (non-embedded component, own EntityObject)
#
# RsqlToEavSpecificationBuilder resolves each attribute path against
# BaseEntityAttribute.valueKind (walking into componentDefinitionCode for nested
# paths) BEFORE building the predicate, so it knows whether to cast
# payload->>'path' to numeric/date/boolean or leave it text. Only attributes with
# BaseEntityAttribute.indexed=true are guaranteed an expression index; unindexed
# attributes still work, just without one.
# ---------------------------------------------------------------------------

paths:
  # ==========================================================================
  # Knowledge layer
  # ==========================================================================
  /organizations/{orgKey}/entity-definitions:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
    get:
      operationId: listEntityDefinitions
      tags: [ Base Entity Definitions ]
      summary: List entity definitions
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EntityDefinitionStatus'
        - name: isEmbedded
          in: query
          schema:
            type: boolean
          description: Filter to embedded-only or standalone/non-embedded-only definitions.
        - $ref: '#/components/parameters/RevisionParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinitionPage'
    post:
      operationId: createEntityDefinition
      tags: [ Base Entity Definitions ]
      summary: Create a new entity definition (with its attributes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityDefinitionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinition'
          headers:
            Location:
              schema:
                type: string
        '409':
          description: code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{orgKey}/entity-definitions/{code}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/EntityDefinitionCode'
    get:
      operationId: getEntityDefinition
      tags: [ Base Entity Definitions ]
      summary: Get an entity definition by code
      parameters:
        - $ref: '#/components/parameters/RevisionParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceEntityDefinition
      tags: [ Base Entity Definitions ]
      summary: Replace an entity definition (attributes included, full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityDefinitionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict (optimistic locking) or code is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteEntityDefinition
      tags: [ Base Entity Definitions ]
      summary: Delete an entity definition
      description: >
        Rejected (409) if EntityObject rows still reference this definition, or if
        another definition still lists this one in componentParents.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: definition is still in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /organizations/{orgKey}/entity-definitions/{code}/attributes:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/EntityDefinitionCode'
    post:
      operationId: addAttribute
      tags: [ Base Entity Definitions ]
      summary: Add a single attribute to an existing definition
      description: Convenience endpoint for incremental authoring; PUT the whole definition for bulk changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityAttributeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityAttribute'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: attribute code already exists on this definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /organizations/{orgKey}/entity-definitions/{code}/attributes/{attributeCode}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/EntityDefinitionCode'
      - name: attributeCode
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceAttribute
      tags: [ Base Entity Definitions ]
      summary: Replace a single attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityAttributeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityAttribute'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAttribute
      tags: [ Base Entity Definitions ]
      summary: Remove an attribute
      description: Rejected (409) if existing EntityObject payloads for this definition still populate this attribute.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: attribute still populated on existing objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==========================================================================
  # Operation layer
  # ==========================================================================
  /organizations/{orgKey}/entities/{entityDefinitionCode}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listEntities
      tags: [ Base Entities ]
      summary: List / filter entity instances
      parameters:
        - name: rsql
          in: query
          schema:
            type: string
          description: RSQL filter over payload attributes, including embedded-component paths (a.b.c).
        - name: sort
          in: query
          schema:
            type: string
          example: 'createdAt,desc'
        - name: includeRetired
          in: query
          schema:
            type: boolean
            default: false
          description: >
            Lists the retired objects of a shared type too. Honoured for the common's own members only; a member
            organization never sees retired objects listed.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObjectPage'
        '400':
          description: malformed RSQL, or filter references an unresolvable attribute path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: createEntity
      tags: [ Base Entities ]
      summary: Create an entity instance
      description: >
        `entityDefinitionCode` in the path must reference a definition with isEmbedded=false
        (embedded component definitions exist for validation/UI metadata only and
        never get their own EntityObject rows — they travel inside a parent's payload).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityObjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
          headers:
            Location:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{orgKey}/entities/{entityDefinitionCode}/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEntity
      tags: [ Base Entities ]
      summary: Get an entity instance by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateEntity
      tags: [ Base Entities ]
      summary: Replace an entity instance's payload
      description: Full-payload replace. `version` must match the current stored version (optimistic locking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityObjectUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteEntity
      tags: [ Base Entities ]
      summary: Delete an entity instance
      description: >
        Deleting an object that other objects reference via a FOREIGN_KEY attribute
        value is rejected (409) unless `cascade=true` is passed. An object of a shared type is
        not deleted but retired (`retiredAt` is set): it still resolves by id, lists leave it out,
        and `reinstate` takes it back.
      parameters:
        - name: cascade
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: referenced by other entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /organizations/{orgKey}/entities/{entityDefinitionCode}/{id}/reinstate:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reinstateEntity
      tags: [ Base Entities ]
      summary: Reinstate a retired object of a shared type
      description: Lists the object again. An object that is not retired is returned unchanged.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
        '403':
          description: the type is shared and the caller is not a member of its common
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Embedded collections ──
  # One level of an aggregate: the embedded components an entity instance carries in an
  # EMBEDDED_COMPONENTS attribute, addressed on their own so that "add a zone" never sends the
  # whole Warehouse. An item is identified by its `id` member, which the server assigns on append.
  #
  # Concurrency. Each item carries an `itemVersion` the server counts, starting at 1 and bumped by every PATCH of that
  # item; the item endpoints answer it as the `ETag` of the item, and PATCH and DELETE take it back as `If-Match`
  # (optional — without it the change applies to the stored item). A stale `If-Match` is a 409 for that item only, so two
  # people editing different zones of one warehouse do not conflict. The object's `version` is the GET list's `ETag`, and the
  # object-level check still applies underneath every change: a change that loses that race is read and applied again.
  # Items stored before this had no `itemVersion`; the first write of their object gives them one (and an `id`).
  /organizations/{orgKey}/entities/{entityDefinitionCode}/{id}/{attributeCode}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attributeCode
        in: path
        required: true
        description: An EMBEDDED_COMPONENTS attribute of the entity.
        schema:
          type: string
    get:
      operationId: listEmbeddedItems
      tags: [ Base Entities ]
      summary: List the items of an embedded collection
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmbeddedItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: appendEmbeddedItem
      tags: [ Base Entities ]
      summary: Append an item to an embedded collection
      description: The server assigns `id` when the item brings none. The whole object is validated as it would be after the append.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedItem'
      responses:
        '201':
          description: Appended; the body is the item as stored.
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{orgKey}/entities/{entityDefinitionCode}/{id}/{attributeCode}/{itemId}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attributeCode
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        description: The item's `id` member.
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: The item's version the caller last saw, as the ETag of the item. A different stored item version is a 409.
        schema:
          type: string
    patch:
      operationId: patchEmbeddedItem
      tags: [ Base Entities ]
      summary: Partially update one item of an embedded collection
      description: >
        Merge patch of the item: members present in the body replace the stored ones, a `null` member is
        removed, the rest stay. `id` cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedItem'
      responses:
        '200':
          description: OK; the body is the item as stored.
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteEmbeddedItem
      tags: [ Base Entities ]
      summary: Remove one item from an embedded collection
      responses:
        '204':
          description: Removed
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── Nested embedded collections ──
  # The collection held by an attribute of an item of another collection — the shelves of one zone, say. The same
  # operations as above, one level down; the item of the outer collection is named by its `id`. The versioning is the
  # same: each item has its own `itemVersion`, and an item of the nested collection is changed against that.
  /organizations/{orgKey}/entities/{entityDefinitionCode}/{id}/{attributeCode}/{itemId}/{childAttributeCode}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attributeCode
        in: path
        required: true
        description: An EMBEDDED_COMPONENTS attribute of the entity.
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        description: The `id` of the item of `attributeCode` the collection is nested in.
        schema:
          type: string
      - name: childAttributeCode
        in: path
        required: true
        description: An EMBEDDED_COMPONENTS attribute of the item's component type.
        schema:
          type: string
    get:
      operationId: listNestedEmbeddedItems
      tags: [ Base Entities ]
      summary: List the items of a collection nested in an item
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmbeddedItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: appendNestedEmbeddedItem
      tags: [ Base Entities ]
      summary: Append an item to a collection nested in an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedItem'
      responses:
        '201':
          description: Appended; the body is the item as stored.
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{orgKey}/entities/{entityDefinitionCode}/{id}/{attributeCode}/{itemId}/{childAttributeCode}/{childItemId}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - name: entityDefinitionCode
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attributeCode
        in: path
        required: true
        description: An EMBEDDED_COMPONENTS attribute of the entity.
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        description: The `id` of the item of `attributeCode` the collection is nested in.
        schema:
          type: string
      - name: childAttributeCode
        in: path
        required: true
        description: An EMBEDDED_COMPONENTS attribute of the item's component type.
        schema:
          type: string
      - name: childItemId
        in: path
        required: true
        description: The `id` of the item of `childAttributeCode`.
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: The item's version the caller last saw, as its ETag. A different stored item version is a 409.
        schema:
          type: string
    patch:
      operationId: patchNestedEmbeddedItem
      tags: [ Base Entities ]
      summary: Partially update one item of a collection nested in an item
      description: Merge patch of the item, as for a top-level item. `id` cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedItem'
      responses:
        '200':
          description: OK; the body is the item as stored.
          headers:
            ETag:
              $ref: '#/components/headers/ObjectVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteNestedEmbeddedItem
      tags: [ Base Entities ]
      summary: Remove one item of a collection nested in an item
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ── Translations ──
  # The UI message bundles this feature owns, in the shape the frontend's asset files have. Two
  # templates rather than one with an optional segment: 4 vs 5 segments is what makes them
  # unambiguous, and it mirrors `assets/i18n/<lang>.json` and `assets/i18n/<scope>/<lang>.json`.
  #
  # `entity` is the feature's own service root. Every feature serves its own translations from its
  # own store, so that a later split into services with separate databases moves this segment into the
  # host rather than rewriting the resource. In the monolith it is also what keeps seven identical
  # `/translations` paths from colliding into an ambiguous mapping at startup.
  # ==========================================================================
  # Organization units
  # ==========================================================================
  /organizations/{orgKey}/units:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
    get:
      operationId: listOrganizationUnits
      tags: [ Base Entity Units ]
      summary: List the organization's own units
      description: >
        Only the units the organization added; the standard catalog ships with the platform and is not
        listed here. A retired unit is listed (status RETIRED) so that stored values naming it can still be read.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrganizationUnitStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnitPage'
    post:
      operationId: createOrganizationUnit
      tags: [ Base Entity Units ]
      summary: Add a unit to a quantity kind of the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUnitInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
          headers:
            Location:
              schema:
                type: string
        '409':
          description: the code is already a unit of the catalog or of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{orgKey}/units/{code}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/UnitCode'
    get:
      operationId: getOrganizationUnit
      tags: [ Base Entity Units ]
      summary: Get one of the organization's units
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceOrganizationUnit
      tags: [ Base Entity Units ]
      summary: Rename a unit, or retire it
      description: >
        Only `symbol`, `name` and `status` can change. A unit's kind and factor are fixed once it exists —
        stored amounts and their normalized `baseAmount` depend on them — so a different `kind`, `factor`
        or `divisor` is answered 409. There is no delete: retire the unit (status RETIRED) and it is no
        longer offered for new values, while values that name it stay valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUnitInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUnit'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict, or kind / factor / divisor / code changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /organizations/{orgKey}/entity/translations/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base Entity Translations
      summary: Root translation bundle of this feature for one language
      operationId: getEntityTranslations
      description: >-
        The bundle that has no transloco scope — the equivalent of `assets/i18n/<lang>.json`.
        Answers 200 with an empty object when nothing has been seeded, rather than 404: the
        frontend loader reaches here only after an asset miss, and an error status would make an
        unseeded locale indistinguishable from a broken backend.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'

  /organizations/{orgKey}/entity/translations/{scope}/{locale}:
    parameters:
      - $ref: '#/components/parameters/OrgKeyParam'
      - $ref: '#/components/parameters/TranslationScopeParam'
      - $ref: '#/components/parameters/TranslationLocaleParam'
    get:
      tags:
        - Base Entity Translations
      summary: One scoped translation bundle of this feature
      operationId: getEntityScopedTranslations
      description: >-
        The equivalent of `assets/i18n/<scope>/<lang>.json`. Keys are relative to the scope, as in
        the asset files: transloco prefixes them with the scope alias itself.
      responses:
        '200':
          description: The bundle, empty when nothing has been seeded for this scope and locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationBundle'


components:
  parameters:
    TranslationLocaleParam:
      name: locale
      in: path
      required: true
      description: BCP-47 language tag of the bundle to read.
      schema:
        $ref: '#/components/schemas/Locale'

    TranslationScopeParam:
      name: scope
      in: path
      required: true
      description: Transloco scope of the bundle to read.
      schema:
        $ref: '#/components/schemas/TranslationScope'

    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganizationKey'
      description: >-
        URL-safe tenant slug identifying the owning organization. See
        shared-api.yaml OrgKeyParam for the full contract. Must be verified against the
        authenticated principal's organization claim.
    EntityDefinitionCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    UnitCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    RevisionParam:
      name: revision
      in: query
      required: false
      schema:
        type: string
        enum: [ draft, released ]
        default: draft
      description: >-
        Which row of a definition to read: the `draft` the designer edits, or the one the
        organization last released (base-release-api.yaml), which is what the running application
        uses. Writes always go to the draft.

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

  headers:
    ObjectVersion:
      description: The version the ETag names, as a quoted value (`"3"`). On the list, the object version; on an item answer, that item's itemVersion.
      schema:
        type: string

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Payload failed base-rule / attribute validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'

  schemas:
    # ------------------------------------------------------------------
    # Knowledge layer
    # ------------------------------------------------------------------
    EntityDefinitionStatus:
      type: string
      enum: [ DRAFT, ACTIVE, DEPRECATED ]
      description: >-
        The definition's lifecycle, as its designer decides it: ACTIVE, or DEPRECATED, which the
        running application no longer offers. Whether it is live is its releaseState, not this.
        DRAFT is still accepted and stored as ACTIVE.

    ReleaseState:
      type: string
      enum: [ NEW, CHANGED, RELEASED ]
      description: >-
        Where a draft stands against what its organization released: NEW was never released,
        CHANGED differs from the released row, RELEASED is what the running application uses.
        Present on drafts only. A released definition whose draft was deleted is listed by the
        Release section (base-release-api.yaml), not here.

    ValueKind:
      type: string
      description: >
        Data type of the attribute's value. Drives JSON payload validation and
        RSQL comparison-operator casting. (TEXT_LIST intentionally omitted —
        repetition is expressed via the attribute's multiplicity instead.)
      enum: [ TEXT, NUMBER, BOOLEAN, DATE, DATE_TIME, ENUM, REFERENCE ]

    Multiplicity:
      type: string
      description: >
        How many values an attribute holds. The lower bound is 0 or 1, the upper
        bound 1, a fixed maximum `x` (given by maxOccurs) or unbounded `n`. An
        absent multiplicity means a single value. An attribute is multi-valued
        when its upper bound exceeds 1. Value counts are not validated yet.
      enum: [ '0..1', '0..x', '0..n', '1..x', '1..n' ]
      x-enum-varnames: [ ZERO_TO_ONE, ZERO_TO_X, ZERO_TO_N, ONE_TO_X, ONE_TO_N ]

    FormControlType:
      type: string
      description: >
        UI rendering hint for the attribute, consumed by the frontend form
        generator. Mirrors libs/js-shared/base-entity-frontend
        abstact-attr.descriptor.ts FormControlType.
      enum:
        - TEXT
        - TEXTAREA
        - TEXT_BOX
        - NUMBER
        - DATE
        - DATE_TIME
        - BOOLEAN
        - CHECKBOX
        - RADIO
        - DROPDOWN
        - ENUM_SELECT
        - FOREIGN_KEY
        - LOOKUP
        - EMBEDDED_COMPONENTS
        - COMPONENTS
        - RELATED_ENTITIES
        - ARTIFACT
        - AVATAR
        - COMMENTS
        - ADDRESS
        - GEO_LOCATION
        - QUANTITY
        - MONEY
        - DIMENSIONS
        - CALCULATED
        - TAGS
        - TITLE
        - LABEL
        - ADDITIONAL_PROPERTIES
        - FLEX_BOX

    MapProvider:
      type: string
      description: >-
        Who draws the map of an ADDRESS attribute with showMap. OPENSTREETMAP is the default; a click on
        the map opens Google Maps whichever provider draws it.
      enum:
        - OPENSTREETMAP
        - GOOGLE

    FlexDirection:
      type: string
      description: >-
        Flexbox layout direction for entity form descriptors (mirrors
        libs/js-shared/base-entity-frontend FlexDirection).
      enum: [ CONTAINER, COLUMN, ROW ]

    DateStyle:
      type: string
      description: Intl.DateTimeFormat dateStyle used to render the date part of a DATE / DATE_TIME attribute.
      enum: [ none, short, medium, long, full ]

    TimeStyle:
      type: string
      description: Intl.DateTimeFormat timeStyle used to render the time part of a DATE_TIME attribute.
      enum: [ none, short, medium, long ]

    AttributeDateFormat:
      type: object
      description: >-
        Named display style of a DATE / DATE_TIME attribute, rendered at run time in the
        active language. Omitted styles fall back to the value kind's default.
      properties:
        dateStyle:
          $ref: '#/components/schemas/DateStyle'
        timeStyle:
          $ref: '#/components/schemas/TimeStyle'

    Selectable:
      type: object
      description: Key-value option for selectable controls (dropdown, radio, etc.).
      required: [ key ]
      properties:
        key:
          type: string
        value: { }

    AbstractAttrDescriptor:
      type: object
      description: >-
        Base abstract descriptor for entity form attributes and layout items.
        Mirrors libs/js-shared/base-entity-frontend AbstractAttrDescriptor.
      required: [ attrName, formControlType ]
      properties:
        attrName:
          type: string
        formControlType:
          $ref: '#/components/schemas/FormControlType'
        disabled:
          type: boolean
          default: false
        style:
          type: object
          description:
            CSS style key-value pairs (e.g. column-gap: 20px).
          additionalProperties: true
        labelKey:
          type: string
          description: Optional override for the transloco key segment of this attribute.

    AttributeDescriptor:
      allOf:
        - $ref: '#/components/schemas/AbstractAttrDescriptor'
        - type: object
          description: >-
            Descriptor for a single entity attribute in form and table rendering.
            Mirrors libs/js-shared/base-entity-frontend BaseEntityAttrDescriptor.
          properties:
            label:
              type: string
            description:
              type: string
            styleClass:
              type: string
            labelClass:
              type: string
            format:
              type: string
            dateFormat:
              $ref: '#/components/schemas/AttributeDateFormat'
            isLinkToDetails:
              type: boolean
              default: false
            selectables:
              type: array
              items:
                $ref: '#/components/schemas/Selectable'
            visible:
              type: boolean
              default: true
            showThumbnail:
              type: boolean
              default: true
            defaultAvatar:
              type: string
              description: >-
                For AVATAR controls: fallback icon name (e.g. person, sailing) or image URL
                shown before an image is uploaded.
            hideInTable:
              type: boolean
              default: false
            autosizeColumn:
              type: boolean
              default: false
              description: The list column hugs its content (capped at 60% of the table) instead of filling the remaining width.
            isHeading:
              type: boolean
            placeholder:
              type: string
            lines:
              type: integer
            options:
              type: object
              additionalProperties: true
            required:
              type: boolean
              default: false
            pattern:
              type: string
            referenceIdField:
              type: string
              default: id
            linkedEntityType:
              type: string

    BaseEntityAttrDescriptor:
      $ref: '#/components/schemas/AttributeDescriptor'

    FlexBoxDescriptor:
      allOf:
        - $ref: '#/components/schemas/AbstractAttrDescriptor'
        - type: object
          description: >-
            Layout descriptor for organizing attribute descriptors and nested flexbox
            descriptors in containers, rows, or columns with optional CSS styles.
            Mirrors libs/js-shared/base-entity-frontend FlexboxDescriptor.
          required: [ direction ]
          properties:
            direction:
              $ref: '#/components/schemas/FlexDirection'
            attrDescriptors:
              type: array
              description: Array of AttributeDescriptors and/or nested FlexBoxDescriptors.
              items:
                $ref: '#/components/schemas/AbstractAttrDescriptor'

    FlexboxDescriptor:
      $ref: '#/components/schemas/FlexBoxDescriptor'

    BaseEntityDescriptor:
      type: object
      description: >-
        Descriptor bundling an entity's name and its layout of attribute / flexbox descriptors.
        Mirrors libs/js-shared/base-entity-frontend BaseEntityDescriptor.
      required: [ entityName, attrDescriptors ]
      properties:
        entityName:
          type: string
        attrDescriptors:
          type: array
          items:
            $ref: '#/components/schemas/AbstractAttrDescriptor'

    BaseEntityAttributeInput:
      type: object
      required: [ code, name, valueKind, formControlType ]
      properties:
        code:
          type: string
        name:
          type: string
        displayOrder:
          type: integer
        valueKind:
          $ref: '#/components/schemas/ValueKind'
        formControlType:
          $ref: '#/components/schemas/FormControlType'
        multiplicity:
          $ref: '#/components/schemas/Multiplicity'
        maxOccurs:
          type: integer
          minimum: 1
          description: Upper bound of the `x` multiplicities (0..x, 1..x); must be absent for the others.
        required:
          type: boolean
          default: false
        indexed:
          type: boolean
          default: false
          description: When true, an expression index is generated over payload->>code for RSQL range queries.
        defaultValue: { }
        enumValues:
          type: array
          items:
            type: string
          description: Only meaningful when valueKind=ENUM.
        dateFormat:
          $ref: '#/components/schemas/AttributeDateFormat'
        linkedEntityType:
          type: string
          description: >
            Entity definition code this attribute points at. Required when
            formControlType is FOREIGN_KEY (parent reference for a non-embedded
            component) or EMBEDDED_COMPONENTS (child definition carried inline).
        isLinkToDetails:
          type: boolean
          default: false
          description: Marks the attribute used as this entity's display title (componentIdentification).
        defaultAvatar:
          type: string
          description: >
            For AVATAR controls: fallback icon name (e.g. person, sailing) or image URL
            shown before an image is uploaded.
        autosizeColumn:
          type: boolean
          default: false
          description: The list column hugs its content (capped at 60% of the table) instead of filling the remaining width.
        showMap:
          type: boolean
          default: false
          description: >
            For ADDRESS controls only: show the address on a map, with coordinates derived from the
            address and editable by the user.
        mapProvider:
          $ref: '#/components/schemas/MapProvider'
        defaultCountry:
          type: string
          pattern: '^[A-Z]{2}$'
          description: For ADDRESS controls only - the ISO 3166-1 alpha-2 code a new address starts with.
        quantityKind:
          type: string
          description: >
            For QUANTITY controls only: the quantity kind (LENGTH, MASS, TIME ...) whose units the control offers
            when allowedUnits names none. Without either, every unit is offered, grouped by kind.
        allowedUnits:
          type: array
          items:
            type: string
          description: >
            For QUANTITY and DIMENSIONS controls only: the unit codes of the standard catalog to offer, and the only
            ones a value may use. A DIMENSIONS attribute takes lengths only. Empty means every unit of the kind.
        defaultUnit:
          type: string
          description: For QUANTITY and DIMENSIONS controls only - the unit a new value starts in; the base unit of the kind when absent.
        scale:
          type: integer
          minimum: 0
          maximum: 20
          description: >
            For QUANTITY and DIMENSIONS controls only: the most decimal places an amount may have, and the places a
            unit conversion in the form is rounded to. A MONEY amount is limited by its currency's minor units instead.
        allowedCurrencies:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{3}$'
          description: For MONEY controls only - the ISO 4217 codes to offer, and the only ones a value may use. Empty means every currency.
        defaultCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: For MONEY controls only - the currency a new amount starts in; the first allowed one when absent.
        dimensionCount:
          type: integer
          minimum: 2
          maximum: 3
          description: For DIMENSIONS controls only - 2 (width x height, the default) or 3 (adds the depth).
        validationRules: { }

    BaseEntityAttribute:
      allOf:
        - $ref: '#/components/schemas/BaseEntityAttributeInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true

    EntitySharing:
      type: object
      description: >
        Present on an entity type of a common (the organization the platform keeps for a business
        starter): the type is shared, defined once there and read by the organizations of the
        starter. Rejected (422) on any other organization, on an embedded type, and for a policy that
        is not supported yet (write SELF). Give `write` and `visibility`, or only `from`.
      properties:
        write:
          type: string
          enum: [ COMMON_ADMIN, OWNER_ORG, SELF ]
          description: >
            Who may write the records. COMMON_ADMIN: the common's own members only. OWNER_ORG: the member that
            created a record changes and retires it, and the common's members too. SELF is reserved.
        visibility:
          type: string
          enum: [ PUBLIC, OWNER_ONLY ]
          description: >
            Who may read the records. PUBLIC: every member. OWNER_ONLY: the owning member, and the common's own
            members.
        from:
          type: string
          description: >
            The REFERENCE attribute whose record this type's records follow: a booking follows its event. Owner and
            visibility are those of the referenced record (one level; the referenced type is a shared type of the same
            common that follows nothing itself), only the owner of that record — and the common — creates or changes
            them, and the attribute cannot change afterwards. Replaces `write`, `visibility` and `visibleWhen`,
            which are then left out.
        visibleWhen:
          $ref: '#/components/schemas/SharingVisibleWhen'

    SharingVisibleWhen:
      type: object
      required: [ state ]
      description: >
        Limits a PUBLIC shared type: the members that do not own a record see it only while it is in one of these
        states of the type's state machine. The owner and the common's own members always see it. Rejected (422)
        on an OWNER_ONLY type, where it would add nothing, and with no states.
      properties:
        state:
          type: array
          minItems: 1
          items:
            type: string

    BaseEntityDefinitionInput:
      type: object
      required: [ code, name, attributes ]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/EntityDefinitionStatus'
        componentParents:
          type: array
          items:
            type: string
          default: [ ]
          description: Entity definition code(s) this may be nested under. Empty for a standalone entity.
        isEmbedded:
          type: boolean
          default: false
          description: >
            True: this definition's payload is carried inside its parent's payload
            (no EntityObject rows of its own). False: persisted independently,
            linked back to its parent via a FOREIGN_KEY attribute value. Rejected
            (422) when true and componentParents is empty.
        canContextObject:
          type: boolean
          default: false
          description: >
            True: a user can pick one object of this type as the "context object" — the aggregate
            whose embedded components are then listed and edited without naming it again. Only
            meaningful for a stand-alone (not embedded) definition.
        sharing:
          $ref: '#/components/schemas/EntitySharing'
        identifiers:
          type: array
          description: >
            Natural keys. Each entry lists attribute codes whose values together identify a record; no two
            non-retired records of the type may carry the same values (409 on a write that would). A record
            lacking a value for one of the attributes is not constrained by that key.
          items:
            type: array
            items:
              type: string
        organizationId:
          type: string
          format: uuid
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/BaseEntityAttributeInput'

    BaseEntityDefinition:
      allOf:
        - $ref: '#/components/schemas/BaseEntityDefinitionInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            version:
              type: integer
              readOnly: true
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/BaseEntityAttribute'
            createdAt:
              type: string
              format: date-time
              readOnly: true
            createdBy:
              type: string
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            updatedBy:
              type: string
              readOnly: true
            releaseState:
              allOf:
                - $ref: '#/components/schemas/ReleaseState'
              readOnly: true
            sharedFrom:
              type: string
              readOnly: true
              description: >
                Set on a type the organization reads but does not own: the key of the common that
                shares it. Such a type is released, read-only, and cannot be changed or deleted from
                here.

    BaseEntityDefinitionPage:
      $ref: '#/components/schemas/Page'

    # ------------------------------------------------------------------
    # Organization units
    # ------------------------------------------------------------------
    OrganizationUnitStatus:
      type: string
      enum: [ ACTIVE, RETIRED ]
      description: A RETIRED unit is no longer offered for new values; values that name it stay valid.

    OrganizationUnitInput:
      type: object
      required: [ code, symbol, name, kind, factor ]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_-]*$'
          description: >
            Identifies the unit in stored values, across all kinds, so it must not be a code of the standard
            catalog or of another of the organization's units.
        symbol:
          type: string
        name:
          type: string
        kind:
          type: string
          description: A quantity kind of the standard catalog (`MASS`, `LENGTH`, ...). Fixed once the unit exists.
        factor:
          type: string
          description: >
            Decimal text. The unit's amount times `factor`, divided by `divisor`, is the amount in the
            kind's base unit: a pallet of 500 kg is factor `500` in `MASS`. Positive. Fixed once the unit exists.
        divisor:
          type: string
          description: Decimal text, positive, default `1` (a milligram is factor 1, divisor 1000000). Fixed once the unit exists.
        status:
          $ref: '#/components/schemas/OrganizationUnitStatus'
        version:
          type: integer
          description: The version read, on a replace — a stale one is answered 409.

    OrganizationUnit:
      allOf:
        - $ref: '#/components/schemas/OrganizationUnitInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            createdBy:
              type: string
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            updatedBy:
              type: string
              readOnly: true

    OrganizationUnitPage:
      $ref: '#/components/schemas/Page'

    # ------------------------------------------------------------------
    # Operation layer
    # ------------------------------------------------------------------
    EntityObjectInput:
      type: object
      required: [ payload ]
      properties:
        entityDefinitionCode:
          type: string
        payload:
          type: object
          description: >
            Full attribute map, keyed by attribute code. May contain nested objects
            or arrays for embedded components (keyed by the parent's
            EMBEDDED_COMPONENTS attribute code). Validated against the
            definition's attributes (recursively, for embedded components) and
            against base-rule constraints before persistence.
          additionalProperties: true

    EmbeddedItem:
      type: object
      description: One item of an embedded collection. Free-form, as the payload is; `id` identifies it.
      additionalProperties: true

    EntityObjectUpdate:
      type: object
      required: [ version, payload ]
      properties:
        version:
          type: integer
          description: Must match the currently stored version (optimistic locking).
        payload:
          type: object
          additionalProperties: true

    EntityObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entityDefinitionCode:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        payload:
          type: object
          additionalProperties: true
        retiredAt:
          type: string
          format: date-time
          readOnly: true
          description: Set while the object of a shared type is retired; absent otherwise.
        retiredBy:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true

    EntityObjectPage:
      $ref: '#/components/schemas/Page'

    # ------------------------------------------------------------------
    # Shared
    # ------------------------------------------------------------------
    OrganizationKey:
      type: string
      description: >-
        URL-safe tenant slug; canonical definition in shared-api.yaml. Reserved platform
        segments (api, assets, design, ...) are rejected at provisioning time.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    Page:
      type: object
      properties:
        content:
          type: array
          items: { }
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ProblemDetail:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ValidationProblemDetail:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            violations:
              type: array
              items:
                type: object
                properties:
                  attributeCode:
                    type: string
                  message:
                    type: string

    Locale:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical Locale — see the note on WidgetInstance there for why
        this workspace repeats rather than $refs across files. A bare string schema generates no Java
        class, so the repetition needs no schemaMappings entry.
      pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
      minLength: 2
      maxLength: 6
      example: en

    TranslationScope:
      type: string
      description: >-
        Repeat of shared-api.yaml's canonical TranslationScope. Transloco scope a bundle loads under,
        and the directory segment its asset equivalent would have had.
      pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
      minLength: 1
      maxLength: 64
      example: base_app

    TranslationBundle:
      type: object
      description: >-
        Repeat of shared-api.yaml's canonical TranslationBundle, mapped onto the shared generated type.
        One transloco bundle: the whole message map of an (organization, scope, locale) triple, in the
        exact shape the frontend's asset file has. Keys are relative to the scope — transloco prefixes
        them with the scope alias itself.
      additionalProperties: true
      nullable: true
      example:
        module:
          name: Order administration
        route:
          orders: All orders
