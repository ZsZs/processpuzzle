openapi: 3.0.3
info:
  title: ProcessPuzzle Entity API (base-entity)
  description: >-
    Two layers over one runtime-defined data model.

    KNOWLEDGE LAYER (/entity-definitions): what an entity type looks like — its attributes,
    their form control, their storage kind, and (for reference-shaped attributes) what they
    point at and whether they own what they point at. Entities are no longer defined in
    TypeScript; this layer is now the single source of truth, and base-entity-frontend's
    existing *.descriptors.ts factories become read paths over this API rather than literal
    definitions — see the "Frontend descriptor compatibility" note on BaseEntityDefinition.

    OPERATION LAYER (/entities/{entityName}): the actual objects and their attribute values.
    Internally persisted as normalized rows (one `objects` row per instance, one
    `attribute_values` row per scalar/reference/list-element — see the accompanying schema
    design). On the wire, every object is still one FLAT JSON document, `{ id, ...attrName:
    value }`, matching what json-server has always served and what every existing
    BaseEntityMapper.fromDto() already expects. EAV is a persistence-layer decision; no
    consumer of this API, existing or new, needs to know rows exist underneath it.

    Both layers are tenant-scoped by {orgKey}, exactly as base-app-api.yaml and
    base-artifact-api.yaml establish. Component composition (COMPOSITION-relationship
    attributes) reuses the operation layer's own object model recursively — an embedded
    component is an ordinary object with parentObjectId/parentAttrName set, not a separate
    concept, so nesting depth is unbounded by construction, the same way
    embeddedComponents[].embeddedDetails[] already nests two levels deep in the current mock
    data.
  version: 0.1.0

servers:
  - url: 'http://localhost:8080/api/v1'

paths:

  # ── Knowledge layer: entity definitions ───────────────────────

  /organizations/{orgKey}/entity-definitions:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    get:
      operationId: listEntityDefinitions
      summary: List the organization's entity definitions
      tags: [ Base Entity - Knowledge ]
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: Paged list of definitions (summary view — attributes omitted, see getEntityDefinition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_EntityDefinitionSummary"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createEntityDefinition
      summary: Create a new entity definition
      tags: [ Base Entity - Knowledge ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityDefinitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/entity-definitions/{entityName}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
    get:
      operationId: getEntityDefinition
      summary: Get a definition with its full attribute list
      tags: [ Base Entity - Knowledge ]
      responses:
        "200":
          description: Full definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDefinition"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateEntityDefinition
      summary: Replace a definition's label/embedding/component-parent and full attribute list
      description: >-
        Whole-document replace, same shape as base-artifact's updateArtifact. For adding or
        editing a single attribute — the common schema-evolution operation — prefer the
        attribute-level endpoints below, which don't require resending every other attribute.
      tags: [ Base Entity - Knowledge ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityDefinitionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteEntityDefinition
      summary: Delete a definition
      description: >-
        Rejected with 409 while any object of this type exists (including COMPOSITION-owned
        children of other types, which reference it via linkedEntityType) — deleting the
        shape out from under existing data is not this endpoint's job. Delete the objects
        first, or use a future archival mechanism if one gets built.
      tags: [ Base Entity - Knowledge ]
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/entity-definitions/{entityName}/attributes:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
    post:
      operationId: appendEntityAttribute
      summary: Append a new attribute to the end of the definition's display order
      tags: [ Base Entity - Knowledge ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityAttributeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityAttribute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/entity-definitions/{entityName}/attributes/reorder:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
    put:
      operationId: reorderEntityAttributes
      summary: Reorder attributes (displayOrder)
      description: Same permutation contract as base-artifact's reorderArtifactBlocks — the submitted list must be an exact permutation of the definition's current attrNames.
      tags: [ Base Entity - Knowledge ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAttributesRequest"
      responses:
        "200":
          description: New attribute order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityAttribute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgKey}/entity-definitions/{entityName}/attributes/{attrName}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
      - $ref: "#/components/parameters/AttrNameParam"
    put:
      operationId: replaceEntityAttribute
      summary: Replace one attribute's definition
      description: >-
        Changing valueKind, relationship, or cardinality on an attribute that already has
        stored values is rejected with 409 — see validateEntityDefinition for a preview of
        why before attempting it. Renaming (attrName in the body differs from the path) is
        likewise rejected; delete and re-append instead, since attrName is how stored
        attribute_values rows are keyed.
      tags: [ Base Entity - Knowledge ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityAttributeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityAttribute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteEntityAttribute
      summary: Remove an attribute
      description: Rejected with 409 while any object of this type has a stored value for it — same "don't silently orphan data" stance as the definition-level delete.
      tags: [ Base Entity - Knowledge ]
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{orgKey}/entity-definitions/validate:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
    post:
      operationId: validateEntityDefinition
      summary: Validate a candidate definition without persisting it
      description: >-
        Checks: unique attrNames; every linkedEntityType resolving to a definition in this
        organization (error); a COMPOSITION attribute's linkedEntityType definition having
        isEmbedded true and listing this definition in its componentParent (error) —
        otherwise an embedded child could never be created through this attribute; an
        ASSOCIATION attribute's linkedEntityType definition having isEmbedded true (error —
        an embedded-only type cannot be plainly referenced, only owned); relationship/
        cardinality only set when valueKind is REFERENCE (error otherwise); an isLayoutOnly
        attribute carrying any of the storage-relevant fields (warning — they'll be ignored).
      tags: [ Base Entity - Knowledge ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityDefinitionInput"
      responses:
        "200":
          description: Validation outcome — 200 even when valid is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Operation layer: objects ───────────────────────────────────

  /organizations/{orgKey}/entities/{entityName}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
    get:
      operationId: listEntityObjects
      summary: List objects of one entity type
      description: >-
        `where` is RSQL over attrNames declared on this entityName's definition — resolved
        against the correct typed attribute_values column per attribute (see
        RsqlToEavSpecificationBuilder), not a literal column name. Filtering or sorting on an
        attrName the definition doesn't declare is a 400, not an empty result. `select`
        limits which attributes are included per object, which is cheap here (fewer
        attribute_values joins) rather than just a smaller response.
      tags: [ Base Entity - Operation ]
      parameters:
        - $ref: "#/components/parameters/WhereParam"
        - $ref: "#/components/parameters/OrderParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - name: select
          in: query
          required: false
          description: Comma-separated attrNames to include. Omitted means all declared attributes.
          schema:
            type: string
      responses:
        "200":
          description: Paged list of flat objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOf_EntityObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: entityName does not resolve to a definition in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createEntityObject
      summary: Create an object
      description: >-
        `attributes` is validated against the definition: required attributes present, every
        value's shape matching its attribute's valueKind (a NUMBER attribute given a string
        that doesn't parse is a 400), every REFERENCE resolving to an existing object of the
        right linkedEntityType, and COMPOSITION-valued attributes creating their child objects
        transactionally alongside the parent rather than requiring a separate call per child.
      tags: [ Base Entity - Operation ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityObjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: entityName does not resolve to a definition in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations/{orgKey}/entities/{entityName}/{objectId}:
    parameters:
      - $ref: "#/components/parameters/OrgKeyParam"
      - $ref: "#/components/parameters/EntityNameParam"
      - $ref: "#/components/parameters/ObjectIdParam"
    get:
      operationId: getEntityObject
      summary: Get one object as a flat document
      tags: [ Base Entity - Operation ]
      parameters:
        - name: select
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Flat object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityObject"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateEntityObject
      summary: Replace an object's attribute values
      description: >-
        Whole-document replace of `attributes`, same optimistic-locking contract as
        base-artifact (version bumped on success, 409 on a stale write). A COMPOSITION list
        that omits a previously-present child deletes that child object (cascade); this is
        the one case where "whole-document replace" has a real destructive edge, worth
        surfacing in the frontend the same deliberate way base-artifact's Properties/Content
        split exists to avoid the equivalent hazard there.
      tags: [ Base Entity - Operation ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityObjectInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteEntityObject
      summary: Delete an object
      description: Cascades to any COMPOSITION-owned children (parentObjectId). Rejected with 409 if another object holds an ASSOCIATION reference to this one — same "don't leave a dangling reference" stance base-artifact's block deletion takes.
      tags: [ Base Entity - Operation ]
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:

  parameters:
    OrgKeyParam:
      name: orgKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationKey"
      description: Tenant discriminator; see shared-api.yaml OrgKeyParam for the full contract.
    EntityNameParam:
      name: entityName
      in: path
      required: true
      description: Unique within the organization.
      schema:
        type: string
    AttrNameParam:
      name: attrName
      in: path
      required: true
      schema:
        type: string
    ObjectIdParam:
      name: objectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WhereParam:
      name: where
      in: query
      required: false
      schema:
        type: string
      description: RSQL filter expression. On the operation layer, resolved per-attribute against the correct typed column — see listEntityObjects.
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
      description: Format `property,(asc|desc)`; multiple criteria separated by comma.
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20

  responses:
    BadRequest:
      description: Validation error — the request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal may not act on this organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ── Knowledge layer ────────────────────────────────────────

    FormControlType:
      type: string
      description: Unchanged from base-entity-frontend's existing enum — this contract does not redefine how something renders, only how it's stored (see ValueKind).
      enum: [ ADDITIONAL_PROPERTIES, ARTIFACT, CHECKBOX, COMPONENTS, DATE, DROPDOWN, EMBEDDED_COMPONENTS, FLEX_BOX, FOREIGN_KEY, LABEL, LOOKUP, RADIO, RELATED_ENTITIES, TAGS, TITLE, TEXT_BOX, TEXTAREA ]

    ValueKind:
      type: string
      description: >-
        Orthogonal to FormControlType — governs which attribute_values column(s) an
        attribute's values live in, not how it renders. TEXT_LIST is a bare string array
        (TAGS); REFERENCE covers every FK-shaped FormControlType (LOOKUP, FOREIGN_KEY,
        RELATED_ENTITIES, COMPONENTS, EMBEDDED_COMPONENTS) — relationship and cardinality on
        the attribute distinguish which; JSON is the catch-all for ADDITIONAL_PROPERTIES;
        FILE_REFERENCE is the ARTIFACT (file-attachment) control's bucket/objectId/name/
        mimeType shape specifically, not general JSON.
      enum: [ TEXT, TEXT_LIST, NUMBER, BOOLEAN, DATE, JSON, FILE_REFERENCE, REFERENCE ]

    AttributeRelationship:
      type: string
      description: REFERENCE-valued attributes only. COMPOSITION-owned objects are deleted when their parent is (cascade) and are not independently listable at the top level if their definition's isEmbedded is true.
      enum: [ ASSOCIATION, COMPOSITION ]

    AttributeCardinality:
      type: string
      enum: [ ONE, MANY ]

    SelectableValue:
      type: object
      required: [ value, label ]
      properties:
        value:
          type: string
        label:
          type: string

    EntityAttributeInput:
      type: object
      required: [ attrName, formControlType, valueKind ]
      properties:
        attrName:
          type: string
        label:
          type: string
          nullable: true
        formControlType:
          $ref: "#/components/schemas/FormControlType"
        valueKind:
          $ref: "#/components/schemas/ValueKind"
        required:
          type: boolean
          default: false
        isLayoutOnly:
          type: boolean
          default: false
          description: FLEX_BOX/LABEL/TITLE — never produces an attribute_values row; a payload supplying a value for one is a 400.
        relationship:
          allOf:
            - $ref: "#/components/schemas/AttributeRelationship"
          nullable: true
        cardinality:
          allOf:
            - $ref: "#/components/schemas/AttributeCardinality"
          nullable: true
        linkedEntityType:
          type: string
          nullable: true
          description: REFERENCE only — target entityName, resolved within this organization.
        selectableValues:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SelectableValue"
        description:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true
        style:
          type: object
          nullable: true
          additionalProperties: true

    EntityAttribute:
      allOf:
        - $ref: "#/components/schemas/EntityAttributeInput"
        - type: object
          required: [ displayOrder ]
          properties:
            displayOrder:
              type: integer

    EntityDefinitionInput:
      type: object
      required: [ entityName ]
      properties:
        entityName:
          type: string
        label:
          type: string
          nullable: true
        i18nScope:
          type: string
          nullable: true
        isEmbedded:
          type: boolean
          default: false
          description: True means objects of this type can only exist as COMPOSITION children (see componentParent) — never created or listed at the top level.
        componentParent:
          type: array
          nullable: true
          items:
            type: string
          description: entityNames this definition may be embedded/owned under. Meaningful only when isEmbedded is true; checked by validateEntityDefinition against every COMPOSITION attribute pointing here.
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/EntityAttributeInput"

    EntityDefinition:
      description: >-
        Frontend descriptor compatibility: base-entity-frontend's existing
        create*Descriptor() factories (createWidgetRefDescriptor, createArtifactInputPort
        Descriptor, etc.) become thin adapters over this shape rather than literal
        BaseEntityDescriptor constructions — a factory fetches/caches its EntityDefinition
        and maps attributes -> AbstractAttrDescriptor once, so existing components
        (BaseEntityContainerComponent, EmbeddedComponentsListComponent, ...) don't change at
        all, only where the descriptor's data originates.
      allOf:
        - $ref: "#/components/schemas/EntityDefinitionInput"
        - type: object
          properties:
            orgKey:
              $ref: "#/components/schemas/OrganizationKey"
            version:
              type: integer
              format: int64
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/EntityAttribute"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    EntityDefinitionSummary:
      type: object
      properties:
        entityName:
          type: string
        label:
          type: string
        isEmbedded:
          type: boolean
        attributeCount:
          type: integer
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time

    ReorderAttributesRequest:
      type: object
      required: [ attrNames ]
      properties:
        attrNames:
          type: array
          items:
            type: string

    # ── Operation layer ────────────────────────────────────────

    EntityObjectInput:
      type: object
      description: >-
        The flat wire document. Keys are attrNames declared on the entityName's current
        definition; values match each attribute's valueKind (TEXT -> string, NUMBER ->
        number, BOOLEAN -> boolean, DATE -> RFC 3339 string, TEXT_LIST -> string array,
        REFERENCE + cardinality ONE -> object id string, REFERENCE + cardinality MANY ->
        array of object id strings, JSON/FILE_REFERENCE -> arbitrary object, COMPOSITION ->
        nested EntityObjectInput(s) rather than an id, since the child doesn't exist yet).
        No `id` here — path param on update, server-generated on create.
      additionalProperties: true

    EntityObject:
      type: object
      description: Same flat shape as EntityObjectInput, with the fields every persisted object carries regardless of its definition.
      required: [ id, entityName, version ]
      properties:
        id:
          type: string
          format: uuid
        orgKey:
          $ref: "#/components/schemas/OrganizationKey"
        entityName:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true

    PageOf_EntityDefinitionSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/EntityDefinitionSummary"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    PageOf_EntityObject:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/EntityObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    # ── Validation / shared (local duplicates — see base-artifact-api.yaml's note on why) ──

    OrganizationKey:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 63
      example: my-org

    Severity:
      type: string
      enum: [ ERROR, WARNING, INFO ]
      default: ERROR

    ValidationProblem:
      type: object
      required: [ errorId, errorText ]
      properties:
        path:
          type: string
          example: /attributes/2/linkedEntityType
        errorId:
          type: string
          example: entity.validation.embedded-target-missing-component-parent
        errorText:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"

    ValidationResult:
      type: object
      required: [ valid, problems ]
      properties:
        valid:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ValidationProblem"

    ErrorResponse:
      type: object
      required: [ errorId, errorText ]
      properties:
        errorId:
          type: string
        errorText:
          type: string
