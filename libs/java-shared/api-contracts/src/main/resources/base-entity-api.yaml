openapi: 3.1.0
info:
  title: Base Entity API
  description: >
    Runtime metadata-driven entity platform for ProcessPuzzle.

    Two layers:
      1. Knowledge layer — BaseEntityDefinition + BaseEntityAttribute. Defines what an
         entity type looks like. Authored and edited at runtime; replaces the previous
         static TypeScript entity definitions.
      2. Operation layer — EntityObject. Stores actual instances. The full attribute
         payload (including embedded components) is persisted as-is, as JSON
         (PostgreSQL JSONB), rather than normalized into per-attribute-value rows.
         Validation is enforced by base-rule (@Validate / ConstraintRule) against the
         JSON payload before persistence, so normalization buys no extra safety —
         only extra joins. The one cost this defers to the RsqlToEavSpecificationBuilder
         is comparison-operator type coercion, since JSONB has no native typed columns
         (see "RSQL Filtering" section below).
  version: 0.1.0

servers:
  - url: /api/base-entity

tags:
  - name: entity-definitions
    description: Knowledge layer — entity type metadata
  - name: entities
    description: Operation layer — entity instances

# ---------------------------------------------------------------------------
# RSQL Filtering
# ---------------------------------------------------------------------------
# GET /entities accepts an `rsql` query param, e.g.:
#   rsql=status==ACTIVE;age=gt=30
#   rsql=address.city==Munich                      (embedded component path)
#   rsql=owner.code==acme-corp                      (non-embedded component, own EntityObject)
#
# RsqlToEavSpecificationBuilder resolves each attribute path against
# BaseEntityAttribute.valueKind (walking into componentDefinitionCode for nested
# paths) BEFORE building the predicate, so it knows whether to cast
# payload->>'path' to numeric/date/boolean or leave it text. Only attributes with
# BaseEntityAttribute.indexed=true are guaranteed an expression index; unindexed
# attributes still work, just without one.
# ---------------------------------------------------------------------------

paths:
  # ==========================================================================
  # Knowledge layer
  # ==========================================================================
  /entity-definitions:
    get:
      operationId: listEntityDefinitions
      tags: [ entity-definitions ]
      summary: List entity definitions
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EntityDefinitionStatus'
        - name: isEmbedded
          in: query
          schema:
            type: boolean
          description: Filter to embedded-only or standalone/non-embedded-only definitions.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinitionPage'
    post:
      operationId: createEntityDefinition
      tags: [ entity-definitions ]
      summary: Create a new entity definition (with its attributes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityDefinitionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinition'
          headers:
            Location:
              schema:
                type: string
        '409':
          description: code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'

  /entity-definitions/{code}:
    parameters:
      - $ref: '#/components/parameters/EntityDefinitionCode'
    get:
      operationId: getEntityDefinition
      tags: [ entity-definitions ]
      summary: Get an entity definition by code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceEntityDefinition
      tags: [ entity-definitions ]
      summary: Replace an entity definition (attributes included, full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityDefinitionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict (optimistic locking) or code is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteEntityDefinition
      tags: [ entity-definitions ]
      summary: Delete an entity definition
      description: >
        Rejected (409) if EntityObject rows still reference this definition, or if
        another definition still lists this one in componentParents.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: definition is still in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /entity-definitions/{code}/attributes:
    parameters:
      - $ref: '#/components/parameters/EntityDefinitionCode'
    post:
      operationId: addAttribute
      tags: [ entity-definitions ]
      summary: Add a single attribute to an existing definition
      description: Convenience endpoint for incremental authoring; PUT the whole definition for bulk changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityAttributeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityAttribute'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: attribute code already exists on this definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /entity-definitions/{code}/attributes/{attributeCode}:
    parameters:
      - $ref: '#/components/parameters/EntityDefinitionCode'
      - name: attributeCode
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceAttribute
      tags: [ entity-definitions ]
      summary: Replace a single attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseEntityAttributeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseEntityAttribute'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAttribute
      tags: [ entity-definitions ]
      summary: Remove an attribute
      description: Rejected (409) if existing EntityObject payloads for this definition still populate this attribute.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: attribute still populated on existing objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ==========================================================================
  # Operation layer
  # ==========================================================================
  /entities:
    get:
      operationId: listEntities
      tags: [ entities ]
      summary: List / filter entity instances
      parameters:
        - name: entityDefinitionCode
          in: query
          required: true
          schema:
            type: string
        - name: rsql
          in: query
          schema:
            type: string
          description: RSQL filter over payload attributes, including embedded-component paths (a.b.c).
        - name: sort
          in: query
          schema:
            type: string
          example: 'createdAt,desc'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObjectPage'
        '400':
          description: malformed RSQL, or filter references an unresolvable attribute path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: createEntity
      tags: [ entities ]
      summary: Create an entity instance
      description: >
        `entityDefinitionCode` must reference a definition with isEmbedded=false
        (embedded component definitions exist for validation/UI metadata only and
        never get their own EntityObject rows — they travel inside a parent's payload).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityObjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
          headers:
            Location:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /entities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEntity
      tags: [ entities ]
      summary: Get an entity instance by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateEntity
      tags: [ entities ]
      summary: Replace an entity instance's payload
      description: Full-payload replace. `version` must match the current stored version (optimistic locking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityObjectUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityObject'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteEntity
      tags: [ entities ]
      summary: Delete an entity instance
      description: >
        Deleting an object that other objects reference via a FOREIGN_KEY attribute
        value is rejected (409) unless `cascade=true` is passed.
      parameters:
        - name: cascade
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: referenced by other entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  parameters:
    EntityDefinitionCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Payload failed base-rule / attribute validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'

  schemas:
    # ------------------------------------------------------------------
    # Knowledge layer
    # ------------------------------------------------------------------
    EntityDefinitionStatus:
      type: string
      enum: [ DRAFT, ACTIVE, DEPRECATED ]

    ValueKind:
      type: string
      description: >
        Data type of the attribute's value. Drives JSON payload validation and
        RSQL comparison-operator casting. (TEXT_LIST intentionally omitted —
        repetition is expressed via isMultiValued instead.)
      enum: [ TEXT, NUMBER, BOOLEAN, DATE, DATE_TIME, ENUM, REFERENCE ]

    FormControlType:
      type: string
      description: >
        UI rendering hint for the attribute, consumed by the frontend form
        generator. NOTE: mirrors libs/js-shared/base-entity-frontend
        abstact-attr.descriptor.ts FormControlType — this enum should be
        reconciled against that source before finalizing; only the values
        referenced elsewhere in the codebase are listed here as placeholders.
      enum:
        - TEXT
        - TEXTAREA
        - NUMBER
        - DATE
        - DATE_TIME
        - BOOLEAN
        - ENUM_SELECT
        - FOREIGN_KEY
        - EMBEDDED_COMPONENTS
        - ARTIFACT

    BaseEntityAttributeInput:
      type: object
      required: [ code, name, valueKind, formControlType ]
      properties:
        code:
          type: string
        name:
          type: string
        displayOrder:
          type: integer
        valueKind:
          $ref: '#/components/schemas/ValueKind'
        formControlType:
          $ref: '#/components/schemas/FormControlType'
        isMultiValued:
          type: boolean
          default: false
        required:
          type: boolean
          default: false
        indexed:
          type: boolean
          default: false
          description: When true, an expression index is generated over payload->>code for RSQL range queries.
        defaultValue: { }
        enumValues:
          type: array
          items:
            type: string
          description: Only meaningful when valueKind=ENUM.
        linkedEntityType:
          type: string
          description: >
            Entity definition code this attribute points at. Required when
            formControlType is FOREIGN_KEY (parent reference for a non-embedded
            component) or EMBEDDED_COMPONENTS (child definition carried inline).
        isLinkToDetails:
          type: boolean
          default: false
          description: Marks the attribute used as this entity's display title (componentIdentification).
        validationRules: { }

    BaseEntityAttribute:
      allOf:
        - $ref: '#/components/schemas/BaseEntityAttributeInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true

    BaseEntityDefinitionInput:
      type: object
      required: [ code, name, attributes ]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/EntityDefinitionStatus'
        componentParents:
          type: array
          items:
            type: string
          default: [ ]
          description: Entity definition code(s) this may be nested under. Empty for a standalone entity.
        isEmbedded:
          type: boolean
          default: false
          description: >
            True: this definition's payload is carried inside its parent's payload
            (no EntityObject rows of its own). False: persisted independently,
            linked back to its parent via a FOREIGN_KEY attribute value. Rejected
            (422) when true and componentParents is empty.
        organizationId:
          type: string
          format: uuid
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/BaseEntityAttributeInput'

    BaseEntityDefinition:
      allOf:
        - $ref: '#/components/schemas/BaseEntityDefinitionInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            version:
              type: integer
              readOnly: true
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/BaseEntityAttribute'
            createdAt:
              type: string
              format: date-time
              readOnly: true
            createdBy:
              type: string
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            updatedBy:
              type: string
              readOnly: true

    BaseEntityDefinitionPage:
      $ref: '#/components/schemas/Page'

    # ------------------------------------------------------------------
    # Operation layer
    # ------------------------------------------------------------------
    EntityObjectInput:
      type: object
      required: [ entityDefinitionCode, payload ]
      properties:
        entityDefinitionCode:
          type: string
        payload:
          type: object
          description: >
            Full attribute map, keyed by attribute code. May contain nested objects
            or arrays for embedded components (keyed by the parent's
            EMBEDDED_COMPONENTS attribute code). Validated against the
            definition's attributes (recursively, for embedded components) and
            against base-rule constraints before persistence.
          additionalProperties: true

    EntityObjectUpdate:
      type: object
      required: [ version, payload ]
      properties:
        version:
          type: integer
          description: Must match the currently stored version (optimistic locking).
        payload:
          type: object
          additionalProperties: true

    EntityObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entityDefinitionCode:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true

    EntityObjectPage:
      $ref: '#/components/schemas/Page'

    # ------------------------------------------------------------------
    # Shared
    # ------------------------------------------------------------------
    Page:
      type: object
      properties:
        content:
          type: array
          items: { }
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ProblemDetail:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ValidationProblemDetail:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            violations:
              type: array
              items:
                type: object
                properties:
                  attributeCode:
                    type: string
                  message:
                    type: string
