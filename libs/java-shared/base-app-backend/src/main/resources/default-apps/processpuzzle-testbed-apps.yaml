# Default app definitions of the 'processpuzzle-testbed' organization — the tenant behind
# apps/processpuzzle-testbed.
#
# DefaultAppLoader imports this file on startup when `base-app.loadDefaultApps` is true. The owning
# organization is the part of the file name before `-apps.yaml`, exactly as `<orgKey>-rules.yaml`
# works in base-rule, so seeding another tenant is adding another file rather than a configuration
# change.
#
# The `organization` block provisions the tenant when it does not exist yet; its `key` is ignored,
# because the file name decides where the definitions land. Everything under `appDefinitions` is
# precisely the payload of `POST /organizations/{orgKey}/app-definitions`, so this file also feeds
# the YAML import endpoint unchanged — the extra `organization` block is ignored there.
#
# Ids are lowercase-hyphen and every entity widget names its entity, so the definition satisfies the
# 'App Definition' rules in base-rule's sample-rules as well as the structural validator.
#
# `moduleDefinitions` are seeded before `appDefinitions`, so a mount below names a module that exists
# by then. The order is a courtesy to the startup log rather than a requirement: a mount naming an
# unknown module is a warning, which is what keeps the two aggregates loosely coupled.

organization:
  key: processpuzzle-testbed
  name: ProcessPuzzle Testbed
  description: >-
    Tenant of the ProcessPuzzle Testbed application, which exercises and demonstrates the
    capabilities of the ProcessPuzzle framework.
  contactEmail: testbed@processpuzzle.com
  defaultLocale: en

moduleDefinitions:
  # A back-office slice of the same order domain the 'demo' app front-ends. It exists to show what a
  # module is for: a route list of its own, authored and versioned separately, mounted under one prefix
  # by whichever app wants it. Its routes use the ENTITY target kind, so the screens are generated from
  # the testbed's 'Order Line' descriptor rather than composed from widgets.
  - key: order-admin
    name: Order administration
    translocoId: order_admin.module.name
    description: >-
      Order line administration: the generated list and detail screens of 'Order Line', kept out of
      the order-entry application so that back-office screens can be authored on their own.
    translocoScope: order_admin
    # 'lines' and 'line/:id' are siblings on purpose. Had the detail route been 'lines/:id', the flat
    # list would derive 'lines' into its Angular parent, and a generated list screen hosts no
    # router-outlet for the child to render in.
    routes:
      - path: lines
        title: All order lines
        translocoId: order_admin.route.lines
        icon: view_list
        target:
          kind: ENTITY
          entityName: Order Line
          entityMode: LIST
      - path: line/:id
        title: Order line
        translocoId: order_admin.route.line
        target:
          kind: ENTITY
          entityName: Order Line
          entityMode: DETAILS

appDefinitions:
  # A deliberately basic shell: one Material theme, the default sidenav-left layout, the three
  # shell regions, and three routes driven by the testbed's 'Order' and 'Order Line' descriptors.
  # It is meant to be the smallest definition that still renders something navigable.
  - id: demo
    name: Demo
    translocoId: demo.app.name
    description: >-
      Basic demonstration application: order management screens composed from the entity-driven
      widgets, with nothing configured that the shell does not need.
    theme:
      materialTheme: azure-blue
      colorScheme: light
    layout:
      preset: sidenav-left
      sidenavMode: side
      sidenavCollapsible: true
      sidenavOpenByDefault: true
      contentMaxWidth: 1280px
    regions:
      # header and footer are declared so the shell renders them, but carry no static widgets yet.
      # There is no 'content' region: the content area is the router outlet the routes below fill.
      - type: header
      - type: sidenav
        navItems:
          # A group node: no routePath, so it only expands its children.
          - id: nav-orders
            label: Orders
            translocoId: demo.nav.orders
            icon: receipt_long
            children:
              - id: nav-order-list
                label: All orders
                translocoId: demo.nav.orderList
                icon: list_alt
                routePath: order-list
              - id: nav-order-entry
                label: New order
                translocoId: demo.nav.orderEntry
                icon: add_circle
                routePath: order-entry
          - id: nav-order-lines
            label: Order lines
            translocoId: demo.nav.orderLines
            icon: view_list
            routePath: order-line-list
          # Points into the module mounted below: the module's own 'lines' prefixed with its basePath.
          # Startup logs one 'app.validation.unknown-route-reference' WARNING for this item, and should:
          # an app definition cannot see the routes of a module it mounts, which is what keeps the two
          # aggregates independent. A nav item is how a mounted module becomes reachable at all.
          - id: nav-order-admin
            label: Order line administration
            translocoId: demo.nav.orderAdmin
            icon: manage_search
            routePath: back-office/lines
      - type: footer
    # Routes are flat: 'path' may be multi-segment and Angular's nesting is derived from the
    # prefixes at registration time.
    routes:
      - path: order-list
        title: Orders
        translocoId: demo.route.orderList
        target:
          kind: WIDGETS
          widgets:
            - id: order-grid
              type: entity-grid
              props:
                entityName: Order
                columns: [orderNumber, customerName, status, total]
                rsqlFilter: "status!=CANCELLED"
      - path: order-entry
        title: New order
        translocoId: demo.route.orderEntry
        target:
          kind: WIDGETS
          widgets:
            - id: order-form
              type: entity-form
              props:
                entityName: Order
                submitLabel: Save order
                submitTranslocoId: demo.action.saveOrder
      - path: order-line-list
        title: Order lines
        translocoId: demo.route.orderLineList
        target:
          kind: WIDGETS
          widgets:
            - id: order-line-grid
              type: entity-grid
              props:
                entityName: Order Line
                columns: [productName, quantity, unitPrice]
    # The single composition point. The 'order-admin' module's flat routes are registered below this
    # prefix, so its 'lines' answers at 'back-office/lines'. A module mounts no modules, so route
    # structure composes exactly one level and no deeper.
    modules:
      - moduleKey: order-admin
        basePath: back-office
