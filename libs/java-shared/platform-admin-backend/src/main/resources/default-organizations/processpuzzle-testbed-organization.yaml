# The 'processpuzzle-testbed' tenant - the organization behind apps/processpuzzle-testbed-frontend.
#
# DefaultOrganizationLoader provisions this on startup when `platform-admin.loadDefaultOrganizations`
# is true, before any feature's own seed loader runs. The tenant is the part of the file name before
# `-organization.yaml`; the `key` below is documentation, exactly as in `<orgKey>-apps.yaml` and
# `<orgKey>-rules.yaml`.
#
# This block used to sit at the top of base-app's `default-apps/processpuzzle-testbed-apps.yaml`,
# which meant base-app created tenants. base-app owns app definitions, not tenants.

key: processpuzzle-testbed
name: ProcessPuzzle Testbed
description: >-
  Tenant of the ProcessPuzzle Testbed application, which exercises and demonstrates the
  capabilities of the ProcessPuzzle framework.
contactEmail: testbed@processpuzzle.com
defaultLocale: en
