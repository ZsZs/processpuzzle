# The plan catalog a fresh deployment starts with. Seeded by DefaultPlanLoader when
# platform-admin.loadDefaultPlans=true, and never overwritten once a code exists — so editing a
# price here does not reprice an already-seeded database. That is the same create-only behaviour
# base-entity's seed importer has, and for the same reason: the alternative is a restart silently
# changing what customers are charged.
#
# Prices are in minor units (cents). amountMinor: 4900 is EUR 49.00.
#
# The directory name matters: `classpath*:default-plans/*-plans.yaml` is resolved per feature, and
# same-named seed files in two libraries leak across each other without the per-feature directory.
plans:
  - code: free
    name: Free
    description: >-
      For evaluating the platform. One organization, a handful of users, no workflow automation.
    interval: MONTHLY
    currency: EUR
    amountMinor: 0
    limits:
      USERS: 3
      ENTITY_OBJECTS: 1000
      DOCUMENTS: 100
      # 0 rather than absent: workflow automation is unavailable on this plan, which is a different
      # statement from "unmetered".
      WORKFLOW_INSTANCES: 0
      STORAGE_BYTES: 524288000
      API_CALLS: 10000

  - code: team
    name: Team
    description: >-
      For a working team: metadata-driven applications, rules, state machines and workflow
      automation, with support during business hours.
    interval: MONTHLY
    currency: EUR
    amountMinor: 4900
    limits:
      USERS: 25
      ENTITY_OBJECTS: 100000
      DOCUMENTS: 10000
      WORKFLOW_INSTANCES: 5000
      STORAGE_BYTES: 21474836480
      API_CALLS: 1000000

  - code: enterprise
    name: Enterprise
    description: >-
      Unmetered. Every metric is deliberately absent rather than set to a large number, because a
      ceiling nobody intends to enforce still gets enforced eventually.
    interval: YEARLY
    currency: EUR
    amountMinor: 990000
    limits: {}
