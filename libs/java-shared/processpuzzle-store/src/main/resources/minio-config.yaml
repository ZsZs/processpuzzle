minio:
  endpoint: http://localhost:7000
  public-endpoint: http://localhost:7000
  access-key: minioadmin
  secret-key: minioadmin
  # Prepended to every bucket name below as <prefix>-<purpose>, so one MinIO can hold every
  # application stack without them sharing a bucket. Empty here on purpose: these are the library
  # defaults, and an existing deployment already has objects in the flat names. Each backend
  # deployment sets its own through MINIO_BUCKET_PREFIX — see docs/application-stacks.md.
  bucket-prefix: ""
  http-timeouts:
    connect: 5s
    read: 30s
    write: 60s
  thumbnail:
    enabled: true
    max-dimension: 200
    quality: 0.85
  buckets:
    configuration: configuration
    text: text
    images: images
    documents: documents
    audio: audio
    video: video
    archives: archives
    logs: logs
  mime-types:
    "application/json": logs
    "application/xml": configuration
    "application/yaml": configuration
    "application/x-yaml": configuration
    "audio/mpeg": audio
    "audio/wav": audio
    "audio/ogg": audio
    "image/png": images
    "image/jpeg": images
    "image/gif": images
    "image/svg+xml": images
    "image/webp": images
    "image/x-icon": images
    "application/javascript": text
    "application/msword": documents
    "application/pdf": documents
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document": documents
    "application/vnd.ms-excel": documents
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": documents
    "application/vnd.ms-powerpoint": documents
    "application/vnd.openxmlformats-officedocument.presentationml.presentation": documents
    "application/x-tar": archives
    "application/x-rar-compressed": archives
    "application/x-7z-compressed": archives
    "application/x-log": logs
    "application/zip": archives
    "video/mp4": video
    "video/mpeg": video
    "video/quicktime": video
    "text/css": text
    "text/plain": documents
    "text/markdown": text
    "text/html": text
    "text/x-log": logs
