# Default entity definitions and sample objects of the 'processpuzzle-testbed' organization —
# the tenant behind apps/processpuzzle-testbed.
#
# DefaultEntityLoader imports this file on startup when `base-entity.loadDefaultEntities` is true. The
# owning organization is the part of the file name before `-entities.yaml`, exactly as `<orgKey>-apps.yaml`
# works in base-app and `<orgKey>-widgets.yaml` in base-widget.
#
# Existing definitions and entity instances are never overwritten or duplicated.

entityDefinitions:
  # 1. Embedded component definition: dynamic-embedded-address
  - code: dynamic-embedded-address
    name: Dynamic Embedded Address
    description: >-
      Embedded address component demonstrating street, city, postal code and country attributes.
    status: ACTIVE
    isEmbedded: true
    componentParents:
      - dynamic-entity
    attributes:
      - code: street
        name: Street
        displayOrder: 1
        valueKind: TEXT
        formControlType: TEXT
        required: true
      - code: city
        name: City
        displayOrder: 2
        valueKind: TEXT
        formControlType: TEXT
        required: true
      - code: postalCode
        name: Postal Code
        displayOrder: 3
        valueKind: TEXT
        formControlType: TEXT
      - code: country
        name: Country
        displayOrder: 4
        valueKind: TEXT
        formControlType: TEXT

  # 2. Embedded component definition: dynamic-embedded-detail
  - code: dynamic-embedded-detail
    name: Dynamic Embedded Detail
    description: >-
      Embedded detail key-value item with an optional note.
    status: ACTIVE
    isEmbedded: true
    componentParents:
      - dynamic-entity
    attributes:
      - code: detailKey
        name: Key
        displayOrder: 1
        valueKind: TEXT
        formControlType: TEXT
        required: true
      - code: detailValue
        name: Value
        displayOrder: 2
        valueKind: TEXT
        formControlType: TEXT
        required: true
      - code: detailNote
        name: Note
        displayOrder: 3
        valueKind: TEXT
        formControlType: TEXTAREA

  # 3. Main dynamic entity definition showcasing all attribute types
  - code: dynamic-entity
    name: Dynamic Entity
    description: >-
      Comprehensive demonstration entity definition showcasing all supported attribute value kinds and form control types.
    status: ACTIVE
    isEmbedded: false
    componentParents: [ ]
    attributes:
      - code: name
        name: Name
        displayOrder: 1
        valueKind: TEXT
        formControlType: TEXT
        required: true
        isLinkToDetails: true
        indexed: true
      - code: description
        name: Description
        displayOrder: 2
        valueKind: TEXT
        formControlType: TEXTAREA
      - code: numberAttr
        name: Number
        displayOrder: 3
        valueKind: NUMBER
        formControlType: NUMBER
        indexed: true
      - code: booleanAttr
        name: Boolean
        displayOrder: 4
        valueKind: BOOLEAN
        formControlType: BOOLEAN
        defaultValue: true
      - code: dateAttr
        name: Date
        displayOrder: 5
        valueKind: DATE
        formControlType: DATE
      - code: dateTimeAttr
        name: Date Time
        displayOrder: 6
        valueKind: DATE_TIME
        formControlType: DATE_TIME
      - code: enumAttr
        name: Status
        displayOrder: 7
        valueKind: ENUM
        formControlType: ENUM_SELECT
        enumValues:
          - DRAFT
          - IN_PROGRESS
          - COMPLETED
          - ARCHIVED
        defaultValue: DRAFT
      - code: tags
        name: Tags
        displayOrder: 8
        valueKind: TEXT
        formControlType: TEXT
        isMultiValued: true
      - code: artifact
        name: Artifact
        displayOrder: 9
        valueKind: REFERENCE
        formControlType: ARTIFACT
      - code: parentRef
        name: Parent Reference
        displayOrder: 10
        valueKind: REFERENCE
        formControlType: FOREIGN_KEY
        linkedEntityType: dynamic-entity
      - code: embeddedAddress
        name: Embedded Address
        displayOrder: 11
        valueKind: REFERENCE
        formControlType: EMBEDDED_COMPONENTS
        linkedEntityType: dynamic-embedded-address
        isMultiValued: false
      - code: embeddedDetails
        name: Embedded Details
        displayOrder: 12
        valueKind: REFERENCE
        formControlType: EMBEDDED_COMPONENTS
        linkedEntityType: dynamic-embedded-detail
        isMultiValued: true

  # 4. Embedded component definition: order-line
  #
  # An order line is carried inside its order's payload rather than existing on its own, so it has no
  # back-reference to the order: the containment *is* the relation. This is why it also has no list or
  # detail route of its own — CreateEntityInstanceUseCase refuses instances of an embedded definition.
  - code: order-line
    name: Order Line
    description: >-
      A single product line of an order: what was ordered, how many, and at what unit price.
    status: ACTIVE
    isEmbedded: true
    componentParents:
      - order
    attributes:
      - code: productName
        name: Product
        displayOrder: 1
        valueKind: TEXT
        formControlType: TEXT_BOX
        required: true
        isLinkToDetails: true
      - code: quantity
        name: Quantity
        displayOrder: 2
        valueKind: NUMBER
        formControlType: TEXT_BOX
        required: true
      - code: unitPrice
        name: Unit Price
        displayOrder: 3
        valueKind: NUMBER
        formControlType: TEXT_BOX
        required: true

  # 5. Order — the entity the sample rules in base-rule and the sample documents in base-document
  # are written against (context/entityType 'Order').
  - code: order
    name: Order
    description: >-
      Customer order with its line items, demonstrating an entity whose rules span the parent and its
      embedded children.
    status: ACTIVE
    isEmbedded: false
    componentParents: [ ]
    attributes:
      - code: orderNumber
        name: 'Order #'
        displayOrder: 1
        valueKind: TEXT
        formControlType: TEXT_BOX
        required: true
        isLinkToDetails: true
        indexed: true
      - code: customerName
        name: Customer
        displayOrder: 2
        valueKind: TEXT
        formControlType: TEXT_BOX
        required: true
      - code: status
        name: Status
        displayOrder: 3
        valueKind: ENUM
        formControlType: DROPDOWN
        enumValues:
          - DRAFT
          - CONFIRMED
          - SHIPPED
          - DELIVERED
          - CANCELLED
        defaultValue: DRAFT
      - code: total
        name: Total
        displayOrder: 4
        valueKind: NUMBER
        formControlType: TEXT_BOX
      - code: shippingAddress
        name: Shipping Address
        displayOrder: 5
        valueKind: TEXT
        formControlType: TEXTAREA
      - code: lineItems
        name: Line Items
        displayOrder: 6
        valueKind: REFERENCE
        formControlType: EMBEDDED_COMPONENTS
        linkedEntityType: order-line
        isMultiValued: true

