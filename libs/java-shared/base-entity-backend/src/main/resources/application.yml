spring:
  application:
    name: base-entity-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/processpuzzle
    username: ${DB_USERNAME:processpuzzle}
    password: ${DB_PASSWORD:processpuzzle}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
