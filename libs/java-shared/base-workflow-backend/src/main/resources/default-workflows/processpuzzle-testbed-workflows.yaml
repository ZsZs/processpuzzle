# Default workflow definitions for the 'processpuzzle-testbed' organization —
# the tenant behind apps/processpuzzle-testbed.
#
# DefaultWorkflowImporter imports this file on startup when `base-workflow.loadDefaultWorkflows` is true.
# The owning organization is the part of the file name before `-workflows.yaml`, exactly as
# `<orgKey>-entities.yaml` works in base-entity, `<orgKey>-state-machines.yaml` in base-state,
# `<orgKey>-apps.yaml` in base-app, and `<orgKey>-widgets.yaml` in base-widget.
#
# SPEM-inspired coupling to base-state (see processpuzzle-testbed-state-machines.yaml's 'order' machine):
#   - Task.completionStateTriggerKey: completing this task fires this triggerKey against the state
#     machine instance bound to the work product named in its 'outputs' (or 'inputs', for tasks with no
#     BASE_ENTITY output). Proposed field — not yet present in base-workflow-backend's domain model,
#     since that module currently has no Java source on this branch. Introducing it here so the sample
#     data doubles as the spec for Task when the hexagonal implementation is built.
#   - Task.preconditionStateKey: the reverse gate — this task cannot be started unless the order's
#     current state equals this key. Complements the existing preconditionRuleId, which gates on a
#     base-rule PPCL rule instead of on state.
#
# 'cancel' is a valid trigger on the order state machine but is deliberately not fired by any task here:
# cancellation is an out-of-band action on the order itself, not a step in the normal fulfillment path.

processes:
  - id: order-fulfillment-workflow
    name: Order Fulfillment Workflow
    description: >-
      Tiny end-to-end workflow governing order review, shipment approval, and delivery confirmation in
      the testbed environment. Each task's completion advances the order's state machine by exactly one
      transition, and each task after the first is gated on the order already being in the right state.
    tools:
      - automated-check-tool
    roles:
      - id: clerk
        name: Order Clerk
        description: Responsible for initial order entry, verification, and delivery confirmation.
        entityRoleId: clerk-role
      - id: manager
        name: Order Manager
        description: Approves orders for shipment.
        entityRoleId: manager-role
    workProducts:
      - id: order-entity
        name: Order Entity
        description: The order being processed through its lifecycle.
        type: ENTITY
        entityTypeId: order
        stateMachineId: order
      - id: fulfillment-invoice
        name: Fulfillment Invoice
        description: Generated invoice document for a delivered order.
        type: DELIVERABLE
    tasks:
      - id: review-order
        name: Review Order
        description: Review order details and validate line items before confirming it for fulfillment.
        performedBy: clerk
        inputs:
          - type: BASE_ENTITY
            refId: order
            label: New Order
        outputs:
          - type: BASE_ENTITY
            refId: order
            label: Reviewed Order
        preconditionRuleId: positive-quantities
        completionStateTriggerKey: confirm
        dependsOn: [ ]
        parallel: false
        steps:
          - id: check-items
            name: Check Line Items
            description: Verify all line items are available in inventory.
            toolId: automated-check-tool
            toolOperation: inventory-check

      - id: approve-shipment
        name: Approve Shipment
        description: Manager approval to release a confirmed order for shipment.
        performedBy: manager
        inputs:
          - type: BASE_ENTITY
            refId: order
            label: Confirmed Order
        outputs:
          - type: BASE_ENTITY
            refId: order
            label: Approved Order
        preconditionStateKey: CONFIRMED
        completionStateTriggerKey: ship
        dependsOn:
          - review-order
        parallel: false
        steps:
          - id: manager-signoff
            name: Manager Sign-off
            description: Sign off on releasing the order for shipment.

      - id: confirm-delivery
        name: Confirm Delivery
        description: Confirm the shipped order has reached the customer and generate the invoice.
        performedBy: clerk
        inputs:
          - type: BASE_ENTITY
            refId: order
            label: Shipped Order
        outputs:
          - type: DOCUMENT
            refId: fulfillment-invoice
            label: Delivery Confirmation & Invoice
        preconditionStateKey: SHIPPED
        completionStateTriggerKey: deliver
        dependsOn:
          - approve-shipment
        parallel: false
        steps:
          - id: generate-invoice
            name: Generate Invoice
            description: Produce the delivery confirmation and final invoice.
            toolId: automated-check-tool
            toolOperation: generate-doc
