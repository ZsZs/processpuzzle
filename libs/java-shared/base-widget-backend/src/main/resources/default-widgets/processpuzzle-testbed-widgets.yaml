# Default widget definitions of the 'processpuzzle-testbed' organization — the tenant behind
# apps/processpuzzle-testbed-frontend.
#
# DefaultWidgetLoader imports this file on startup when `base-widget.loadDefaultWidgets` is true. The
# owning organization is the part of the file name before `-widgets.yaml`, exactly as `<orgKey>-apps.yaml`
# works in base-app, so seeding another tenant is adding another file rather than a configuration change.
#
# There is no `organization` block, unlike a default-apps file: a widget definition is keyed by
# (orgKey, key) and this module has no organization registry to provision one in. See
# DefaultWidgetsDocument.
#
# Every entry is precisely the payload of `POST /organizations/{orgKey}/widget-definitions`, so it
# passes through the same mapper and the same key/port validation as a definition a designer saves.
# Keys are lowercase-hyphen, as the contract's WidgetKey pattern requires.
#
# Every entry below is a copy of a `WidgetRegistration.definition` in base-widget-frontend — each widget's
# `<name>.widget.ts`, beside its component — or, for `content-book`, in base-document-frontend, and the
# catalogue holds nothing else. That is the whole point
# of the file: a palette entry a designer can place is a promise that something will render it, and a key
# with no component behind it is a promise the shell cannot keep — it surfaces only when the app is
# previewed, long after the choice. base-widget-frontend's `widget-contract.spec.ts` compares the two field
# by field, so edit the registration first and copy it here; the spec says which field disagrees. They
# arrive as drafts: publishing is the designer's decision, and it leaves the Publish action something to do.
#
# Seeding is create-only: a definition already present in an organization is left untouched, so a change
# here reaches a fresh database only — an existing one needs the definition edited or deleted first.
#
# The widgets divide into two kinds, and the difference shows in `propsSchema`. Content widgets are
# configured — they take props and declare a schema for them. Chrome widgets read what they need from the
# application's own providers, so most take no props at all, which an *empty* schema says and a null one
# would not: null means "nobody has described this yet". Every schema closes `additionalProperties`,
# because its properties are exactly the component's inputs.

widgetDefinitions:
  # ── Content widgets ──
  - key: cards-grid
    name: Cards grid
    translocoId: base_widget.cards_grid.name
    description: >-
      A responsive grid of Material cards, each with a title, optional subtitle and text, a background image, action buttons and a menu.
    category: Content
    icon: grid_view
    propsSchema:
      type: object
      properties:
        cards:
          type: array
          title: Cards
          items:
            type: object
            properties:
              title:
                type: string
                title: Title
              subtitle:
                type: string
                title: Subtitle
              icon:
                type: string
                title: Icon
              link:
                type: string
                title: Link
                description: Where clicking the card leads.
              backgroundImage:
                type: string
                title: Background image
                description: A URL or a module asset (module:path), drawn at the bottom left of the card.
              content:
                type: array
                title: Content
                description: The first entry is a paragraph, the rest a bulleted list.
                items:
                  type: string
              actions:
                type: array
                title: Actions
                items:
                  type: object
                  properties:
                    caption:
                      type: string
                    link:
                      type: string
                    buttonType:
                      type: string
                      enum:
                      - text
                      - filled
                      - elevated
                      - outlined
                      - tonal
                  required:
                  - caption
                  - link
              menuItems:
                type: array
                title: Menu items
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    link:
                      type: string
                    icon:
                      type: string
                  required:
                  - label
                  - link
              translocoPrefix:
                type: string
                title: Transloco prefix
            required:
            - title
      required:
      - cards
      additionalProperties: false
    inputPorts:
    - name: cards
      type: ARRAY
      required: true
      description: The cards to render, in order.
  - key: markdown-page
    name: Markdown page
    translocoId: base_widget.markdown_page.name
    description: Renders a Markdown document fetched from a URL.
    category: Content
    icon: article
    propsSchema:
      type: object
      properties:
        markdownSrc:
          type: string
          title: Markdown source
          description: URL of the document to render, or module:<path> for a file the module brought along.
      required:
      - markdownSrc
      additionalProperties: false
    inputPorts:
    - name: markdownSrc
      type: STRING
      required: true
      description: URL of the document to render, or module:<path> for a file the module brought along.
  - key: entity-table
    name: Entity table
    translocoId: base_widget.entity_table.name
    description: 'A printable table of objects: the rows bound to a collection, one column per chosen attribute, optionally with a totals row.'
    category: Data
    icon: table_rows
    propsSchema:
      type: object
      properties:
        rows:
          type: array
          title: Rows
          description: The objects to list. Usually bound to a port path rather than typed in.
          items:
            type: object
        columns:
          type: array
          title: Columns
          items:
            type: object
            properties:
              path:
                type: string
                title: Attribute path
              header:
                type: string
                title: Header
              format:
                type: string
                title: Format
              align:
                type: string
                enum:
                - start
                - center
                - end
            required:
            - path
        totals:
          type: array
          title: Totals
          items:
            type: object
            properties:
              path:
                type: string
                title: Attribute path
              aggregate:
                type: string
                enum:
                - sum
                - count
            required:
            - path
            - aggregate
        caption:
          type: string
          title: Caption
      additionalProperties: false
    inputPorts:
    - name: rows
      type: ENTITY_COLLECTION
      required: false
      description: The objects to list, one row each.
  - key: entity-form
    name: Entity form
    translocoId: base_widget.entity_form.name
    description: The generated form of one object, laid out by its entity type and shown in place — without Save, Cancel or Delete.
    category: Data
    icon: article
    propsSchema:
      type: object
      properties:
        entityName:
          type: string
          title: Entity name
          description: The entity type whose form lays the object out.
        readOnly:
          type: boolean
          title: Read only
          description: "Disable every control. On by default: the widget never saves."
          default: true
        entity:
          type: object
          title: Entity
          description: The object to show. Usually bound to a port rather than typed in.
      additionalProperties: false
    inputPorts:
      - name: entity
        type: ENTITY_REF
        required: false
        description: The object to show.
  - key: image-zoom
    name: Image zoom
    translocoId: base_widget.image_zoom.name
    description: An image thumbnail that opens full size on click.
    category: Content
    icon: zoom_in
    propsSchema:
      type: object
      properties:
        src:
          type: string
          title: Image URL
          description: A URL, or module:<path> for an image the module brought along.
          format: uri
        alt:
          type: string
          title: Alternative text
      required:
      - src
      additionalProperties: false
    inputPorts:
    - name: src
      type: STRING
      required: true
      description: URL of the image.
  - key: photo-album
    name: Photo album
    translocoId: base_widget.photo_album.name
    description: Pages through a series of images, each opening full size on click.
    category: Content
    icon: photo_library
    propsSchema:
      type: object
      properties:
        images:
          type: array
          title: Images
          items:
            type: object
            properties:
              src:
                type: string
                format: uri
              alt:
                type: string
            required:
            - src
            - alt
        maxHeight:
          type: string
          title: Maximum height
          description: A CSS length, or a number of pixels. Defaults to 240px.
      required:
      - images
      additionalProperties: false
    inputPorts:
    - name: images
      type: ARRAY
      required: true
      description: The images to page through, in order.

  # ── Chrome widgets ──
  #
  # What a header or footer region is made of. The first three read the application's name, logo and
  # navigation from the shell's APPLICATION_CONTEXT, so in an application's own header they need no props.
  - key: app-logo
    name: Application logo
    translocoId: base_widget.app_logo.name
    description: A small logo linking home. Defaults to the logo of the application it is placed in.
    category: Navigation
    icon: image
    propsSchema:
      type: object
      properties:
        logo:
          type: object
          format: artifact
          title: Logo
          description: An uploaded image; overrides the application's logo.
        alt:
          type: string
          title: Alternative text
        link:
          type: string
          title: Link
          description: Route the logo navigates to. Defaults to /; empty for no link.
      additionalProperties: false
  - key: app-title
    name: Application title
    translocoId: base_widget.app_title.name
    description: >-
      The application's name as a heading, coloured by the theme. Defaults to the name of the application it is placed
      in.
    category: Navigation
    icon: title
    propsSchema:
      type: object
      properties:
        title:
          type: string
          title: Title
          description: Overrides the application's name, e.g. inside a document.
      additionalProperties: false
    inputPorts:
    - name: title
      type: STRING
      required: false
      description: The text of the heading.
  - key: nav-bar
    name: Navigation bar
    translocoId: base_widget.nav_bar.name
    description: >-
      The application's navigation as a row of links, a group opening a drop-down. Hidden on small screens, where the
      navigation menu takes over.
    category: Navigation
    icon: more_horiz
    propsSchema:
      type: object
      properties:
        visibility:
          type: string
          title: Visibility
          enum:
          - large-screens
          - always
          description: Defaults to large screens; on a small one the navigation menu takes over.
        items:
          type: array
          title: Items
          description: Overrides the application's navigation.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              translocoId:
                type: string
              icon:
                type: string
              routePath:
                type: string
              children:
                type: array
            required:
            - id
            - label
      additionalProperties: false
  - key: nav-menu
    name: Navigation menu
    translocoId: base_widget.nav_menu.name
    description: >-
      The application's navigation as a drop-down menu, standing in for the sidenav on small screens.
    category: Navigation
    icon: menu
    propsSchema:
      type: object
      properties:
        visibility:
          type: string
          title: Visibility
          enum:
          - small-screens
          - always
          description: Defaults to small screens, where the sidenav is hidden.
        items:
          type: array
          title: Items
          description: Overrides the application's navigation.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              translocoId:
                type: string
              icon:
                type: string
              routePath:
                type: string
              children:
                type: array
            required:
            - id
            - label
      additionalProperties: false
  - key: spacer
    name: Spacer
    translocoId: base_widget.spacer.name
    description: >-
      Empty space that fills the row, pushing the widgets after it to the far end. Two spacers centre the widgets
      between them.
    category: Layout
    icon: space_bar
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: navigate-back
    name: Navigate back
    translocoId: base_widget.navigate_back.name
    description: Returns to the previous page of the navigation history.
    category: Navigation
    icon: arrow_back
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: language-selector
    name: Language selector
    translocoId: base_widget.language_selector.name
    description: Switches the active language, listing the locales the application was configured with.
    category: Navigation
    icon: translate
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: themes-button
    name: Themes button
    translocoId: base_widget.themes_button.name
    description: >-
      Lets the user pick one of the theme presets and a light, dark or automatic colour scheme. Inside an application
      it overrides that application's theme and is remembered per application.
    category: Navigation
    icon: palette
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
    outputPorts:
    - name: themeChange
      type: OBJECT
      description: The selection, preset and colour scheme, after every change the user makes.
  - key: like-button
    name: Like button
    translocoId: base_widget.like_button.name
    description: >-
      A toggle that counts likes of the current application, persisted through the application property store.
    category: Social
    icon: thumb_up
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: share-button
    name: Share button
    translocoId: base_widget.share_button.name
    description: Shares the current page to the social networks the application enabled.
    category: Social
    icon: share
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: version-button
    name: Version button
    translocoId: base_widget.version_button.name
    description: Shows the running application's version, read from its runtime configuration.
    category: System
    icon: info
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: design-button
    name: Design button
    translocoId: base_widget.design_button.name
    description: >-
      Toggles between the application and its designer, under the route prefix the application provides.
    category: Navigation
    icon: design_services
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: task-dashboard-button
    name: Task dashboard button
    translocoId: base_widget.task_dashboard_button.name
    description: >-
      Leads to the workflow task dashboard, at the route the application provides, and marks itself while it is open.
    category: Navigation
    icon: checklist
    propsSchema:
      type: object
      properties: {}
      additionalProperties: false
  - key: copyright
    name: Copyright
    translocoId: base_widget.copyright.name
    description: A copyright notice, prefixed with the © sign.
    category: System
    icon: copyright
    propsSchema:
      type: object
      properties:
        text:
          type: string
          title: Text
          description: The notice after the © sign, e.g. "2026 ProcessPuzzle".
      required:
      - text
      additionalProperties: false
    inputPorts:
    - name: text
      type: STRING
      required: true
      description: The notice after the © sign.
  # Registered by base-document-frontend rather than base-widget-frontend — a widget that reads documents
  # would close a dependency cycle there. content-book-widget.contract.spec.ts holds this copy to it.
  - key: content-book
    name: Content book
    translocoId: base_document.content_book._self
    description: >-
      A book of documents: its table of contents as a tree, in the sidenav when there is one, and the
      selected page beside it. Editors arrange the pages in place.
    category: Content
    icon: menu_book
    propsSchema:
      type: object
      properties:
        bookSlug:
          type: string
          title: Book
          description: Slug of the content book to show.
        locale:
          type: string
          title: Language
          description: Language the pages are read in; the active language when left empty.
        sidenav:
          type: boolean
          title: Contents in the sidenav
          description: Show the table of contents in the application sidenav instead of beside the page.
          default: true
        startDocumentSlug:
          type: string
          title: First page
          description: Slug of the document opened first; the first page of the book when left empty.
      required:
      - bookSlug
      additionalProperties: false
    inputPorts:
    - name: bookSlug
      type: STRING
      required: true
      description: Slug of the content book to show.
    outputPorts:
    - name: documentSelected
      type: STRING
      description: Slug of the document the reader opens.
