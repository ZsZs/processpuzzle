<div>
  <ng-container>
    <h1>Registration Form</h1>
    <form ngNoForm aria-label="Registration Form">
      <label for="testFormName">Name</label>
      <input id="testFormName" type="password" [formField]="testForm.name" />
      <label for="testFormEmail">Email</label>
      <input id="testFormEmail" type="email" [formField]="testForm.email" />
    </form>
  </ng-container>
</div>
