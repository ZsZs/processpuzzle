@if (config().visible) {
  <div class="row" [formGroup]="formGroup">
    <mat-form-field>
      <mat-label [attr.for]="config().attrName">{{ config().i18nKey() | ppLabel: config().label }}</mat-label>
      <input matInput [type]="config().options.inputType" [id]="config().attrName" formControlName="{{ config().attrName }}" />
    </mat-form-field>
  </div>
}
