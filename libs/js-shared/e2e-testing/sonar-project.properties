# Project
sonar.projectKey=processpuzzle_e2e_testing
sonar.projectName=processpuzzle_e2e_testing
sonar.organization=processpuzzle
sonar.sourceEncoding=UTF-8
sonar.projectBaseDir=./
sonar.sources=src
sonar.exclusions=src/public-api.ts
sonar.test.inclusions=src/**/*.spec.ts
# What drives a browser cannot be covered by a unit test that means anything: a page object is right when its
# selectors match the DOM the application renders, and only a real run answers that. The generated suites do
# exactly that against a real application in CI, so these are excluded here rather than covered dishonestly by
# assertions against a mocked Locator, which would pass whatever the application's markup said.
sonar.coverage.exclusions=src/lib/pages/**, src/lib/suites/**, src/lib/setup/**, src/lib/data/entity-crud-fixture-manager.ts
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint/eslint.json
