<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#C6922C"/>
      <stop offset="100%" stop-color="#8A5A12"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="goldShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="70%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="50%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#26C6DA"/>
    </linearGradient>

    <!-- Glow Filter for Magic Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Text and Elements -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="250" cy="250" r="230" fill="url(#goldOuter)" stroke="#5A3A05" stroke-width="10"/>
  <circle cx="250" cy="250" r="205" fill="#1E4D8C" stroke="#12325C" stroke-width="8"/>

  <!-- Shield -->
  <g filter="url(#shadow)">
    <path d="M 150,160 C 150,160 250,130 250,130 C 250,130 350,160 350,160 C 350,280 250,360 250,360 C 250,360 150,280 150,160 Z" 
          fill="url(#goldShield)" stroke="#5A3A05" stroke-width="8" stroke-linejoin="round"/>
    <!-- Inner Shield Inset -->
    <path d="M 165,172 C 165,172 250,146 250,146 C 250,146 335,172 335,172 C 335,270 250,340 250,340 C 250,340 165,270 165,172 Z" 
          fill="#C6922C" opacity="0.4"/>
  </g>

  <!-- Scroll (Behind Sword) -->
  <g filter="url(#shadow)">
    <path d="M 190,200 C 190,200 310,190 310,210 C 310,230 190,240 190,260 C 190,280 310,270 310,270" 
          fill="#F5E6C8" stroke="#5A3A05" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Scroll Roll Details -->
    <path d="M 190,200 C 180,200 175,210 185,215 M 310,270 C 320,270 325,260 315,255" 
          fill="none" stroke="#5A3A05" stroke-width="5"/>
    <line x1="210" y1="222" x2="280" y2="217" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="242" x2="260" y2="238" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sword -->
  <g filter="url(#shadow)">
    <!-- Magic Aura -->
    <path d="M 250,100 L 280,200 L 250,310 L 220,200 Z" fill="#E0F7FA" opacity="0.6" filter="url(#glow)"/>
    
    <!-- Blade -->
    <path d="M 250,110 L 275,200 L 265,290 L 250,305 L 235,290 L 225,200 Z" 
          fill="url(#bladeGrad)" stroke="#12325C" stroke-width="6" stroke-linejoin="round"/>
    <!-- Blade Center Line -->
    <line x1="250" y1="120" x2="250" y2="295" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Crossguard -->
    <path d="M 200,200 C 220,200 230,215 250,215 C 270,215 280,200 300,200 C 305,215 290,230 270,225 C 250,225 250,230 250,230 C 250,230 250,225 230,225 C 210,230 195,215 200,200 Z" 
          fill="url(#goldShield)" stroke="#5A3A05" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Hilt & Pommel -->
    <rect x="242" y="225" width="16" height="45" rx="5" fill="#5A3A05" stroke="#301B02" stroke-width="4"/>
    <circle cx="250" cy="280" r="16" fill="url(#goldShield)" stroke="#5A3A05" stroke-width="5"/>
    <circle cx="250" cy="280" r="6" fill="#26C6DA"/>
    
    <!-- Crossguard Gem -->
    <polygon points="250,205 258,213 250,221 242,213" fill="#26C6DA" stroke="#12325C" stroke-width="3"/>
  </g>

  <!-- Sparkles -->
  <path d="M 320,180 L 325,195 L 340,200 L 325,205 L 320,220 L 315,205 L 300,200 L 315,195 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 170,250 L 173,260 L 183,263 L 173,266 L 170,276 L 167,266 L 157,263 L 167,260 Z" fill="#FFE885" opacity="0.8"/>

  <!-- "DEMO" Text Banner -->
  <g filter="url(#shadow)">
    <text x="250" y="385" 
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-size="64" 
          font-weight="900" 
          fill="#FFE885" 
          stroke="#5A3A05" 
          stroke-width="12" 
          paint-order="stroke fill" 
          text-anchor="middle" 
          letter-spacing="4">DEMO</text>
  </g>
</svg>
