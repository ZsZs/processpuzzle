networks:
  processpuzzle:
    driver: bridge

services:
  processpuzzle-testbed-frontend:
    depends_on:
      - json-server
    image:
      zsuffazs/processpuzzle-testbed-frontend:IMAGE_TAG
    container_name: processpuzzle-testbed-frontend
    ports:
      - "8080:80"
    networks:
      - processpuzzle
  json-server:
    image: zsuffazs/json-server:IMAGE_TAG
    container_name: json-server
    ports:
      - "3000:3000"
    networks:
      - processpuzzle

  # ── The testbed stack's backend ─────────────────────────────────────────────────────────────────
  #
  # One instance owning one stack's database, realm and bucket prefix — see
  # docs/application-stacks.md. This file used to run the same image twice, fronted by
  # processpuzzle-admin-frontend and processpuzzle-biz-frontend; both, and the admin backend, are now
  # the private processpuzzle-biz repository's — see docs/platform-admin-extraction.md.
  #
  # TWO GAPS THAT MOVE LEFT BEHIND, both deliberate and both for the re-platform (strategy §§4-5, 9)
  # rather than for the extraction:
  #
  #   1. Nothing here publishes port 80 or reverse-proxies /api/ any more, so this backend has no
  #      public origin. It is not published on purpose — being reached through a frontend's /api/
  #      location is what puts the browser and the backend on one origin, which is what lets token
  #      validation work with a single URL (jwks-base-url stays unset and falls back to
  #      issuer-base-url). Publishing it directly would need PROCESSPUZZLE_SECURITY_JWKS_BASE_URL
  #      set, as docker-compose-ci.yaml does.
  #   2. PUBLIC_APP_ORIGIN below, and PUBLIC_ADMIN_ORIGIN in keycloak, named the two moved
  #      frontends' public URLs. Keycloak stays public because it is shared infrastructure
  #      (strategy §8), so PUBLIC_ADMIN_ORIGIN still means "where the shared Keycloak is served",
  #      but no service in this file answers on it.
  #
  # docker-compose-ci.yaml is unaffected: it publishes this backend on 8080 directly, with both
  # token-validation URLs set, and is the topology CI actually runs.
  testbed-backend:
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    image: zsuffazs/processpuzzle-testbed-backend:IMAGE_TAG
    container_name: testbed-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/processpuzzle_testbed
      SPRING_DATASOURCE_USERNAME: ${PROCESSPUZZLE_DB_USERNAME:-processpuzzle}
      SPRING_DATASOURCE_PASSWORD: ${PROCESSPUZZLE_DB_PASSWORD}
      PROCESSPUZZLE_SECURITY_STACK_REALM: processpuzzle-testbed
      MINIO_BUCKET_PREFIX: processpuzzle-testbed

      # No KEYCLOAK_ADMIN_CLIENT_SECRET: provisioning tenants is a staff action, so only the admin
      # instance gets the credential. The identity ports fall back to their no-ops here.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth

      PROCESSPUZZLE_SECURITY_ISSUER_BASE_URL: ${PUBLIC_APP_ORIGIN}/auth
      PROCESSPUZZLE_SECURITY_REQUIRE_AUTHENTICATION: "true"
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      retries: 3
      timeout: 5s
      interval: 20s
      start_period: 30s

  keycloak:
    depends_on:
      postgres:
        condition: service_healthy
    image: zsuffazs/testbed-keycloak:IMAGE_TAG
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}

      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
      # Not published directly; it is served under /auth of the admin origin. Keycloak has to be told
      # that prefix, because it builds the absolute URLs in its discovery document itself — stripping
      # a prefix it does not know about makes it advertise endpoints the browser cannot reach.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_ADMIN_ORIGIN}/auth
      KC_HOSTNAME_STRICT: "true"
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # One-shot: creates the master-realm service account a backend uses to manage realms and users —
  # org-admin here, and platform-admin in the private admin backend. Idempotent, so it re-runs
  # safely on every deployment.
  keycloak-init:
    depends_on:
      keycloak:
        condition: service_healthy
    image: zsuffazs/testbed-keycloak-init:IMAGE_TAG
    container_name: keycloak-init
    environment:
      KC_URL: http://keycloak:8080/auth
      KC_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET}
    networks:
      - processpuzzle
    restart: "no"

  postgres:
    image: zsuffazs/testbed-postgres:IMAGE_TAG
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
