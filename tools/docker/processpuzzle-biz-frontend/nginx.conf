    server {
        listen 80;
        server_name app.processpuzzle.com;
        include /etc/nginx/mime.types;

        root /usr/share/nginx/html;
        index index.html index.htm;

        gzip on;
        gzip_http_version 1.1;
        gzip_disable      "MSIE [1-6]\.";
        gzip_min_length   256;
        gzip_vary         on;
        gzip_proxied      expired no-cache no-store private auth;
        gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_comp_level   9;

        # Every route below the shell is client-side, so an unknown path is the application's to
        # resolve, not a 404. This matters more here than in processpuzzle-admin-frontend: the tenant is the FIRST
        # path segment, so /<orgKey>/admin/organization-user is a URL a user bookmarks and reloads,
        # and there is no directory on disk at any level of it.
        location / {
          try_files $uri $uri/ /index.html;
        }

        # The two same-origin roots `run-time-conf/config.prod.json` names. Only the prod stage uses
        # them: in dev and ci the browser reaches both services on their own published ports, so the
        # configuration carries absolute URLs and these blocks are never hit.
        #
        # `api`, `assets` and `auth` cannot be mistaken for a tenant here — every one of them is in
        # ReservedOrganizationKeys.DEFAULTS, so no organization can ever be given a key that would
        # shadow one of these locations.
        location /api/ {
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host;
          # Still the TESTBED stack backend: this application is the tenant surface today, and turning
          # it into the public site is a later increment. nginx resolves this name at configuration
          # load rather than per request, so it has to name a service that exists in whichever compose
          # file runs this image.
          proxy_pass http://testbed-backend:8080/;
          proxy_ssl_session_reuse off;
          proxy_cache_bypass $http_upgrade;
          proxy_redirect off;
        }

        # Keycloak is mounted here rather than proxied to its root, because it builds the absolute URLs
        # in its discovery document from the incoming request. Stripping a prefix it does not know about
        # would make it advertise endpoints the browser cannot reach — hence `KC_HTTP_RELATIVE_PATH:
        # /auth` on the service, and no trailing slash on `proxy_pass` here.
        location /auth/ {
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host;
          proxy_pass http://keycloak:8080;
          proxy_ssl_session_reuse off;
          proxy_redirect off;
        }
    }
