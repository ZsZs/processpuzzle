    # ── Country domains → the .com host, with a language prefix ─────────────────────────────────
    #
    # `testbed.processpuzzle.hu/base-entity` becomes `testbed.processpuzzle.com/hu/base-entity`, and
    # the same for the other three languages the application ships. The prefix is then the
    # application's business: `LocaleUrlSerializer` in @processpuzzle/util strips it off the URL and
    # makes it the active transloco language. Without that half, this redirect would only move the
    # user to a `.com` URL that SAYS `hu` and renders English.
    #
    # The country code doubles as the language code, which is why there is no map here: `.hu` → `hu`,
    # `.fr` → `fr`, `.es` → `es`, one domain per language in
    # `LANGUAGE_CONFIGURATION.AVAILABLE_LANGUAGES`. `en` has no country domain because `.com` IS its
    # domain; an `en` visitor is never redirected and picks the prefix up from the serializer on the
    # first navigation. `de` is a language with a domain and still absent from the regexes — for a
    # reason that is not linguistic; see the ⚠ note below. Adding a language therefore means three
    # things, not one: the transloco bundles, an entry in the runtime configuration, and the code in
    # the two regexes below.
    #
    # `$redirect_scheme` rather than `$scheme`, because TLS terminates at Coolify's proxy and this
    # server only ever sees plain HTTP. `$scheme` would emit `http://` and cost the visitor a second
    # round trip through the proxy's own HTTPS redirect — on a 301, which browsers cache.
    #
    # DEPLOYMENT PREREQUISITE, and it is not in this file: the country domains have to be registered
    # in DNS, pointed at the host, and added to the Coolify resource's domain list so its proxy
    # requests certificates for them and routes them here at all. Until that is done nginx never
    # sees the hostname and these blocks are dead config rather than a broken redirect.
    map $http_x_forwarded_proto $redirect_scheme {
        default $scheme;
        "~.+"   $http_x_forwarded_proto;
    }

    # The redirect target's path. `$request_uri` verbatim, except at the root, where it would append a
    # slash the prefix does not need: `/fr/` rather than `/fr`. The application resolves both, but they
    # are two URLs for one page, and the one a country domain hands out should be the canonical one.
    map $request_uri $localized_request_uri {
        default $request_uri;
        "/"     "";
    }

    # `api`, `auth` and `minio` are excluded because they are not language variants of anything: they
    # are the backend, Keycloak and the S3 endpoint (stage-deployment-runbook.md §"Domains"). Coolify
    # routes those hostnames to their own containers, so they should never arrive here in the first
    # place — the exclusion is what keeps a proxy misconfiguration from turning into a 301 that breaks
    # token issuance and every presigned URL, instead of a visible 404.
    #
    # `[^.]+` is ONE label on purpose, so `testbed.stage.processpuzzle.de` does not match. Stage lives
    # under a second label and must keep serving the application rather than redirecting.
    #
    # ⚠ `de` IS DELIBERATELY ABSENT FROM BOTH REGEXES, though German is one of the five languages.
    # `.de` is still an infrastructure domain: `apps/processpuzzle-testbed-e2e/env/.env.prod` points
    # production's own frontend at `https://testbed.processpuzzle.de` and Coolify routes that
    # hostname here, so matching it would 301 production to `testbed.processpuzzle.com/de/` on the
    # next deploy — right once that host is live and registered, a redirect to nowhere until then.
    # Meanwhile German is reachable exactly as before: through the language selector, and through
    # `/de/…` deep links, which the serializer resolves whatever domain they arrive on. Add `de`
    # back to both regexes in the change that finishes the `.de` → `.com` move — the one that also
    # retargets `.env.prod` and the prod env files — and not before.
    server {
        listen 80;
        server_name ~^(?!api\.|auth\.|minio\.)(?<stack>[^.]+)\.processpuzzle\.(?<country>hu|fr|es)$;
        return 301 $redirect_scheme://$stack.processpuzzle.com/$country$localized_request_uri;
    }

    # The apex, for visitors who drop the subdomain. Separate because the regex above requires one.
    server {
        listen 80;
        server_name ~^processpuzzle\.(?<country>hu|fr|es)$;
        return 301 $redirect_scheme://processpuzzle.com/$country$localized_request_uri;
    }

    server {
        # `default_server`, and it has to be said out loud now that this file holds more than one block.
        # nginx makes the FIRST block on a port the default for a Host it does not recognize, which the
        # country-domain redirect above now is — so a request with an unknown or absent Host (a health
        # check, the container's IP, a misconfigured proxy) would be answered with a 301 built from
        # capture groups that never matched: `http://.processpuzzle.com//base-entity`. Serving the
        # application to an unrecognized Host is both the old behaviour and the right one.
        listen 80 default_server;
        server_name testbed.processpuzzle.com;
        include /etc/nginx/mime.types;

        root /usr/share/nginx/html;
        index index.html index.htm;

        gzip on;
        gzip_http_version 1.1;
        gzip_disable      "MSIE [1-6]\.";
        gzip_min_length   256;
        gzip_vary         on;
        gzip_proxied      expired no-cache no-store private auth;
        gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_comp_level   9;

        location / {
          try_files $uri $uri/ /index.html;
        }

        # The platform's own backend, SAME-ORIGIN. `BACKEND_SERVICE_ROOT` and `OBJECT_STORE_SERVICE_ROOT`
        # in config.{ci,stage,prod}.json are relative `/api` paths, the pattern the admin, biz and custom
        # frontends already follow. The browser therefore never makes a cross-origin call to the
        # platform, and CORS drops out of the testbed's failure modes: until 2026-09-24 the backend sat on
        # its own hostname, which another stack's backend also claimed, and a request Traefik routed there
        # came back as a bare 403 that the browser could only report as "Failed to fetch".
        #
        # Resolved per request for the same reason as /third-party/ below: a backend redeploy puts the
        # container on a new address, and a literal proxy_pass would keep the old one until this
        # container restarted too. The `rewrite` strips the prefix for the same reason as well.
        #
        # 50m matches spring.servlet.multipart.max-request-size in the backend; nginx's own 1m default
        # would turn every larger artifact upload into a 413 before it reached Spring.
        location /api/ {
          resolver 127.0.0.11 valid=10s ipv6=off;
          set $backend_upstream "http://testbed-backend:8080";
          rewrite ^/api/(.*)$ /$1 break;

          client_max_body_size 50m;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $redirect_scheme;
          proxy_set_header X-Forwarded-Prefix /api;
          proxy_pass $backend_upstream;
          proxy_redirect off;
        }

        # The json-server mock, which stands in for the THIRD-PARTY REST sources an application
        # integrates with — not for the platform's own backend, which is proxied at /api/ above.
        # `THIRD_PARTY_ROOT` in config.{stage,prod}.json names this prefix.
        location /third-party/ {
          # RE-RESOLVED PER REQUEST, and that is the whole point of the next three lines.
          # `proxy_pass http://json-server:3000/` names a literal host, which nginx resolves ONCE at
          # config load and caches for the life of the process. The infrastructure resource is a
          # separate Coolify resource with its own redeploy, and every redeploy recreates the
          # json-server container on a NEW address on the shared network — after which this container
          # holds a dead IP and answers 502 until it is itself redeployed.
          #
          # A `resolver` plus a VARIABLE in proxy_pass defers resolution to request time; 127.0.0.11 is
          # Docker's embedded DNS, which answers for the compose service alias. `ipv6=off` because it
          # also answers AAAA on some daemons and nginx would then dial an address the network has no
          # route for.
          #
          # The `rewrite` is not optional: the prefix-stripping that a literal `proxy_pass …:3000/`
          # performs is NOT applied once the directive contains a variable — the original URI would be
          # forwarded whole and json-server would 404 on /third-party/application-properties.
          #
          # The trade-off: nginx no longer refuses to start with `host not found in upstream`
          # (stage-deployment-runbook.md:422) when the frontend is off the infrastructure network. That
          # check moves from boot to the first request, which costs a fail-fast signal and buys a
          # frontend that serves the application when only the third-party mock is missing.
          resolver 127.0.0.11 valid=10s ipv6=off;
          set $third_party_upstream "http://json-server:3000";
          rewrite ^/third-party/(.*)$ /$1 break;

          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-NginX-Proxy true;
          proxy_pass $third_party_upstream;
          proxy_ssl_session_reuse off;
          proxy_set_header Host $http_host;
          proxy_cache_bypass $http_upgrade;
          proxy_redirect off;
        }
    }
