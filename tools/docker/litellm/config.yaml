# Model aliases the platform uses. The backend names only the alias (processpuzzle.ai.assistant.model),
# so switching vendor or model is an edit here, not a release of the backend. The provider keys come
# from the environment of the container (see docker-compose-infrastructure.yaml).
#
# Default: Mistral (Paris) on a pay-as-you-go account, alias on mistral-small. The free tier is
# unusable: it refuses mistral-large (403 tier_not_allowed) and rate limits mistral-small (429), and
# its inputs may be used for training. Pay-as-you-go lifts the limits; check Settings > Privacy in the
# Mistral console for the data terms before real customer data goes through, and keep demo data until
# then. mistral-large-latest is a one-line change here once the account is confirmed to allow it.
# Scaleway Generative APIs (France, 1M free tokens, no training on API data) is the drop-in
# alternative: model openai/mistral-large-3 (or gpt-oss-120b) with
# api_base https://api.scaleway.ai/v1 and api_key os.environ/SCW_SECRET_KEY.
model_list:
  - model_name: pp-designer
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

general_settings:
  # Every caller (each stack's backend) authenticates with this key; bare in compose, so a deployment
  # that forgets it fails instead of running an open gateway.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Prompts and completions are customer data: do not write them to the gateway's logs.
  turn_off_message_logging: true
