# ── The shared infrastructure layer ─────────────────────────────────────────────────────────────
#
# PostgreSQL, Keycloak (+ its one-shot bootstrap), MinIO, json-server and pgweb: the services every
# application stack shares — see docs/application-stacks.md. One definition serves `ci`, `stage` and
# `prod`; what differs between them is an env file, not a second compose file. This is the
# "Docker Compose resource" of docs/build-deploy-strategy.md §4, while each application image is its
# own Application resource — which is why the applications live in docker-compose-apps.yaml.
#
# Every `${VAR:-…}` default below is the current CI value, so this file is correct for local
# development. The three credentials docker-compose-prod.yaml already guarded keep the `:?` form: a
# deployment that forgets one fails at `up` instead of silently at the first request. `.env.ci`
# supplies them, so `npm run stack-up` still needs no setup.
#
#   docker compose -p processpuzzle --env-file tools/docker/env/.env.ci \
#     -f tools/docker/docker-compose-infrastructure.yaml \
#     -f tools/docker/docker-compose-apps.yaml up -d --wait
#
# Four of these images are built rather than pulled, because they bake configuration that has to
# travel with the image: 10-init-db.sh, keycloak/import/*-realm.json,
# bootstrap-platform-admin-client.sh and init-minio.sh. json-server bakes
# tools/mock-backend/db.json. pgweb adds nothing to the upstream image, so it is referenced by a
# pinned tag.

networks:
  processpuzzle:
    # Named explicitly so a per-app Coolify Application resource can join it as `external`.
    name: ${PP_NETWORK:-processpuzzle}
    driver: bridge

services:
  json-server:
    pull_policy: build
    build:
      context: ../../
      dockerfile: tools/docker/json-server/Dockerfile
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-json-server:${PP_IMAGE_TAG:-latest}
    container_name: json-server
    ports:
      - "${PP_JSON_SERVER_PUBLISH:-3000:3000}"
    tty: true
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:3000/test-entity" ]

  keycloak:
    build:
      context: ../../
      dockerfile: tools/docker/keycloak/Dockerfile
      args:
        CICD_STAGE: ci
    container_name: processpuzzle-keycloak
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-keycloak:${PP_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PP_KEYCLOAK_PUBLISH:-7070:8080}"
    environment:
      # Database connection
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      # Admin Credentials (Initial setup only)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}

      # Production settings
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "${KC_HOSTNAME_STRICT:-false}"
      KC_PROXY: "edge"
      # NO KC_HTTP_RELATIVE_PATH HERE. `kc.sh start --optimized` refuses a build-time option supplied
      # at run time: Keycloak logs "build time options have values that differ from what is persisted"
      # and exits 2, taking every service that waits on it down with it. The deleted
      # docker-compose-prod.yaml set it to /auth and would have hit exactly this.
      #
      # So a deployment serves Keycloak at the ROOT of its own hostname — one Coolify resource, one
      # domain — rather than under a path prefix of a shared origin. Serving it under a prefix would
      # mean baking the prefix into the image at `kc.sh build`, which would make the image
      # environment-specific and break the promote-don't-rebuild model (strategy §9).
      #
      # The published port, not the container's. Keycloak builds the issuer and every endpoint in its
      # discovery document from this, and the browser is the only client that follows them.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:7070}
    networks:
      - processpuzzle
    healthcheck:
      # Keycloak 26+ uses port 9000 for management/health by default
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3" ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Failures before this elapses do not count against `retries`. Keycloak needs ~40s on a fresh
      # database and was measured at 96s against a reused one — it spends the difference trying to
      # rejoin jgroups peers a previous container recorded. Without this the three retries are spent
      # before it listens, the container is declared unhealthy, and every service that waits on it —
      # every application stack's backend — refuses to start, seconds before Keycloak finishes
      # coming up.
      start_period: 150s

  keycloak-init:
    pull_policy: build
    build:
      context: ../../
      dockerfile: tools/docker/keycloak/init/Dockerfile
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-keycloak-init:${PP_IMAGE_TAG:-latest}
    container_name: processpuzzle-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # `create-realm` is a role of the master realm, and --import-realm skips a realm that already
      # exists, so the service account the backend uses cannot come from a realm import file. This
      # one-shot container creates it with the Admin CLI instead; it is idempotent, so it re-runs
      # safely on every `compose up`.
      KC_URL: ${KC_INTERNAL_URL:-http://keycloak:8080}
      KC_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be set}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:-platform-admin-secret}
    networks:
      - processpuzzle
    restart: "no"

  minio:
    build:
      context: ../../
      dockerfile: tools/docker/minio/Dockerfile
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-minio:${PP_IMAGE_TAG:-latest}
    container_name: processpuzzle-minio
    ports:
      - "${PP_MINIO_API_PUBLISH:-7000:9000}"          # S3 API
      - "${PP_MINIO_CONSOLE_PUBLISH:-7001:9001}"      # Web Console
    environment:
      # Root credentials (admin)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # Spring Boot service account credentials
      MINIO_SERVICE_USER: ${MINIO_SERVICE_USER:-springboot}
      MINIO_SERVICE_PASSWORD: ${MINIO_SERVICE_PASSWORD:-springboot123}
    volumes:
      - minio-data:/data
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgweb:
    # Not built: tools/docker/pgweb/Dockerfile was `FROM sosedoff/pgweb:latest` and added nothing, so
    # building and pushing a byte-identical image was waste. Pinned rather than `latest`, per
    # docs/build-deploy-strategy.md §2.
    image: sosedoff/pgweb:${PP_PGWEB_VERSION:-0.17.0}
    container_name: processpuzzle-pgweb
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PP_PGWEB_PUBLISH:-8082:8081}"
    environment:
      # The testbed stack, which is the database worth inspecting. Keycloak has its own (`keycloak`)
      # and the admin stack has `processpuzzle_admin`; pgweb shows one at a time, and switching means
      # changing PGWEB_DATABASE.
      PGWEB_DATABASE_URL: postgres://${PROCESSPUZZLE_DB_USERNAME:-processpuzzle}:${PROCESSPUZZLE_DB_PASSWORD:-processpuzzle}@postgres:5432/${PGWEB_DATABASE:-processpuzzle_testbed}?sslmode=disable
    command: [ "pgweb", "--bind=0.0.0.0", "--listen=8081", "--prefix=/pgweb" ]
    networks:
      - processpuzzle

  postgres:
    build:
      context: ../../
      dockerfile: tools/docker/postgresql/Dockerfile
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-postgres:${PP_IMAGE_TAG:-latest}
    container_name: processpuzzle-postgres
    ports:
      - "${PP_POSTGRES_PUBLISH:-5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Keycloak owns this database and this role. The per-stack application databases and the
      # `processpuzzle` role that owns them are created by tools/docker/postgresql/10-init-db.sh,
      # which the entrypoint runs ONLY on an empty data directory — an existing postgres_data volume
      # will not have them. Reset with `npm run stack-clean`, which is also what makes a renamed
      # Keycloak realm appear, since --import-realm skips realms that exist.
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      # Read by 10-init-db.sh for the application role it creates. A .sql file in
      # /docker-entrypoint-initdb.d/ cannot read an environment variable, which is why that script is
      # a shell script: it is the only way prod gets a different application password.
      PROCESSPUZZLE_DB_USERNAME: ${PROCESSPUZZLE_DB_USERNAME:-processpuzzle}
      PROCESSPUZZLE_DB_PASSWORD: ${PROCESSPUZZLE_DB_PASSWORD:-processpuzzle}
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
    driver: local
  postgres_data:
