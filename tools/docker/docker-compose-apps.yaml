# ── The application layer ───────────────────────────────────────────────────────────────────────
#
# The testbed stack's frontend and backend: the "Docker Compose resource" of
# docs/build-deploy-strategy.md §4 for the application layer, one resource per application *stack*.
# §4 originally gave each image its own Application resource; the deployed topology is one compose
# resource holding both halves, because a Coolify resource reads exactly ONE compose file and the
# webhook that redeploys it redeploys the whole file. The price is that both halves restart together;
# what it buys is compose ordering the backend ahead of the frontend with no workflow step to do it.
#
# So this file is the DEPLOYABLE one, not the CI one — the same inversion
# docker-compose-infrastructure.yaml already went through. It is therefore:
#
# - PULL-ONLY. No `build:` section, `pull_policy: always`. Coolify runs `docker compose build --pull`
#   before `up`, with `--project-directory` set to the repo root: a relative `build.context` would
#   resolve against *that* rather than against this file's directory, and both Dockerfiles are
#   packaging-only (`COPY dist/…`), so a clone with no `dist/` fails with `"/dist/apps/…": not
#   found`. A local rebuild would also put different bytes under the promoted `:stage` / `:prod` tag
#   (strategy §9, §11).
# - JOINED to the infrastructure resource's network as `external`, rather than declaring it. The
#   frontend's nginx resolves `proxy_pass http://json-server:3000/` at startup, so without the join
#   nginx does not even boot.
# - FREE of `depends_on` entries naming infrastructure services. Coolify runs this file alone, where
#   `keycloak`, `postgres`, `minio`, `json-server` and `keycloak-init` do not exist. The one
#   `depends_on` that survives — frontend → backend — names a service defined right here.
#
# Every `${VAR:-…}` default below is the current CI value, so the file is correct for local
# development. .env.stage / .env.prod carry the two that cannot take a CI default
# (APP_CORS_ALLOWED_ORIGINS and PROCESSPUZZLE_SECURITY_ISSUER_BASE_URL — a wrong value there is a
# CORS failure and a 401, not a fallback).
#
# CI and local development overlay the pieces this file gives up:
#
#   docker compose -p processpuzzle --env-file tools/docker/env/.env.ci \
#     -f tools/docker/docker-compose-infrastructure.yaml \
#     -f tools/docker/docker-compose-apps.yaml \
#     -f tools/docker/docker-compose-build.yaml \
#     -f tools/docker/docker-compose-apps-local.yaml up -d --wait --build
#
# ORDER MATTERS: the overlays must come *after* this file, or its `external: true` and its missing
# `depends_on` win over theirs.
#
# Both images are on GHCR alongside the infrastructure ones, published by
# .github/workflows/build-testbed-apps.yml. The Docker Hub coordinates they used to carry went with
# the `build-image` action: two registries publishing the same application is one more than the
# promote-don't-rebuild model can reason about.

networks:
  processpuzzle:
    # The infrastructure resource owns this network; this resource joins it. `name` is what makes the
    # join possible — see docker-compose-infrastructure.yaml:32. docker-compose-apps-local.yaml flips
    # `external` back to false for the single-project CI and local topology, where the two layers
    # share one compose project and compose creates the network itself.
    external: true
    name: ${PP_NETWORK:-processpuzzle}

services:
  processpuzzle-testbed-frontend:
    pull_policy: always
    depends_on:
      # The only surviving `depends_on`: both services are defined in this file, so compose orders
      # them under Coolify with no overlay. The frontend's healthcheck calls /home, and a browser
      # reaching it before the API answers is the first thing anyone notices.
      testbed-backend:
        condition: service_healthy
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-testbed-frontend:${PP_IMAGE_TAG:-latest}
    # Shortened to match `testbed-backend`: the two halves of one stack, named the same way. The
    # SERVICE keeps the long name, because that is the Nx project and the image, and the overlays and
    # the `npm run stack-up` service arguments all name it.
    container_name: testbed-frontend
    environment:
      # What selects run-time-conf/config.<stage>.json out of the bundle, and therefore the one
      # variable that makes a promoted `sha-<commit>` behave like a stage or a prod deployment.
      PIPELINE_STAGE: ${PIPELINE_STAGE:-ci}
      # Empty by default and empty everywhere: Firebase was removed in 1465575b / 7076cae2 and
      # main.ts reads it as `env.FIREBASE_API_KEY ?? ''`. Kept only because the entrypoint still
      # templates assets/runtime-env.json from it; a `${FIREBASE_API_KEY}` with no default would
      # interpolate to nothing in Coolify, which is the same value, only reached by an error.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
    ports:
      - "${PP_TESTBED_FRONTEND_PUBLISH:-9090:80}"
    tty: true
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:80/home" ]
      retries: 3
      timeout: 5s
      interval: 20s

  # ── One backend deployment per application stack ────────────────────────────────────────────────
  #
  # One instance, one stack: its PostgreSQL database, its Keycloak realm and its MinIO bucket prefix
  # — see docs/application-stacks.md. The application stays single-tenant and the decoupling is a
  # property of the deployment, not of logic inside it.
  #
  # This file used to run the same image twice, as testbed-backend and admin-backend. The staff
  # stack's backend is now processpuzzle-admin-backend in the private processpuzzle-biz repository,
  # which composes platform-admin on top of these same libraries — see
  # docs/platform-admin-extraction.md. The realms both stacks use are declared in
  # docker-compose-infrastructure.yaml, because a realm is shared infrastructure rather than
  # something a backend provisions for itself.
  testbed-backend:
    pull_policy: always
    image: ${PP_IMAGE_REGISTRY:-ghcr.io/zszs}/processpuzzle-testbed-backend:${PP_IMAGE_TAG:-latest}
    container_name: testbed-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-ci}

      # The testbed stack: database, realm and bucket prefix all name it. PostgreSQL is reached over
      # the compose network, so the host is the service name and not the published port.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/processpuzzle_testbed}
      SPRING_DATASOURCE_USERNAME: ${PROCESSPUZZLE_DB_USERNAME:-processpuzzle}
      SPRING_DATASOURCE_PASSWORD: ${PROCESSPUZZLE_DB_PASSWORD:-processpuzzle}
      PROCESSPUZZLE_SECURITY_STACK_REALM: ${PROCESSPUZZLE_SECURITY_STACK_REALM:-processpuzzle-testbed}
      MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX:-processpuzzle-testbed}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_SERVICE_USER:-springboot}
      MINIO_SECRET_KEY: ${MINIO_SERVICE_PASSWORD:-springboot123}

      # TWO endpoints, and they differ for the same reason the Keycloak pair does. MINIO_ENDPOINT
      # above is what this container calls; this one is baked into every PRESIGNED URL, which only
      # the BROWSER ever follows — MinioConfig builds a second client from it for exactly that. Left
      # at its `minio-config.yaml` default (http://localhost:7000) a stage deployment hands the
      # browser presigned URLs naming localhost, so uploads and downloads fail while every other
      # store call succeeds. It therefore needs MinIO published under a hostname of its own.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:7000}

      # Only the origins of this stack. An origin missing here reaches the frontend as HTTP status 0
      # with nothing to explain it; an origin belonging to another stack has no business here. 9090 is
      # the testbed container and 4200 its dev server.
      #
      # Load-bearing on stage and prod, where the CI default is simply wrong: nginx does NOT proxy to
      # the backend, so the browser calls APP_SERVICE_ROOT cross-origin and this list is the only
      # thing that lets it. .env.stage sets it to the frontend's own https origin.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:9090,http://localhost:4200}

      # User management, which is org-admin's. This deployment does not create realms — that went
      # with platform-admin, so KEYCLOAK_ADMIN_TENANT_* is set by the private admin backend and not
      # here. The admin API is reached over the compose network, so this is the service name and not
      # the published port. Without the secret the identity ports fall back to their no-op
      # implementations and every other feature still works — see KeycloakAdminProperties.
      KEYCLOAK_ADMIN_URL: ${KC_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:-platform-admin-secret}

      # Token validation needs BOTH URLs, and here they genuinely differ. The issuer is the origin the
      # BROWSER was redirected to: a token minted at localhost:7070 does not validate against an
      # http://keycloak:8080 issuer, and Keycloak advertises the browser-facing origin however its
      # discovery document is fetched. That origin does not resolve inside this container, so the
      # signing keys have to be read over the compose network instead.
      #
      # Reading them from the issuer URL is what made every authenticated request answer 500 — see
      # TenantAuthenticationManagerResolver. A single-origin deployment sets only the first of these,
      # which is what a single-hostname reverse proxy in front of both arranges for prod.
      #
      # The issuer must equal KC_HOSTNAME of the infrastructure resource, to the character. Left at
      # the CI default on stage it rejects every token minted by the real Keycloak, so .env.stage
      # sets it explicitly.
      PROCESSPUZZLE_SECURITY_ISSUER_BASE_URL: ${PROCESSPUZZLE_SECURITY_ISSUER_BASE_URL:-http://localhost:7070}
      PROCESSPUZZLE_SECURITY_JWKS_BASE_URL: ${PROCESSPUZZLE_SECURITY_JWKS_BASE_URL:-http://keycloak:8080}
    ports:
      - "${PP_TESTBED_BACKEND_PUBLISH:-8080:8080}"
    tty: true
    networks:
      - processpuzzle
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      retries: 3
      timeout: 5s
      interval: 20s
      # Measured at ~145s originally, and at 262s on 2026-09-05 for a FIRST start against an empty
      # database, where Spring Modulith's ArchUnit module-structure computation is joined by the whole
      # metadata seeding pass. 30s here spent the retries long before the application was listening,
      # so `up` aborted with "container is unhealthy" on an application that was starting perfectly
      # well — and 240s did the same on that first start, three seconds of probing short of the
      # application's own 262s. Hence the headroom: a probe failing inside start_period costs nothing,
      # while one failing outside it takes down every service that waits on this one.
      start_period: 420s
