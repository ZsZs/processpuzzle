# The subject cannot depend on the actions -- Keycloak resolves it from this key alone -- so it is
# worded for activation, the only execute-actions mail the platform sends.
executeActionsSubject=Activate your ProcessPuzzle account
activationGreeting=Hello {0},
activationGreetingNoName=Hello,
activationBody=Welcome to ProcessPuzzle! Your application is ready. To start using it, confirm your email address and choose a password:\n\n{0}\n\nThis link is valid for {1}. If it has expired, reply to this email and we will send you a new one.\n\nIf you did not sign up for ProcessPuzzle, you can safely ignore this email.
activationBodyHtml=<p>Welcome to ProcessPuzzle! Your application is ready. To start using it, confirm your email address and choose a password.</p><p><a href="{0}">Activate my account</a></p><p>This link is valid for {1}. If it has expired, reply to this email and we will send you a new one.</p><p>If you did not sign up for ProcessPuzzle, you can safely ignore this email.</p>
# The invitation an existing account receives when it subscribes to another application. The
# organization's name is {0} in the subject and {3} in the bodies; {4} is how long the link is valid.
orgInviteSubject=Your new ProcessPuzzle application: {0}
orgInviteBody=You subscribed to a new application, "{3}". Accept the invitation to add it to your existing ProcessPuzzle account:\n\n{0}\n\nAfterwards, log in with your usual password; you will find the application in Customer Home. The link is valid for {4}.\n\nIf you did not subscribe, you can safely ignore this email.
orgInviteBodyHtml=<p>You subscribed to a new application, <strong>{3}</strong>. Accept the invitation to add it to your existing ProcessPuzzle account.</p><p><a href="{0}">Accept the invitation</a></p><p>Afterwards, log in with your usual password; you will find the application in Customer Home. The link is valid for {4}.</p><p>If you did not subscribe, you can safely ignore this email.</p>
