activationBody=Willkommen bei ProcessPuzzle! Ihre Anwendung ist bereit. Bestätigen Sie Ihre E-Mail-Adresse und wählen Sie ein Passwort, um loszulegen:\n\n{0}\n\nDer Link ist {1} gültig. Ist er abgelaufen, antworten Sie einfach auf diese E-Mail, und wir senden Ihnen einen neuen.\n\nWenn Sie sich nicht bei ProcessPuzzle registriert haben, können Sie diese E-Mail ignorieren.
activationBodyHtml=<p>Willkommen bei ProcessPuzzle! Ihre Anwendung ist bereit. Bestätigen Sie Ihre E-Mail-Adresse und wählen Sie ein Passwort, um loszulegen.</p><p><a href="{0}">Konto aktivieren</a></p><p>Der Link ist {1} gültig. Ist er abgelaufen, antworten Sie einfach auf diese E-Mail, und wir senden Ihnen einen neuen.</p><p>Wenn Sie sich nicht bei ProcessPuzzle registriert haben, können Sie diese E-Mail ignorieren.</p>
orgInviteSubject=Ihre neue ProcessPuzzle-Anwendung: {0}
orgInviteBody=Sie haben eine neue Anwendung abonniert: „{3}“. Nehmen Sie die Einladung an, um sie Ihrem bestehenden ProcessPuzzle-Konto hinzuzufügen:\n\n{0}\n\nMelden Sie sich danach mit Ihrem gewohnten Passwort an; Sie finden die Anwendung in Customer Home. Der Link ist {4} gültig.\n\nWenn Sie nichts abonniert haben, können Sie diese E-Mail ignorieren.
orgInviteBodyHtml=<p>Sie haben eine neue Anwendung abonniert: <strong>{3}</strong>. Nehmen Sie die Einladung an, um sie Ihrem bestehenden ProcessPuzzle-Konto hinzuzufügen.</p><p><a href="{0}">Einladung annehmen</a></p><p>Melden Sie sich danach mit Ihrem gewohnten Passwort an; Sie finden die Anwendung in Customer Home. Der Link ist {4} gültig.</p><p>Wenn Sie nichts abonniert haben, können Sie diese E-Mail ignorieren.</p>
