# The ProcessPuzzle sign-in page: Keycloak's keycloak.v2 login theme (so every flow that has no template here
# - required actions such as VERIFY_PROFILE, registration, reset - still works, and is styled) with login.ftl replaced by the <pp-login-form> Angular Element. The bundle,
# resources/js/main.js, is built by apps/login-element (nx run login-element:package-login-theme).
parent=keycloak.v2
# Parent's own stylesheet first, then the ProcessPuzzle backdrop.
styles=css/styles.css css/pp-login.css
