    server {
        listen 80;
        server_name admin.processpuzzle.com;
        include /etc/nginx/mime.types;

        root /usr/share/nginx/html;
        index index.html index.htm;

        gzip on;
        gzip_http_version 1.1;
        gzip_disable      "MSIE [1-6]\.";
        gzip_min_length   256;
        gzip_vary         on;
        gzip_proxied      expired no-cache no-store private auth;
        gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_comp_level   9;

        # Every route below the shell is client-side, so an unknown path is the application's to
        # resolve, not a 404. Without this a reload on /organization/<id> returns nginx's error page.
        location / {
          try_files $uri $uri/ /index.html;
        }

        # The two same-origin roots `run-time-conf/config.prod.json` names. Only the prod stage uses
        # them: in dev and ci the browser reaches both services on their own published ports, so the
        # configuration carries absolute URLs and these blocks are never hit.
        location /api/ {
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host;
          # The ADMIN stack backend — one backend deployment per stack, see docs/application-stacks.md.
          # nginx resolves this name when it loads the configuration, not on the first request, so a
          # service name that does not exist keeps the container from starting at all. It has to match
          # a service in whichever compose file runs this image, ci and prod alike.
          proxy_pass http://admin-backend:8080/;
          proxy_ssl_session_reuse off;
          proxy_cache_bypass $http_upgrade;
          proxy_redirect off;
        }

        # Keycloak is mounted here rather than proxied to its root, because it builds the absolute URLs
        # in its discovery document from the incoming request. Stripping a prefix it does not know about
        # would make it advertise endpoints the browser cannot reach — hence `KC_HTTP_RELATIVE_PATH:
        # /auth` on the service, and no trailing slash on `proxy_pass` here.
        location /auth/ {
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Host $http_host;
          proxy_pass http://keycloak:8080;
          proxy_ssl_session_reuse off;
          proxy_redirect off;
        }
    }
