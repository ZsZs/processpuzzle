<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ProcessPuzzle build and deployment flow</title>
<desc>Platform libraries and the testbed app live in the processpuzzle repo; the biz repo consumes those libraries via git submodule. Both repos build per-app images through GitHub Actions, push to a container registry, then deploy onto Coolify as independent app resources sharing one infrastructure layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7f77dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="680" fill="#ffffff"/>

<!-- Row A: platform libraries banner (processpuzzle repo) -->
<rect x="40" y="40" width="580" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="52" y="62" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Platform libraries (processpuzzle repo, libs/)</text>
<text x="52" y="84" font-family="sans-serif" font-size="12" fill="#3C3489">base-entity, base-state, base-workflow, frontend building blocks, e2e-testing</text>

<!-- Row B: testbed app vs biz repo -->
<rect x="40" y="134" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="180" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">processpuzzle repo</text>
<text x="180" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">testbed frontend + backend</text>

<rect x="360" y="134" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="500" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">processpuzzle-biz repo</text>
<text x="500" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">admin + biz frontend/backend</text>

<!-- arrows from platform libs -->
<line x1="330" y1="104" x2="180" y2="132" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="330" y1="104" x2="500" y2="132" stroke="#7f77dd" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>

<!-- arrows down to GitHub Actions -->
<line x1="180" y1="190" x2="325" y2="242" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="190" x2="355" y2="242" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="244" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">GitHub Actions</text>
<text x="340" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">build &amp; push image per app</text>

<line x1="340" y1="300" x2="340" y2="352" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="210" y="354" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="371" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Container registry</text>
<text x="340" y="389" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">GHCR, tagged per app &amp; env</text>

<line x1="340" y1="398" x2="340" y2="446" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Coolify container -->
<rect x="60" y="448" width="560" height="190" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75" stroke-dasharray="0"/>
<text x="90" y="480" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Coolify on VPS</text>
<text x="90" y="498" font-family="sans-serif" font-size="12" fill="#993C1D">one platform, independent app lifecycles</text>

<rect x="90" y="510" width="250" height="100" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="215" y="548" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#412402">App deployments</text>
<text x="215" y="568" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">independent lifecycle per app</text>

<rect x="360" y="510" width="230" height="100" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
<text x="475" y="548" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#173404">Shared infrastructure</text>
<text x="475" y="568" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">Postgres, Keycloak, MinIO</text>

<line x1="340" y1="560" x2="358" y2="560" stroke="#888780" stroke-width="0.75" stroke-dasharray="3 3"/>
</svg>
