<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="360" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#111" text-anchor="start">One temporary VPS runs the whole platform; a second one generates the load</text><rect x="262" y="64" width="474" height="272" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="278" y="88" font-size="13" font-weight="600" fill="#111" text-anchor="start">System under test: one temporary VPS</text><path d="M224 136H278" stroke="#555" stroke-width="1.25" fill="none" marker-end="url(#a)"/><path d="M438 136H470" stroke="#555" stroke-width="1.25" fill="none" marker-end="url(#a)"/><path d="M540 164V196" stroke="#555" stroke-width="1.25" fill="none" marker-end="url(#a)"/><path d="M652 164V196" stroke="#555" stroke-width="1.25" fill="none" marker-end="url(#a)"/><path d="M490 164V180H346V196" stroke="#555" stroke-width="1.25" fill="none" marker-end="url(#a)"/><rect x="24" y="108" width="200" height="88" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="40" y="132" font-size="13" font-weight="600" fill="#111" text-anchor="start">Load generator</text><text x="40" y="148" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">k6 on a temporary VPS</text><text x="40" y="164" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">Scripts from Playwright HAR</text><text x="40" y="180" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">Export results, then delete</text><text x="24" y="216" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">Firewall on the system under</text><text x="24" y="232" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">test allows only this IP</text><rect x="24" y="264" width="200" height="56" rx="8" stroke="#555" stroke-width="1.25" fill="none" stroke-dasharray="4 4"/><text x="40" y="288" font-size="13" font-weight="600" fill="#666" text-anchor="start">Staging at netcup</text><text x="40" y="304" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">never a target</text><rect x="278" y="108" width="160" height="56" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="358.0" y="132" font-size="13" font-weight="600" fill="#111" text-anchor="middle">Frontend</text><text x="358.0" y="148" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">nginx, Angular + /api</text><rect x="470" y="108" width="250" height="56" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="595.0" y="132" font-size="13" font-weight="600" fill="#111" text-anchor="middle">Backend</text><text x="595.0" y="148" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">Spring Boot, processpuzzle-store</text><rect x="278" y="196" width="136" height="56" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="346.0" y="220" font-size="13" font-weight="600" fill="#111" text-anchor="middle">Keycloak</text><text x="346.0" y="236" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">authentication</text><rect x="431" y="196" width="136" height="56" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="499.0" y="220" font-size="13" font-weight="600" fill="#111" text-anchor="middle">PostgreSQL</text><text x="499.0" y="236" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">EAV/JSONB data</text><rect x="584" y="196" width="136" height="56" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="652.0" y="220" font-size="13" font-weight="600" fill="#111" text-anchor="middle">MinIO</text><text x="652.0" y="236" font-size="11.5" font-weight="400" fill="#666" text-anchor="middle">uploaded files</text><rect x="278" y="276" width="442" height="44" rx="8" stroke="#555" stroke-width="1.25" fill="none" /><text x="499" y="302" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Monitoring profile: Prometheus, Grafana, cAdvisor, exporters</text></svg>