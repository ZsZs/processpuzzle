# =============================================================================
# SailRC applied to the commons concept (shared-data-commons-concept.md), v2, 2026-11-16.
# Four parts of processpuzzle-biz/business-starters/sailrc/, shown as YAML documents:
#   1. manifest.yaml              tenant bundle (installed into every subscribing yacht club)
#   2. common/manifest.yaml       common bundle (installed once into sailrc-common)
#   3. common/entities/*.yaml     the sharing policy lives on the shared entity definitions
#   4. entities/*.yaml            a club's own types refer to the shared ones
# Domain-specific; belongs in the biz repository once the concept is implemented.
# =============================================================================

# --- 1. manifest.yaml (tenant bundle) ----------------------------------------
manifestVersion: 2
id: sailrc
name: SailRC Regatta Management
version: 1.0.0
author: ProcessPuzzle
license: proprietary
definitionSchemaVersion: 1
common:
  id: sailrc-common
  minVersion: 1.0.0            # install / upgrade refused while the common is older;
                               # rollable out only once this common version is rolled out
contents:
  entities:   [ entities/club-sailor-profile.yaml, entities/race-budget.yaml ]   # the club's own types
  workflows:  [ workflows/regatta-organisation.yaml ]
  modules:    [ modules/race-office.yaml ]
  apps:       [ apps/race-office.yaml ]
migrations: []                 # migrations/<from>-to-<to>.yaml, one per upgrade step
---
# --- 2. common/manifest.yaml (common bundle) ---------------------------------
manifestVersion: 2
kind: common                   # installed into the organization <id>; never into a subscriber
id: sailrc-common
name: SailRC Common Data
version: 1.0.0
author: ProcessPuzzle
license: proprietary
definitionSchemaVersion: 1
contents:
  entities:   [ entities/boat-class.yaml, entities/yacht-club.yaml, entities/race.yaml,
                entities/entry.yaml, entities/result.yaml, entities/boat.yaml, entities/sailor.yaml ]
  states:     [ states/race-lifecycle.yaml, states/entry-lifecycle.yaml ]   # Race's visibleWhen needs its machine
  rules:      [ rules/entry-validation.yaml ]  # rules of shared types are shared too
migrations: []
---
# --- 3. common/entities/*.yaml (excerpts: sharing per shared type) -----------
entityDefinitions:
  - code: boat-class
    name: Boat Class
    sharing: { write: COMMON_ADMIN, visibility: PUBLIC }   # curated by ProcessPuzzle staff
    identifiers: [ [ name ] ]

  - code: yacht-club
    name: Yacht Club
    sharing: { write: OWNER_ORG, visibility: PUBLIC }      # each club maintains its own record
    identifiers: [ [ country, name ] ]

  - code: race
    name: Race
    sharing:
      write: OWNER_ORG                                     # the organising club
      visibility: PUBLIC
      visibleWhen: { state: [ PUBLISHED, IN_PROGRESS, COMPLETED ] }   # drafts stay with the club

  # --- Data of the race: organised by one club, public with the race ------
  - code: entry
    name: Entry
    sharing: { from: race }                                # owner and visibility of the referenced race
    attributes:
      - { code: race, valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: race }
      - { code: boat, valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: boat }
      - { code: helmsman, valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: sailor }

  - code: result
    name: Result
    sharing: { from: race }
    attributes:
      - { code: race,     valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: race }
      - { code: entry,    valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: entry }
      - { code: position, valueKind: NUMBER,    formControlType: NUMBER }

  - code: boat
    name: Boat
    sharing: { write: OWNER_ORG, visibility: PUBLIC }      # global registry: class, sail number, photos
    identifiers: [ [ boatClass, sailNumber ] ]

  - code: sailor
    name: Sailor
    # SELF and per-attribute consent are deferred (concept §7). Until then a club's sailors stay
    # OWNER_ONLY: shared storage and ids, but not visible to other clubs. Consequence: another club sees a
    # public entry whose helmsman does not resolve — a reason to do the Sailor consent design early.
    sharing: { write: OWNER_ORG, visibility: OWNER_ONLY }
---
# --- 4. entities/*.yaml (tenant side: own types referring to shared ones) ----
# References point into the common, never out of it (concept §3.5): entry and result are shared types
# above, because other clubs must see them; what only the club needs stays here.
entityDefinitions:
  # Instead of extending the shared Sailor: the club's own type, referring to it.
  - code: club-sailor-profile
    name: Club Sailor Profile
    attributes:
      - { code: sailor,           valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: sailor }
      - { code: membershipStatus, valueKind: ENUM,      formControlType: ENUM_SELECT }
      - { code: internalNotes,    valueKind: TEXT,      formControlType: TEXTAREA }

  - code: race-budget
    name: Race Budget
    attributes:
      - { code: race,     valueKind: REFERENCE, formControlType: LOOKUP, linkedEntityType: race }
      - { code: entryFee, valueKind: NUMBER,    formControlType: NUMBER }
      - { code: costs,    valueKind: NUMBER,    formControlType: NUMBER }
