<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Custom org provisioning and authentication flow</title>
<desc>Flowchart: Admin provisions a Keycloak Organization and admin user, then seeds tenant data via processpuzzle-backend. A user later logs into their org frontend, receives a token carrying the organization claim, and OrganizationGuard checks that claim against the requested org path.</desc>
<style>
  text { font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .c-coral rect  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral text  { fill: #712B13; }
  .c-coral .ts   { fill: #993C1D; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple text { fill: #26215C; }
  .c-purple .ts  { fill: #534AB7; }
  .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal text   { fill: #04342C; }
  .c-teal .ts    { fill: #0F6E56; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-coral">
<rect x="210" y="40" width="260" height="56" rx="8"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Admin provisions org</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Keycloak org + first admin</text>
</g>
<line x1="340" y1="96" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="210" y="156" width="260" height="56" rx="8"/>
<text class="th" x="340" y="176" text-anchor="middle" dominant-baseline="central">Admin seeds tenant data</text>
<text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">Calls processpuzzle-backend API</text>
</g>
<line x1="340" y1="212" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="210" y="272" width="260" height="56" rx="8"/>
<text class="th" x="340" y="292" text-anchor="middle" dominant-baseline="central">User logs in</text>
<text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">{orgName}-frontend, PKCE flow</text>
</g>
<line x1="340" y1="328" x2="340" y2="388" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="210" y="388" width="260" height="56" rx="8"/>
<text class="th" x="340" y="408" text-anchor="middle" dominant-baseline="central">Token carries org claim</text>
<text class="ts" x="340" y="428" text-anchor="middle" dominant-baseline="central">Organizations feature (KC 26+)</text>
</g>
<line x1="340" y1="444" x2="340" y2="504" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="210" y="504" width="260" height="56" rx="8"/>
<text class="th" x="340" y="524" text-anchor="middle" dominant-baseline="central">OrganizationGuard checks</text>
<text class="ts" x="340" y="544" text-anchor="middle" dominant-baseline="central">Compares claim to :orgKey path</text>
</g>
</svg>
