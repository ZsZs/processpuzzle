<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Backend module composition across the four ProcessPuzzle apps</title>
<desc>Structural diagram showing which modules each of the four backend deployables (Testbed, Biz, Admin, Custom) includes: core platform libs, platform-admin, new-application-seed, subscription, and testbed seed-reset, plus the Biz-to-Admin REST edge.</desc>
<style>
  text { font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 400; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal text  { fill: #085041; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral text { fill: #712B13; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .c-amber text { fill: #633806; }
  .c-pink rect  { fill: #FBEAF0; stroke: #993556; stroke-width: 0.5; }
  .c-pink text  { fill: #72243E; }
  .c-gray rect  { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray text  { fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="40" y="40" width="130" height="160" rx="12"/>
<rect class="box" x="186" y="40" width="130" height="160" rx="12"/>
<rect class="box" x="332" y="40" width="130" height="160" rx="12"/>
<rect class="box" x="478" y="40" width="130" height="160" rx="12"/>

<text class="th" x="105" y="64" text-anchor="middle" dominant-baseline="central">Testbed</text>
<text class="th" x="251" y="64" text-anchor="middle" dominant-baseline="central">Biz</text>
<text class="th" x="397" y="64" text-anchor="middle" dominant-baseline="central">Admin</text>
<text class="th" x="543" y="64" text-anchor="middle" dominant-baseline="central">Custom</text>

<g class="c-teal"><rect x="50" y="90" width="110" height="22" rx="6"/><text class="ts" x="105" y="101" text-anchor="middle" dominant-baseline="central">Core platform</text></g>
<g class="c-gray"><rect x="50" y="118" width="110" height="22" rx="6"/><text class="ts" x="105" y="129" text-anchor="middle" dominant-baseline="central">Seed reset</text></g>

<g class="c-pink"><rect x="196" y="90" width="110" height="22" rx="6"/><text class="ts" x="251" y="101" text-anchor="middle" dominant-baseline="central">Subscription</text></g>

<g class="c-teal"><rect x="342" y="90" width="110" height="22" rx="6"/><text class="ts" x="397" y="101" text-anchor="middle" dominant-baseline="central">Core platform</text></g>
<g class="c-coral"><rect x="342" y="118" width="110" height="22" rx="6"/><text class="ts" x="397" y="129" text-anchor="middle" dominant-baseline="central">Platform-admin</text></g>
<g class="c-amber"><rect x="342" y="146" width="110" height="22" rx="6"/><text class="ts" x="397" y="157" text-anchor="middle" dominant-baseline="central">New-app-seed</text></g>

<g class="c-teal"><rect x="488" y="90" width="110" height="22" rx="6"/><text class="ts" x="543" y="101" text-anchor="middle" dominant-baseline="central">Core platform</text></g>

<line x1="251" y1="200" x2="251" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="251" y1="230" x2="397" y2="230" stroke="#5F5E5A" stroke-width="0.5" fill="none"/>
<line x1="397" y1="230" x2="397" y2="202" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="324" y="248" text-anchor="middle">REST: create subscription / org</text>
</svg>
