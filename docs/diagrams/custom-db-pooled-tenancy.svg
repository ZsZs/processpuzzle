<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pooled multi-tenant schema for Custom, with Admin as the org registry</title>
<desc>Structural diagram: PROCESSPUZZLE_CUSTOM is a single shared schema where every table's primary key includes orgKey. PROCESSPUZZLE_ADMIN holds the Organisations and Subscriptions registry, which is the source of orgKey values.</desc>
<style>
  text { font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal text  { fill: #085041; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral text { fill: #712B13; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="40" y="40" width="380" height="180" rx="14"/>
<text class="th" x="60" y="62">PROCESSPUZZLE_CUSTOM — pooled schema</text>

<g class="c-teal"><rect x="60" y="90" width="340" height="26" rx="6"/><text class="ts" x="230" y="103" text-anchor="middle" dominant-baseline="central">base-entity (orgKey, id)</text></g>
<g class="c-teal"><rect x="60" y="124" width="340" height="26" rx="6"/><text class="ts" x="230" y="137" text-anchor="middle" dominant-baseline="central">base-workflow (orgKey, id)</text></g>
<g class="c-teal"><rect x="60" y="158" width="340" height="26" rx="6"/><text class="ts" x="230" y="171" text-anchor="middle" dominant-baseline="central">base-state (orgKey, id)</text></g>

<rect class="box" x="460" y="40" width="180" height="180" rx="14"/>
<text class="th" x="480" y="62">PROCESSPUZZLE_ADMIN</text>

<g class="c-coral"><rect x="480" y="90" width="140" height="26" rx="6"/><text class="ts" x="550" y="103" text-anchor="middle" dominant-baseline="central">Organisations</text></g>
<g class="c-coral"><rect x="480" y="124" width="140" height="26" rx="6"/><text class="ts" x="550" y="137" text-anchor="middle" dominant-baseline="central">Subscriptions</text></g>

<text class="ts" x="440" y="118" text-anchor="middle">orgKey</text>
<line x1="460" y1="130" x2="420" y2="130" class="arr" marker-end="url(#arrow)"/>
</svg>
