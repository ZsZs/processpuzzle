<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Frontend shell composition across the four ProcessPuzzle apps</title>
<desc>Structural diagram showing which UI libs each of the four frontend shells includes: shared UI libs, role picker, subscription UI, platform-admin UI, and per-org config.</desc>
<style>
  text { font-family: -apple-system, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.5; }
  .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal text  { fill: #085041; }
  .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .c-coral text { fill: #712B13; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .c-amber text { fill: #633806; }
  .c-pink rect  { fill: #FBEAF0; stroke: #993556; stroke-width: 0.5; }
  .c-pink text  { fill: #72243E; }
  .c-gray rect  { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray text  { fill: #444441; }
</style>

<rect class="box" x="40" y="40" width="130" height="120" rx="12"/>
<rect class="box" x="186" y="40" width="130" height="120" rx="12"/>
<rect class="box" x="332" y="40" width="130" height="120" rx="12"/>
<rect class="box" x="478" y="40" width="130" height="120" rx="12"/>

<text class="th" x="105" y="64" text-anchor="middle" dominant-baseline="central">Testbed</text>
<text class="th" x="251" y="64" text-anchor="middle" dominant-baseline="central">Biz</text>
<text class="th" x="397" y="64" text-anchor="middle" dominant-baseline="central">Admin</text>
<text class="th" x="543" y="64" text-anchor="middle" dominant-baseline="central">Custom</text>

<g class="c-teal"><rect x="50" y="90" width="110" height="22" rx="6"/><text class="ts" x="105" y="101" text-anchor="middle" dominant-baseline="central">Shared UI libs</text></g>
<g class="c-gray"><rect x="50" y="118" width="110" height="22" rx="6"/><text class="ts" x="105" y="129" text-anchor="middle" dominant-baseline="central">Role picker</text></g>

<g class="c-pink"><rect x="196" y="90" width="110" height="22" rx="6"/><text class="ts" x="251" y="101" text-anchor="middle" dominant-baseline="central">Subscription</text></g>

<g class="c-teal"><rect x="342" y="90" width="110" height="22" rx="6"/><text class="ts" x="397" y="101" text-anchor="middle" dominant-baseline="central">Shared UI libs</text></g>
<g class="c-coral"><rect x="342" y="118" width="110" height="22" rx="6"/><text class="ts" x="397" y="129" text-anchor="middle" dominant-baseline="central">Platform-admin</text></g>

<g class="c-teal"><rect x="488" y="90" width="110" height="22" rx="6"/><text class="ts" x="543" y="101" text-anchor="middle" dominant-baseline="central">Shared UI libs</text></g>
<g class="c-amber"><rect x="488" y="118" width="110" height="22" rx="6"/><text class="ts" x="543" y="129" text-anchor="middle" dominant-baseline="central">Per-org config</text></g>
</svg>
